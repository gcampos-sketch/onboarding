{type:"truefalse",sentence:"'Ich habe Hunger' significa 'Tengo hambre'.",correct:true,tip:"En alemán el hambre se expresa con <b>haben</b>: Ich <b>habe</b> Hunger."},
{type:"match",q:"Conecta pronombre con forma de 'haben'",pairs:[{left:"ich",right:"habe"},{left:"du",right:"hast"},{left:"er/sie",right:"hat"},{left:"wir",right:"haben"}]},
]}
]},
{id:"w_fragen",icon:"❓",title:"Hacer preguntas (W-Fragen)",desc:"Aprende a preguntar: Wer, Was, Wo, Wie, Wann",
steps:[
{type:"teach",title:"Las preguntas W",content:`
<div class="lc-explain">Las preguntas más básicas en alemán empiezan con una <strong>W-Wort</strong> (palabra W):</div>
<table class="grammar-table">
<tr><th>Alemán</th><th>Español</th><th>Ejemplo</th></tr>
<tr><td class="highlight">Wer?</td><td>¿Quién?</td><td>Wer ist das?</td></tr>
<tr><td class="highlight">Was?</td><td>¿Qué?</td><td>Was machst du?</td></tr>
<tr><td class="highlight">Wo?</td><td>¿Dónde?</td><td>Wo wohnst du?</td></tr>
<tr><td class="highlight">Woher?</td><td>¿De dónde?</td><td>Woher kommst du?</td></tr>
<tr><td class="highlight">Wohin?</td><td>¿A dónde?</td><td>Wohin gehst du?</td></tr>
<tr><td class="highlight">Wie?</td><td>¿Cómo?</td><td>Wie heißt du?</td></tr>
<tr><td class="highlight">Wann?</td><td>¿Cuándo?</td><td>Wann kommst du?</td></tr>
<tr><td class="highlight">Warum?</td><td>¿Por qué?</td><td>Warum nicht?</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span>Estructura: <strong>W-Wort + Verbo + Sujeto</strong>. Ejemplo: <strong>Wo</strong> wohnst <strong>du</strong>? (¿Dónde vives tú?)</span></div>`},
{type:"teach",title:"Preguntas Sí/No",content:`
<div class="lc-explain">Para preguntas de sí/no, simplemente pon el <strong>verbo al principio</strong>:</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">Sprichst du Deutsch?</span><span class="ex-es">¿Hablas alemán?</span></div>
<div class="example-row"><span class="ex-de">Bist du müde?</span><span class="ex-es">¿Estás cansado/a?</span></div>
<div class="example-row"><span class="ex-de">Hast du Zeit?</span><span class="ex-es">¿Tienes tiempo?</span></div>
<div class="example-row"><span class="ex-de">Ist das dein Buch?</span><span class="ex-es">¿Es tu libro?</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Responder: <strong>Ja</strong> (sí) o <strong>Nein</strong> (no). Ejemplo: "Sprichst du Deutsch?" → "<strong>Ja</strong>, ein bisschen!" (Sí, ¡un poco!)</span></div>`},
{type:"quiz",title:"Practica preguntas",questions:[
{q:"¿Cómo se dice '¿Dónde?' en alemán?",opts:["Wer","Was","Wo","Wie"],correct:2,tip:"<b>Wo</b> = dónde. Wo wohnst du? = ¿Dónde vives?"},
{q:"'¿Qué haces?' = '_____ machst du?'",opts:["Wo","Wer","Wann","Was"],correct:3,tip:"<b>Was</b> = qué. Was machst du? = ¿Qué haces?"},
{q:"Para preguntar sí/no, el verbo va...",opts:["Al final","Al principio","En el medio","No cambia"],correct:1,tip:"En preguntas sí/no el verbo va <b>primero</b>: <b>Sprichst</b> du Deutsch?"},
{q:"'¿De dónde vienes?' = '_____ kommst du?'",opts:["Wo","Wohin","Woher","Wann"],correct:2,tip:"<b>Woher</b> = de dónde. <b>Wo</b> = dónde. <b>Wohin</b> = a dónde."},
{type:"fill",q:"Completa: '_____ ist das?' (¿Quién es?)",answer:["Wer"],tip:"<b>Wer</b> = quién. Wer ist das? = ¿Quién es?"},
{type:"match",q:"Conecta W-Wort con significado",pairs:[{left:"Wann",right:"cuándo"},{left:"Warum",right:"por qué"},{left:"Wie",right:"cómo"},{left:"Wo",right:"dónde"}]},
]}
]},
{id:"colors",icon:"🎨",title:"Los colores (die Farben)",desc:"Aprende los colores en alemán",
steps:[
{type:"teach",title:"Colores básicos",content:`
<div class="lc-explain">Los colores son adjetivos y van <strong>después</strong> del verbo "sein" o <strong>antes</strong> del sustantivo:</div>
<div class="color-grid">
<div class="color-chip" style="background:#EF4444"><div class="cc-de">rot</div><div class="cc-es">rojo</div></div>
<div class="color-chip" style="background:#3B82F6"><div class="cc-de">blau</div><div class="cc-es">azul</div></div>
<div class="color-chip" style="background:#10B981"><div class="cc-de">grün</div><div class="cc-es">verde</div></div>
<div class="color-chip" style="background:#F59E0B"><div class="cc-de">gelb</div><div class="cc-es">amarillo</div></div>
<div class="color-chip" style="background:#1A1A2E"><div class="cc-de">schwarz</div><div class="cc-es">negro</div></div>
<div class="color-chip" style="background:#9CA3AF;color:#1A1A2E;text-shadow:none"><div class="cc-de">weiß</div><div class="cc-es">blanco</div></div>
<div class="color-chip" style="background:#F97316"><div class="cc-de">orange</div><div class="cc-es">naranja</div></div>
<div class="color-chip" style="background:#8B5CF6"><div class="cc-de">lila</div><div class="cc-es">morado</div></div>
<div class="color-chip" style="background:#EC4899"><div class="cc-de">rosa / pink</div><div class="cc-es">rosa</div></div>
<div class="color-chip" style="background:#78716C"><div class="cc-de">grau</div><div class="cc-es">gris</div></div>
<div class="color-chip" style="background:#92400E"><div class="cc-de">braun</div><div class="cc-es">marrón</div></div>
<div class="color-chip" style="background:#06B6D4"><div class="cc-de">hellblau</div><div class="cc-es">celeste</div></div>
</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">Der Apfel ist rot.</span><span class="ex-es">La manzana es roja.</span></div>
<div class="example-row"><span class="ex-de">Das blaue Auto.</span><span class="ex-es">El coche azul.</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span><strong>hell-</strong> = claro (hellblau = azul claro). <strong>dunkel-</strong> = oscuro (dunkelgrün = verde oscuro).</span></div>`},
{type:"quiz",title:"Practica colores",questions:[
{q:"¿Cómo se dice 'rojo' en alemán?",opts:["blau","grün","rot","gelb"],correct:2,tip:"<b>rot</b> = rojo. Se pronuncia [roːt]."},
{q:"'Schwarz' significa...",opts:["Blanco","Negro","Gris","Marrón"],correct:1,tip:"<b>schwarz</b> = negro. <b>weiß</b> = blanco."},
{q:"¿Cómo dirías 'azul claro'?",opts:["dunkelblau","hellblau","blaugrün","blau"],correct:1,tip:"<b>hell-</b> = claro. <b>dunkel-</b> = oscuro. hellblau = azul claro."},
{q:"'Die Banane ist _____' (La banana es amarilla)",opts:["grün","rot","gelb","weiß"],correct:2,tip:"<b>gelb</b> = amarillo."},
{type:"fill",q:"Escribe el color: 'Der Himmel ist _____' (el cielo es azul)",answer:["blau"],tip:"<b>blau</b> = azul. Der Himmel = el cielo."},
{type:"match",q:"Conecta color con significado",pairs:[{left:"grün",right:"verde"},{left:"weiß",right:"blanco"},{left:"braun",right:"marrón"},{left:"grau",right:"gris"}]},
]}
]},
{id:"restaurant",icon:"🍽️",title:"En el restaurante",desc:"Frases esenciales para pedir comida",
steps:[
{type:"teach",title:"Frases útiles",content:`
<div class="lc-explain">Estas frases te salvarán la vida en cualquier restaurante alemán:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">📋</span><span class="ex-de">Die Speisekarte, bitte.</span><span class="ex-es">La carta, por favor.</span></div>
<div class="example-row"><span class="ex-emoji">🙋</span><span class="ex-de">Ich hätte gerne...</span><span class="ex-es">Me gustaría...</span></div>
<div class="example-row"><span class="ex-emoji">🥤</span><span class="ex-de">Ein Wasser, bitte.</span><span class="ex-es">Un agua, por favor.</span></div>
<div class="example-row"><span class="ex-emoji">💰</span><span class="ex-de">Die Rechnung, bitte.</span><span class="ex-es">La cuenta, por favor.</span></div>
<div class="example-row"><span class="ex-emoji">😋</span><span class="ex-de">Es schmeckt gut!</span><span class="ex-es">¡Está rico!</span></div>
<div class="example-row"><span class="ex-emoji">🍽️</span><span class="ex-de">Guten Appetit!</span><span class="ex-es">¡Buen provecho!</span></div>
<div class="example-row"><span class="ex-emoji">🥂</span><span class="ex-de">Zum Wohl!</span><span class="ex-es">¡Salud!</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span><strong>Bitte</strong> (por favor) es tu mejor amigo. Ponlo al final de casi cualquier pedido y sonarás cortés.</span></div>`},
{type:"teach",title:"Pedir comida",content:`
<div class="lc-explain">Estructura para pedir: <strong>"Ich hätte gerne"</strong> + lo que quieres:</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich hätte gerne eine Suppe.</span><span class="ex-es">Me gustaría una sopa.</span></div>
<div class="example-row"><span class="ex-de">Ich hätte gerne ein Bier.</span><span class="ex-es">Me gustaría una cerveza.</span></div>
<div class="example-row"><span class="ex-de">Ich nehme das Steak.</span><span class="ex-es">Yo pido el bistec.</span></div>
<div class="example-row"><span class="ex-de">Haben Sie vegetarische Gerichte?</span><span class="ex-es">¿Tienen platos vegetarianos?</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Usa <strong>ein/eine</strong> para "un/una": <strong>ein</strong> para der/das, <strong>eine</strong> para die. "Ein Kaffee" (un café), "eine Cola" (una coca-cola).</span></div>`},
{type:"quiz",title:"Practica en el restaurante",questions:[
{q:"¿Cómo pides la cuenta?",opts:["Die Speisekarte, bitte","Die Rechnung, bitte","Ein Wasser, bitte","Zum Wohl!"],correct:1,tip:"<b>die Rechnung</b> = la cuenta. Die Rechnung, bitte = La cuenta, por favor."},
{q:"'Ich hätte gerne...' significa...",opts:["Yo tengo...","Me gustaría...","¿Tienen...?","La cuenta..."],correct:1,tip:"<b>Ich hätte gerne</b> es la forma cortés de pedir algo. Literally: 'tendría con gusto'."},
{q:"¿Qué dices antes de comer?",opts:["Zum Wohl!","Tschüss!","Guten Appetit!","Danke schön!"],correct:2,tip:"<b>Guten Appetit!</b> = ¡Buen provecho! <b>Zum Wohl!</b> = ¡Salud! (al brindar)."},
{q:"¿Cómo dices '¡Está rico!'?",opts:["Es ist kalt","Es schmeckt gut","Die Rechnung","Ich habe Hunger"],correct:1,tip:"<b>schmecken</b> = saber (de sabor). Es schmeckt gut = sabe bien / está rico."},
{type:"fill",q:"Completa: 'Die _____, bitte.' (la carta/menú)",answer:["Speisekarte"],tip:"<b>die Speisekarte</b> = la carta/menú del restaurante."},
{type:"truefalse",sentence:"'Zum Wohl!' se dice antes de comer.",correct:false,correction:"'Zum Wohl!' se dice al brindar (salud). Antes de comer: 'Guten Appetit!'",tip:"<b>Zum Wohl!</b> = ¡Salud! (brindis). <b>Guten Appetit!</b> = antes de comer."},
]}
]},
{id:"zahlen",icon:"🔢",title:"Números del 1 al 20",desc:"Aprende a contar en alemán",
steps:[
{type:"teach",title:"Números 1-10",content:`
<div class="lc-explain">Los primeros diez números son la base de todo. ¡Memorízalos bien!</div>
<table class="grammar-table">
<tr><th>#</th><th>Alemán</th><th>Pronunciación</th></tr>
<tr><td>1</td><td class="highlight">eins</td><td>[ains]</td></tr>
<tr><td>2</td><td class="highlight">zwei</td><td>[tsvai]</td></tr>
<tr><td>3</td><td class="highlight">drei</td><td>[drai]</td></tr>
<tr><td>4</td><td class="highlight">vier</td><td>[fiːɐ]</td></tr>
<tr><td>5</td><td class="highlight">fünf</td><td>[fʏnf]</td></tr>
<tr><td>6</td><td class="highlight">sechs</td><td>[zɛks]</td></tr>
<tr><td>7</td><td class="highlight">sieben</td><td>[ziːbn]</td></tr>
<tr><td>8</td><td class="highlight">acht</td><td>[axt]</td></tr>
<tr><td>9</td><td class="highlight">neun</td><td>[nɔʏn]</td></tr>
<tr><td>10</td><td class="highlight">zehn</td><td>[tseːn]</td></tr>
</table>`},
{type:"teach",title:"Números 11-20",content:`
<div class="lc-explain">Del 11 al 20 tienen su propia lógica:</div>
<table class="grammar-table">
<tr><th>#</th><th>Alemán</th><th>Truco</th></tr>
<tr><td>11</td><td class="highlight">elf</td><td>Palabra única</td></tr>
<tr><td>12</td><td class="highlight">zwölf</td><td>Palabra única</td></tr>
<tr><td>13</td><td class="highlight">dreizehn</td><td>drei + zehn</td></tr>
<tr><td>14</td><td class="highlight">vierzehn</td><td>vier + zehn</td></tr>
<tr><td>15</td><td class="highlight">fünfzehn</td><td>fünf + zehn</td></tr>
<tr><td>16</td><td class="highlight">sechzehn</td><td>sech(s) + zehn</td></tr>
<tr><td>17</td><td class="highlight">siebzehn</td><td>sieb(en) + zehn</td></tr>
<tr><td>18</td><td class="highlight">achtzehn</td><td>acht + zehn</td></tr>
<tr><td>19</td><td class="highlight">neunzehn</td><td>neun + zehn</td></tr>
<tr><td>20</td><td class="highlight">zwanzig</td><td>Palabra única</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span>Del 13 al 19 se forma: <strong>unidad + zehn</strong>. ¡Como "three-teen" en inglés! Ojo: <strong>sechzehn</strong> (no sechszehn) y <strong>siebzehn</strong> (no siebenzehn).</span></div>
<div class="study-box"><span class="study-icon">🎯</span><span><strong>Cómo estudiarlo:</strong> No aprendas los 20 de golpe. Domina primero <strong>1-10</strong> hasta decirlos de memoria sin pensar. Luego el 11-12 (elf, zwölf) que son únicos. Al final el 13-19, que solo son <strong>número + zehn</strong>. Cada bloque se apoya en el anterior.</span></div>`},
{type:"quiz",title:"Practica números",questions:[
{q:"¿Cómo se dice '5' en alemán?",opts:["vier","fünf","sechs","drei"],correct:1,tip:"<b>fünf</b> = 5. Ojo con la Umlaut: f<b>ü</b>nf."},
{q:"'Zwölf' es el número...",opts:["10","11","12","20"],correct:2,tip:"<b>zwölf</b> = 12. <b>elf</b> = 11. Ambos son palabras únicas."},
{q:"¿Qué número es 'siebzehn'?",opts:["16","17","7","70"],correct:1,tip:"sieb(en) + zehn = <b>17</b>. Ojo: se pierde la -en de sieben."},
{q:"¿Cómo se dice '20'?",opts:["zweizehn","zwanzig","zwölf","zehn"],correct:1,tip:"<b>zwanzig</b> = 20. No confundir con zwölf (12)."},
{type:"fill",q:"Escribe el número en alemán: 8",answer:["acht"],tip:"<b>acht</b> = 8. Se pronuncia [axt]."},
{type:"match",q:"Conecta número con alemán",pairs:[{left:"3",right:"drei"},{left:"6",right:"sechs"},{left:"9",right:"neun"},{left:"10",right:"zehn"}]},
]}
]},
{id:"time",icon:"🕐",title:"La hora (die Uhrzeit)",desc:"Aprende a preguntar y decir la hora",
steps:[
{type:"teach",title:"Preguntar y decir la hora",content:`
<div class="lc-explain">Para preguntar la hora se dice:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">❓</span><span class="ex-de">Wie spät ist es?</span><span class="ex-es">¿Qué hora es?</span></div>
<div class="example-row"><span class="ex-emoji">❓</span><span class="ex-de">Wie viel Uhr ist es?</span><span class="ex-es">¿Qué hora es?</span></div>
</div>
<div class="lc-explain" style="margin-top:12px">Para responder, la forma más simple:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">🕐</span><span class="ex-de">Es ist ein Uhr.</span><span class="ex-es">Es la una.</span></div>
<div class="example-row"><span class="ex-emoji">🕑</span><span class="ex-de">Es ist zwei Uhr.</span><span class="ex-es">Son las dos.</span></div>
<div class="example-row"><span class="ex-emoji">🕧</span><span class="ex-de">Es ist halb drei.</span><span class="ex-es">Son las dos y media.</span></div>
<div class="example-row"><span class="ex-emoji">🕐</span><span class="ex-de">Es ist Viertel nach eins.</span><span class="ex-es">Es la una y cuarto.</span></div>
<div class="example-row"><span class="ex-emoji">🕐</span><span class="ex-de">Es ist Viertel vor zwei.</span><span class="ex-es">Son cuarto para las dos.</span></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>halb drei</strong> = 2:30, NO 3:30. En alemán, "halb" se refiere a la hora <strong>siguiente</strong>. ¡Es la trampa más común!</span></div>`},
{type:"quiz",title:"Practica la hora",questions:[
{q:"'Wie spät ist es?' significa...",opts:["¿Dónde estás?","¿Qué hora es?","¿Cómo estás?","¿Cuántos años tienes?"],correct:1,tip:"<b>Wie spät ist es?</b> = ¿Qué hora es? También: Wie viel Uhr ist es?"},
{q:"'Halb drei' son las...",opts:["3:30","3:00","2:30","2:00"],correct:2,tip:"<b>halb</b> se refiere a la hora <b>siguiente</b>. halb drei = mitad hacia las 3 = <b>2:30</b>."},
{q:"'Es ist Viertel nach fünf' = ...",opts:["4:45","5:15","5:45","4:15"],correct:1,tip:"Viertel <b>nach</b> = y cuarto. Viertel nach fünf = 5:15."},
{q:"¿Cómo dices 'Son las 7'?",opts:["Es ist halb sieben","Es ist sieben Uhr","Es ist sechs Uhr","Sieben nach"],correct:1,tip:"Hora completa: Es ist + número + <b>Uhr</b>. Es ist sieben Uhr = 7:00."},
{type:"truefalse",sentence:"'Halb sechs' significa las 6:30.",correct:false,correction:"'Halb sechs' significa las 5:30 (mitad hacia las 6).",tip:"Trampa clásica: <b>halb</b> indica la mitad hacia la hora <b>siguiente</b>."},
{type:"fill",q:"Son las 3 en punto: 'Es ist _____ Uhr.'",answer:["drei"],tip:"Hora exacta: Es ist + número + Uhr. 3:00 = Es ist <b>drei</b> Uhr."},
]}
]},
{id:"phonetics",icon:"🗣️",title:"Fonética alemana",desc:"Pronuncia como un nativo: vocales, Umlauts y consonantes",
steps:[
{type:"teach",title:"Vocales y Umlauts",content:`
<div class="lc-explain">Las vocales a, e, i, o, u se pronuncian similar al español. Lo especial son los <strong>Umlauts</strong> (diéresis):</div>
<div class="phonetic-box">
<div class="phonetic-row"><span class="ph-letter">Ä</span><span class="ph-sound">Boca de "a" diciendo "e" → suena como <strong>e abierta</strong></span><button class="speak-btn sm" onclick="speakBtn('Käse',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">Ö</span><span class="ph-sound">Boca de "o" (beso) diciendo "e"</span><button class="speak-btn sm" onclick="speakBtn('hören',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">Ü</span><span class="ph-sound">Boca de "u" intentando decir "i"</span><button class="speak-btn sm" onclick="speakBtn('tschüss',this)">🔊</button></div>
</div>
<div class="lc-explain">Los <strong>diptongos</strong> más importantes:</div>
<div class="phonetic-box">
<div class="phonetic-row"><span class="ph-letter">ei</span><span class="ph-sound">Se pronuncia <strong>"ai"</strong></span><span class="ph-example">mein [main]</span><button class="speak-btn sm" onclick="speakBtn('mein',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">eu</span><span class="ph-sound">Se pronuncia <strong>"oi"</strong></span><span class="ph-example">heute [hoite]</span><button class="speak-btn sm" onclick="speakBtn('heute',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">ie</span><span class="ph-sound">Se pronuncia como <strong>"i larga"</strong></span><span class="ph-example">Spiel [shpiil]</span><button class="speak-btn sm" onclick="speakBtn('Spiel',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>En alemán <strong>se pronuncian TODAS las letras</strong>. No leas como si fuera inglés.</span></div>`},
{type:"teach",title:"Consonantes clave",content:`
<div class="lc-explain">Las consonantes que más confunden a los hispanohablantes:</div>
<div class="phonetic-box">
<div class="phonetic-row"><span class="ph-letter">ch</span><span class="ph-sound">Tras i/e: como <strong>gato enfadado</strong>. Tras a/o/u: como <strong>"j"</strong></span><button class="speak-btn sm" onclick="speakBtn('ich',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">sch</span><span class="ph-sound">Como mandar a callar: <strong>"shhh"</strong></span><button class="speak-btn sm" onclick="speakBtn('Schule',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">sp/st</span><span class="ph-sound">La S suena <strong>"sh"</strong> antes de p/t</span><button class="speak-btn sm" onclick="speakBtn('Spanisch',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">w</span><span class="ph-sound">Suena como <strong>"v"</strong></span><button class="speak-btn sm" onclick="speakBtn('wie',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">v</span><span class="ph-sound">Suena como <strong>"f"</strong></span><button class="speak-btn sm" onclick="speakBtn('vier',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">z</span><span class="ph-sound">Suena como <strong>"ts"</strong></span><button class="speak-btn sm" onclick="speakBtn('Zentrum',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">ß</span><span class="ph-sound">Como <strong>sonido de serpiente</strong> (ss suave)</span><button class="speak-btn sm" onclick="speakBtn('heißen',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">r</span><span class="ph-sound">Al inicio: <strong>gutural</strong> (gárgaras). Al final: suena como <strong>"a"</strong></span><button class="speak-btn sm" onclick="speakBtn('der',this)">🔊</button></div>
<div class="phonetic-row"><span class="ph-letter">h</span><span class="ph-sound">Como <strong>echar aliento</strong> a un cristal (no como J española)</span><button class="speak-btn sm" onclick="speakBtn('Haus',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Cuidado: <strong>b</strong> al final → suena "p" (ab → [ap]). <strong>d</strong> al final → suena "t" (Kind → [kint]). <strong>g</strong> al final → suena "k" (mag → [mak]).</span></div>`},
{type:"quiz",title:"Practica fonética",questions:[
{q:"El diptongo 'ei' se pronuncia como...",opts:["'ei' (como en español)","'ai'","'ii'","'oi'"],correct:1,tip:"<b>ei</b> = sonido 'ai'. Ejemplo: m<b>ei</b>n = [main]."},
{q:"¿Cómo suena la 'w' en alemán?",opts:["Como 'w' en inglés","Como 'v'","Como 'u'","No suena"],correct:1,tip:"La <b>w</b> alemana suena como nuestra <b>v</b>: Wasser = 'vasser'."},
{q:"'sch' suena como...",opts:["'sk'","'sh' (mandar a callar)","'ch' español","'s' normal"],correct:1,tip:"<b>sch</b> = sonido 'sh' (como en inglés 'she'). Schule = 'shule'."},
{q:"La 'd' al final de palabra suena como...",opts:["'d' normal","'t'","'th'","No suena"],correct:1,tip:"Al final de palabra: <b>b→p</b>, <b>d→t</b>, <b>g→k</b>. Kind = [kint]."},
{type:"truefalse",sentence:"'ie' y 'ei' se pronuncian igual.",correct:false,correction:"'ie' = sonido 'i' larga (Spiel). 'ei' = sonido 'ai' (mein).",tip:"<b>ie</b> = i larga [iː]. <b>ei</b> = ai [aɪ]. Son muy diferentes."},
{type:"match",q:"Conecta letra con sonido",pairs:[{left:"z",right:"ts"},{left:"v",right:"f"},{left:"w",right:"v"},{left:"ß",right:"ss"}]},
]}
]},
{id:"separable",icon:"✂️",title:"Verbos separables",desc:"Verbos que se parten en dos: aufstehen, ankommen...",
steps:[
{type:"teach",title:"¿Qué son los verbos separables?",content:`
<div class="lc-explain">Los <strong>verbos separables</strong> (Trennbare Verben) se componen de un verbo + un prefijo que le da nuevo significado. En presente, el prefijo va <strong>al final de la oración</strong>:</div>
<div class="example-box">
<div style="font-size:13px;margin-bottom:6px"><strong>an</strong> + kommen (venir) = <strong>ankommen</strong> (llegar)</div>
<div class="example-row"><span class="ex-de">Ich komme um 11 Uhr an.</span><span class="ex-es">Yo llego a las 11.</span><button class="speak-btn sm" onclick="speakBtn('Ich komme um elf Uhr an',this)">🔊</button></div>
</div>
<div class="lc-explain">Más ejemplos importantes:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">😴</span><span class="ex-de">aufwachen → Ich wache auf.</span><span class="ex-es">Me despierto.</span><button class="speak-btn sm" onclick="speakBtn('Ich wache auf',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🧍</span><span class="ex-de">aufstehen → Ich stehe auf.</span><span class="ex-es">Me levanto.</span><button class="speak-btn sm" onclick="speakBtn('Ich stehe auf',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">📺</span><span class="ex-de">fernsehen → Ich sehe fern.</span><span class="ex-es">Veo la tele.</span><button class="speak-btn sm" onclick="speakBtn('Ich sehe fern',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">❌</span><span class="ex-de">absagen → Ich sage den Termin ab.</span><span class="ex-es">Cancelo la cita.</span><button class="speak-btn sm" onclick="speakBtn('Ich sage den Termin ab',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Regla de oro: en presente, el prefijo <strong>siempre va al final</strong> de la oración. El verbo conjugado queda en la <strong>segunda posición</strong>.</span></div>`},
{type:"quiz",title:"Practica verbos separables",questions:[
{q:"'ankommen' separado en presente es...",opts:["Ich ankommen","Ich komme an","Ich an komme","Ich kommen an"],correct:1,tip:"Separable: el prefijo <b>an</b> va al final. Ich <b>komme</b> ... <b>an</b>."},
{q:"¿Dónde va el prefijo en presente?",opts:["Al principio","Junto al verbo","Al final de la oración","No se separa"],correct:2,tip:"En presente, el prefijo separable va siempre al <b>final</b> de la oración."},
{q:"'Ich _____ um 7 Uhr _____' (aufstehen)",opts:["stehe...auf","aufstehe...","auf...stehe","stehe auf..."],correct:0,tip:"aufstehen: Ich <b>stehe</b> um 7 Uhr <b>auf</b>. Verbo en posición 2, prefijo al final."},
{q:"'fernsehen' separado: 'Ich _____ _____'",opts:["fern sehe","fernsehe","sehe fern","sehe...fern...nicht"],correct:2,tip:"fernsehen: Ich <b>sehe</b> <b>fern</b>. El prefijo fern va al final."},
{type:"truefalse",sentence:"'Ich aufstehe um 7 Uhr.'",correct:false,correction:"Ich stehe um 7 Uhr auf.",tip:"El verbo conjugado va en posición 2, el prefijo al <b>final</b>: Ich <b>stehe</b> ... <b>auf</b>."},
{type:"fill",q:"Completa: 'Er _____ jeden Tag _____.' (einkaufen)",answer:["kauft ein","kauft...ein"],tip:"einkaufen: er <b>kauft</b> jeden Tag <b>ein</b>."},
]}
]},
{id:"routine",icon:"🌅",title:"La rutina diaria",desc:"Describe tu día a día con diálogos reales",
steps:[
{type:"teach",title:"Verbos de la rutina",content:`
<div class="lc-explain">Estos son los verbos esenciales para hablar de tu día:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">⏰</span><span class="ex-de">aufwachen / aufstehen</span><span class="ex-es">despertarse / levantarse</span><button class="speak-btn sm" onclick="speakBtn('aufstehen',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🍳</span><span class="ex-de">frühstücken</span><span class="ex-es">desayunar</span><button class="speak-btn sm" onclick="speakBtn('frühstücken',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">💼</span><span class="ex-de">arbeiten</span><span class="ex-es">trabajar</span><button class="speak-btn sm" onclick="speakBtn('arbeiten',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🍽️</span><span class="ex-de">zu Mittag essen</span><span class="ex-es">almorzar</span><button class="speak-btn sm" onclick="speakBtn('zu Mittag essen',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">📚</span><span class="ex-de">lernen</span><span class="ex-es">estudiar</span><button class="speak-btn sm" onclick="speakBtn('lernen',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🍲</span><span class="ex-de">kochen</span><span class="ex-es">cocinar</span><button class="speak-btn sm" onclick="speakBtn('kochen',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🌙</span><span class="ex-de">zu Abend essen</span><span class="ex-es">cenar</span><button class="speak-btn sm" onclick="speakBtn('zu Abend essen',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">😴</span><span class="ex-de">schlafen gehen</span><span class="ex-es">irse a dormir</span><button class="speak-btn sm" onclick="speakBtn('schlafen gehen',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Preposiciones temporales clave: <strong>um</strong> = a las (hora exacta), <strong>von...bis</strong> = de...a, <strong>ab</strong> = a partir de.</span></div>`},
{type:"teach",title:"Ejemplo real de rutina",content:`
<div class="lc-explain">Lee esta rutina y escúchala. Así habla un alemán de su día:</div>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">📝</span><div><div class="dl-text"><strong>Von Montag bis Freitag stehe ich fast immer um 9 Uhr auf.</strong></div><div class="dl-es">De lunes a viernes me levanto casi siempre a las 9.</div></div><button class="speak-btn sm" onclick="speakBtn('Von Montag bis Freitag stehe ich fast immer um neun Uhr auf.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">📝</span><div><div class="dl-text"><strong>Ich frühstücke oft um halb zehn. Täglich trinke ich Milchkaffee.</strong></div><div class="dl-es">Desayuno a menudo a las 9:30. A diario bebo café con leche.</div></div><button class="speak-btn sm" onclick="speakBtn('Ich frühstücke oft um halb zehn. Täglich trinke ich Milchkaffee.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">📝</span><div><div class="dl-text"><strong>Ich arbeite von 10 Uhr bis 13 Uhr.</strong></div><div class="dl-es">Trabajo de 10 a 13.</div></div><button class="speak-btn sm" onclick="speakBtn('Ich arbeite von zehn Uhr bis dreizehn Uhr.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">📝</span><div><div class="dl-text"><strong>Oft lerne ich Deutsch von 15 bis 17 Uhr.</strong></div><div class="dl-es">A menudo estudio alemán de 15 a 17.</div></div><button class="speak-btn sm" onclick="speakBtn('Oft lerne ich Deutsch von fünfzehn bis siebzehn Uhr.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">📝</span><div><div class="dl-text"><strong>Um 21 Uhr esse ich zu Abend. Ich gehe oft um 23 Uhr schlafen.</strong></div><div class="dl-es">A las 21 ceno. Me duermo a menudo a las 23.</div></div><button class="speak-btn sm" onclick="speakBtn('Um einundzwanzig Uhr esse ich zu Abend. Ich gehe oft um dreiundzwanzig Uhr schlafen.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Regla de oro: el verbo <strong>siempre va en segunda posición</strong>. Si empiezas con un complemento de tiempo, el sujeto se invierte: "Am Montag <strong>stehe ich</strong>..." (no "ich stehe").</span></div>`},
{type:"quiz",title:"Practica la rutina",questions:[
{q:"'frühstücken' significa...",opts:["almorzar","cenar","desayunar","cocinar"],correct:2,tip:"<b>frühstücken</b> = desayunar. <b>das Frühstück</b> = el desayuno."},
{q:"'Ich arbeite von 9 bis 17 Uhr' significa...",opts:["Trabajo a las 9 y a las 17","Trabajo de 9 a 17","Empiezo a las 17","No trabajo a las 9"],correct:1,tip:"<b>von...bis</b> = de...a (rango de tiempo)."},
{q:"'zu Mittag essen' significa...",opts:["Desayunar","Almorzar","Cenar","Cocinar"],correct:1,tip:"<b>zu Mittag essen</b> = almorzar. <b>zu Abend essen</b> = cenar."},
{q:"Si empiezo con tiempo, ¿qué pasa con el sujeto?",opts:["Va primero","Se elimina","Se invierte (va después del verbo)","No cambia"],correct:2,tip:"Inversión: <b>Am Montag stehe ich auf</b> (no: Am Montag ich stehe auf). El verbo siempre en posición 2."},
{type:"fill",q:"Completa: 'Ich _____ um 23 Uhr schlafen.' (irse a dormir)",answer:["gehe"],tip:"schlafen <b>gehen</b> = irse a dormir. Ich <b>gehe</b> schlafen."},
{type:"truefalse",sentence:"'Um' se usa para indicar horas exactas.",correct:true,tip:"<b>um</b> = a las (hora exacta). Um 8 Uhr = a las 8."},
]}
]},
{id:"aduso",icon:"🔗",title:"Conectores: A.D.U.S.O.",desc:"Las 5 conjunciones coordinantes esenciales",
steps:[
{type:"teach",title:"Las conjunciones A.D.U.S.O.",content:`
<div class="lc-explain">A.D.U.S.O. son las siglas de las 5 conjunciones coordinantes más importantes. <strong>No cambian la posición del verbo</strong>:</div>
<table class="grammar-table">
<tr><th>Conjunción</th><th>Significado</th><th>Ejemplo</th></tr>
<tr><td class="highlight">aber</td><td>pero</td><td>Ich lerne Deutsch, <strong>aber</strong> ich kann nicht sprechen.</td></tr>
<tr><td class="highlight">denn</td><td>pues, ya que</td><td>Sie hat Fieber, <strong>denn</strong> sie ist krank.</td></tr>
<tr><td class="highlight">und</td><td>y</td><td>Ich spreche Deutsch <strong>und</strong> Spanisch.</td></tr>
<tr><td class="highlight">sondern</td><td>sino</td><td>Sie ist nicht Spanierin, <strong>sondern</strong> Italienerin.</td></tr>
<tr><td class="highlight">oder</td><td>o</td><td>Willst du Tee <strong>oder</strong> Kaffee?</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span><strong>sondern</strong> solo se usa después de una negación. "No es X, <strong>sino</strong> Y". Si no hay negación, usa <strong>aber</strong>.</span></div>`},
{type:"quiz",title:"Practica A.D.U.S.O.",questions:[
{q:"'Ich spreche Deutsch _____ Spanisch' (y)",opts:["aber","oder","und","sondern"],correct:2,tip:"<b>und</b> = y. La conjunción más básica."},
{q:"'Sie ist nicht groß, _____ klein' (sino)",opts:["aber","und","sondern","denn"],correct:2,tip:"<b>sondern</b> = sino. Solo después de negación: nicht X, <b>sondern</b> Y."},
{q:"'Willst du Tee _____ Kaffee?' (o)",opts:["und","oder","aber","denn"],correct:1,tip:"<b>oder</b> = o. Para ofrecer alternativas."},
{q:"'aber' significa...",opts:["y","o","sino","pero"],correct:3,tip:"<b>aber</b> = pero. Contraste sin negación previa."},
{type:"fill",q:"'Ella tiene fiebre, _____ está enferma.' (pues/ya que)",answer:["denn"],tip:"<b>denn</b> = pues, ya que. Introduce una razón."},
{type:"truefalse",sentence:"'sondern' se puede usar sin una negación antes.",correct:false,correction:"'sondern' SOLO se usa después de una negación (nicht/kein).",tip:"Regla: nicht X, <b>sondern</b> Y. Sin negación → usa <b>aber</b>."},
]}
]},
{id:"possessive",icon:"👤",title:"Pronombres posesivos",desc:"mein, dein, sein, ihr... ¿de quién es esto?",
steps:[
{type:"teach",title:"Los posesivos en nominativo",content:`
<div class="lc-explain">Los pronombres posesivos indican a quién pertenece algo. Cambian según el género del sustantivo:</div>
<table class="grammar-table">
<tr><th>Persona</th><th>Masc/Neutro</th><th>Femenino/Plural</th><th>Español</th></tr>
<tr><td>ich</td><td class="highlight">mein</td><td class="highlight">meine</td><td>mi/mis</td></tr>
<tr><td>du</td><td class="highlight">dein</td><td class="highlight">deine</td><td>tu/tus</td></tr>
<tr><td>er</td><td class="highlight">sein</td><td class="highlight">seine</td><td>su (de él)</td></tr>
<tr><td>sie</td><td class="highlight">ihr</td><td class="highlight">ihre</td><td>su (de ella)</td></tr>
<tr><td>wir</td><td class="highlight">unser</td><td class="highlight">unsere</td><td>nuestro/a</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Meine Schwester ist Ärztin.</span><span class="ex-es">Mi hermana es doctora. (die Schwester → meine)</span><button class="speak-btn sm" onclick="speakBtn('Meine Schwester ist Ärztin',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Dein Auto ist sehr alt.</span><span class="ex-es">Tu coche es muy viejo. (das Auto → dein)</span><button class="speak-btn sm" onclick="speakBtn('Dein Auto ist sehr alt',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Seine Mutter ist Spanierin.</span><span class="ex-es">Su madre (de él) es española. (die Mutter → seine)</span><button class="speak-btn sm" onclick="speakBtn('Seine Mutter ist Spanierin',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Truco: si el sustantivo es <strong>die</strong> (femenino) o plural, añade <strong>-e</strong> al posesivo. Masc/neutro queda sin cambio.</span></div>`},
{type:"teach",title:"sein vs. ihr — la trampa de 'su'",content:`
<div class="lc-explain">En español, "su" sirve para él, ella y usted. En alemán son diferentes:</div>
<table class="grammar-table">
<tr><th>Español</th><th>Alemán</th><th>Ejemplo</th></tr>
<tr><td>su (de él)</td><td class="highlight">sein / seine</td><td><strong>Sein</strong> Vater ist Arzt.</td></tr>
<tr><td>su (de ella)</td><td class="highlight">ihr / ihre</td><td><strong>Ihr</strong> Vater ist Lehrer.</td></tr>
<tr><td>su (de usted)</td><td class="highlight">Ihr / Ihre</td><td><strong>Ihr</strong> Name, bitte?</td></tr>
</table>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Das ist Maria. <strong>Ihr</strong> Mann heißt Thomas.</div><div class="dl-es">Esta es María. <strong>Su</strong> (de ella) marido se llama Thomas.</div></div><button class="speak-btn sm" onclick="speakBtn('Das ist Maria. Ihr Mann heißt Thomas.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Und das ist Thomas. <strong>Seine</strong> Frau ist Ärztin.</div><div class="dl-es">Y este es Thomas. <strong>Su</strong> (de él) mujer es doctora.</div></div><button class="speak-btn sm" onclick="speakBtn('Und das ist Thomas. Seine Frau ist Ärztin.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text"><strong>Ihre</strong> Kinder gehen in <strong>meine</strong> Schule.</div><div class="dl-es"><strong>Sus</strong> (de ellos) hijos van a <strong>mi</strong> escuela.</div></div><button class="speak-btn sm" onclick="speakBtn('Ihre Kinder gehen in meine Schule.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error de hispanohablantes:</strong> Usar "sein" para todo. "Maria und <strong>sein</strong> Mann" ✗. Si María es mujer, es "<strong>ihr</strong> Mann" ✓. El posesivo depende del <strong>dueño</strong>, no del objeto poseído.</span></div>`},
{type:"quiz",title:"Practica posesivos",questions:[
{q:"'Mi madre' (die Mutter) → ...",opts:["mein Mutter","meine Mutter","meinen Mutter","meiner Mutter"],correct:1,tip:"Mutter es femenino (die). Con femenino/plural se añade <b>-e</b>: mein → <b>meine</b>."},
{q:"'Tu coche' (das Auto) → ...",opts:["deine Auto","deines Auto","dein Auto","deinem Auto"],correct:2,tip:"Auto es neutro (das). Con masculino/neutro el posesivo <b>no cambia</b>: <b>dein</b> Auto."},
{q:"'Su hermano' (de ella) (der Bruder) → ...",opts:["seine Bruder","ihr Bruder","sein Bruder","ihre Bruder"],correct:1,tip:"'Su' de ella = <b>ihr</b>. Bruder es masculino → <b>ihr</b> Bruder (sin -e)."},
{q:"'Nuestros hijos' (die Kinder, plural) → ...",opts:["unser Kinder","unsere Kinder","unseren Kinder","unserem Kinder"],correct:1,tip:"Con plural se añade <b>-e</b>: unser → <b>unsere</b> Kinder."},
{type:"fill",q:"Completa: '_____ Schwester heißt Anna.' (mi hermana)",answer:["Meine"],tip:"Schwester es femenino. ich → <b>meine</b> (con -e para femenino)."},
{type:"match",q:"Conecta persona con posesivo",pairs:[{left:"ich",right:"mein"},{left:"du",right:"dein"},{left:"er",right:"sein"},{left:"sie (ella)",right:"ihr"}]},
]}
]},
{id:"days_months",icon:"📅",title:"Días, meses y estaciones",desc:"Vocabulario temporal esencial del Goethe A1",
steps:[
{type:"teach",title:"Los días de la semana",content:`
<div class="lc-explain">Los días son <strong>siempre masculinos</strong> (der). Se usan con <strong>"am"</strong> (an+dem):</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">am Montag</span><span class="ex-es">el lunes</span><button class="speak-btn sm" onclick="speakBtn('Montag',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Dienstag</span><span class="ex-es">el martes</span><button class="speak-btn sm" onclick="speakBtn('Dienstag',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Mittwoch</span><span class="ex-es">el miércoles</span><button class="speak-btn sm" onclick="speakBtn('Mittwoch',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Donnerstag</span><span class="ex-es">el jueves</span><button class="speak-btn sm" onclick="speakBtn('Donnerstag',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Freitag</span><span class="ex-es">el viernes</span><button class="speak-btn sm" onclick="speakBtn('Freitag',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Samstag</span><span class="ex-es">el sábado</span><button class="speak-btn sm" onclick="speakBtn('Samstag',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">am Sonntag</span><span class="ex-es">el domingo</span><button class="speak-btn sm" onclick="speakBtn('Sonntag',this)">🔊</button></div>
</div>
<div class="lc-explain" style="margin-top:10px">Las estaciones (<strong>siempre masculinas</strong>), con <strong>"im"</strong>:</div>
<div class="example-box">
<div class="example-row"><span class="ex-emoji">🌸</span><span class="ex-de">im Frühling</span><span class="ex-es">en primavera</span><button class="speak-btn sm" onclick="speakBtn('Frühling',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">☀️</span><span class="ex-de">im Sommer</span><span class="ex-es">en verano</span><button class="speak-btn sm" onclick="speakBtn('Sommer',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">🍂</span><span class="ex-de">im Herbst</span><span class="ex-es">en otoño</span><button class="speak-btn sm" onclick="speakBtn('Herbst',this)">🔊</button></div>
<div class="example-row"><span class="ex-emoji">❄️</span><span class="ex-de">im Winter</span><span class="ex-es">en invierno</span><button class="speak-btn sm" onclick="speakBtn('Winter',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Regla: días → <strong>am</strong>. Meses y estaciones → <strong>im</strong>. Horas → <strong>um</strong>.</span></div>`},
{type:"teach",title:"Los meses del año",content:`
<div class="lc-explain">Los meses son <strong>siempre masculinos</strong> (der) y se usan con <strong>"im"</strong> (in+dem). Se parecen mucho al español:</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">im Januar</span><span class="ex-es">en enero</span><button class="speak-btn sm" onclick="speakBtn('Januar',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Februar</span><span class="ex-es">en febrero</span><button class="speak-btn sm" onclick="speakBtn('Februar',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im März</span><span class="ex-es">en marzo</span><button class="speak-btn sm" onclick="speakBtn('März',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im April</span><span class="ex-es">en abril</span><button class="speak-btn sm" onclick="speakBtn('April',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Mai</span><span class="ex-es">en mayo</span><button class="speak-btn sm" onclick="speakBtn('Mai',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Juni</span><span class="ex-es">en junio</span><button class="speak-btn sm" onclick="speakBtn('Juni',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Juli</span><span class="ex-es">en julio</span><button class="speak-btn sm" onclick="speakBtn('Juli',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im August</span><span class="ex-es">en agosto</span><button class="speak-btn sm" onclick="speakBtn('August',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im September</span><span class="ex-es">en septiembre</span><button class="speak-btn sm" onclick="speakBtn('September',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Oktober</span><span class="ex-es">en octubre</span><button class="speak-btn sm" onclick="speakBtn('Oktober',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im November</span><span class="ex-es">en noviembre</span><button class="speak-btn sm" onclick="speakBtn('November',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">im Dezember</span><span class="ex-es">en diciembre</span><button class="speak-btn sm" onclick="speakBtn('Dezember',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Ojo con la pronunciación: <strong>Januar</strong> [yánuar], <strong>Juni</strong> [yúni], <strong>Juli</strong> [yúli]. La J suena como "y". <strong>März</strong> lleva Umlaut: [merts].</span></div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Para decir fechas: <strong>Ich habe am 15. Mai Geburtstag</strong> (mi cumpleaños es el 15 de mayo). El día va con <strong>am</strong> + número ordinal.</span></div>`},
{type:"quiz",title:"Practica días y estaciones",questions:[
{q:"Los días de la semana en alemán son...",opts:["Femeninos","Neutros","Masculinos","Sin género"],correct:2,tip:"Días, meses y estaciones son siempre <b>masculinos</b>: der Montag, der Januar, der Sommer."},
{q:"'El lunes' se dice...",opts:["im Montag","am Montag","um Montag","an Montag"],correct:1,tip:"Días → <b>am</b> (an+dem). Am Montag = el lunes."},
{q:"'En verano' se dice...",opts:["am Sommer","um Sommer","im Sommer","in Sommer"],correct:2,tip:"Meses y estaciones → <b>im</b> (in+dem). Im Sommer = en verano."},
{q:"'Miércoles' en alemán es...",opts:["Mittwoch","Donnerstag","Dienstag","Freitag"],correct:0,tip:"<b>Mittwoch</b> = miércoles (Mitte = mitad, Woche = semana)."},
{q:"'En marzo' se dice...",opts:["am März","um März","im März","in März"],correct:2,tip:"Meses → <b>im</b>. Im März = en marzo."},
{type:"fill",q:"Escribe el mes en alemán: 'julio'",answer:["Juli"],tip:"<b>Juli</b> = julio. Se pronuncia [yúli]."},
{type:"fill",q:"Completa: '_____ Freitag gehe ich ins Kino.' (el viernes)",answer:["Am"],tip:"Días → <b>am</b>. Am Freitag = el viernes."},
{type:"match",q:"Conecta mes con alemán",pairs:[{left:"enero",right:"Januar"},{left:"mayo",right:"Mai"},{left:"agosto",right:"August"},{left:"diciembre",right:"Dezember"}]},
{type:"match",q:"Conecta estación con alemán",pairs:[{left:"primavera",right:"Frühling"},{left:"verano",right:"Sommer"},{left:"otoño",right:"Herbst"},{left:"invierno",right:"Winter"}]},
]}
]},
{id:"modal_verbs",icon:"💪",title:"Verbos modales",desc:"können, müssen, wollen, dürfen, möchten",
steps:[
{type:"teach",title:"Los 5 verbos modales",content:`
<div class="lc-explain">Los verbos modales expresan posibilidad, obligación o deseo. Van en <strong>segunda posición</strong> y el verbo principal va al <strong>final en infinitivo</strong>:</div>
<table class="grammar-table">
<tr><th>Modal</th><th>Significado</th><th>ich</th><th>du</th><th>er/sie</th></tr>
<tr><td class="highlight">können</td><td>poder/saber</td><td>kann</td><td>kannst</td><td>kann</td></tr>
<tr><td class="highlight">müssen</td><td>deber/tener que</td><td>muss</td><td>musst</td><td>muss</td></tr>
<tr><td class="highlight">wollen</td><td>querer</td><td>will</td><td>willst</td><td>will</td></tr>
<tr><td class="highlight">dürfen</td><td>tener permiso</td><td>darf</td><td>darfst</td><td>darf</td></tr>
<tr><td class="highlight">möchten</td><td>desear/quisiera</td><td>möchte</td><td>möchtest</td><td>möchte</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich <strong>kann</strong> Deutsch <strong>sprechen</strong>.</span><span class="ex-es">Puedo hablar alemán.</span><button class="speak-btn sm" onclick="speakBtn('Ich kann Deutsch sprechen',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Du <strong>musst</strong> morgen <strong>arbeiten</strong>.</span><span class="ex-es">Debes trabajar mañana.</span><button class="speak-btn sm" onclick="speakBtn('Du musst morgen arbeiten',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>möchte</strong> einen Kaffee <strong>trinken</strong>.</span><span class="ex-es">Quisiera tomar un café.</span><button class="speak-btn sm" onclick="speakBtn('Ich möchte einen Kaffee trinken',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Hier <strong>darf</strong> man nicht <strong>rauchen</strong>.</span><span class="ex-es">Aquí no se puede fumar.</span><button class="speak-btn sm" onclick="speakBtn('Hier darf man nicht rauchen',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Estructura: Sujeto + <strong>modal conjugado</strong> + complementos + <strong>infinitivo al final</strong>. Esto es fundamental en el examen.</span></div>`},
{type:"teach",title:"Mini diálogo: En la vida diaria",content:`
<div class="lc-explain">Así se usan los modales en conversación real:</div>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text"><strong>Kannst</strong> du mir <strong>helfen</strong>?</div><div class="dl-es">¿Puedes ayudarme?</div></div><button class="speak-btn sm" onclick="speakBtn('Kannst du mir helfen?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Jetzt <strong>kann</strong> ich leider nicht. Ich <strong>muss</strong> noch <strong>arbeiten</strong>.</div><div class="dl-es">Ahora no puedo. Todavía tengo que trabajar.</div></div><button class="speak-btn sm" onclick="speakBtn('Jetzt kann ich leider nicht. Ich muss noch arbeiten.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text"><strong>Willst</strong> du später <strong>essen</strong> <strong>gehen</strong>?</div><div class="dl-es">¿Quieres ir a comer después?</div></div><button class="speak-btn sm" onclick="speakBtn('Willst du später essen gehen?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Ja! Ich <strong>möchte</strong> gern Sushi <strong>essen</strong>.</div><div class="dl-es">¡Sí! Me gustaría comer sushi.</div></div><button class="speak-btn sm" onclick="speakBtn('Ja! Ich möchte gern Sushi essen.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Cuidado con können vs. dürfen:</strong> "Ich <strong>kann</strong> nicht schwimmen" = No <strong>sé</strong> nadar (habilidad). "Man <strong>darf</strong> hier nicht schwimmen" = No se <strong>permite</strong> nadar (prohibición). Los hispanohablantes suelen confundir esto porque en español "poder" cubre ambos.</span></div>`},
{type:"quiz",title:"Practica modales",questions:[
{q:"'Yo puedo hablar alemán' = 'Ich _____ Deutsch sprechen'",opts:["muss","kann","will","darf"],correct:1,tip:"<b>können</b> = poder/saber. ich <b>kann</b>."},
{q:"'Aquí no se puede fumar' usa el modal...",opts:["können","müssen","dürfen","wollen"],correct:2,tip:"<b>dürfen</b> = tener permiso. Man darf nicht = no se permite."},
{q:"¿Dónde va el infinitivo con un modal?",opts:["Al principio","En segunda posición","Al final","No se usa"],correct:2,tip:"Estructura: Sujeto + modal conjugado + ... + <b>infinitivo al final</b>."},
{q:"'Ich möchte einen Tee' significa...",opts:["Debo tomar un té","Puedo tomar un té","Quisiera un té","Quiero un té"],correct:2,tip:"<b>möchte</b> = quisiera (cortés). <b>will</b> = quiero (directo)."},
{type:"fill",q:"'Debes trabajar mañana' = 'Du _____ morgen arbeiten.'",answer:["musst"],tip:"<b>müssen</b> = deber/tener que. du <b>musst</b>."},
{type:"truefalse",sentence:"'Ich will einen Kaffee' es más cortés que 'Ich möchte einen Kaffee'.",correct:false,correction:"'möchte' es cortés, 'will' es directo/brusco.",tip:"<b>möchte</b> = quisiera (cortés). <b>will</b> = quiero (puede sonar brusco)."},
{type:"match",q:"Conecta modal con significado",pairs:[{left:"können",right:"poder"},{left:"müssen",right:"deber"},{left:"dürfen",right:"tener permiso"},{left:"wollen",right:"querer"}]},
]}
]},
{id:"negation",icon:"🚫",title:"La negación: nicht vs. kein",desc:"Cuándo usar nicht y cuándo kein",
steps:[
{type:"teach",title:"nicht y kein",content:`
<div class="lc-explain">En alemán hay <strong>dos formas de negar</strong>, y usar la correcta es clave para el examen:</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">🔴 NICHT = no (niega verbos, adjetivos, adverbios)</div>
<div class="example-row"><span class="ex-de">Ich komme <strong>nicht</strong>.</span><span class="ex-es">No vengo.</span></div>
<div class="example-row"><span class="ex-de">Das ist <strong>nicht</strong> gut.</span><span class="ex-es">Eso no es bueno.</span></div>
<div class="example-row"><span class="ex-de">Er arbeitet <strong>nicht</strong> hier.</span><span class="ex-es">Él no trabaja aquí.</span></div>
</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">🔵 KEIN/KEINE = ningún/a (niega sustantivos con artículo indefinido)</div>
<div class="example-row"><span class="ex-de">Ich habe <strong>kein</strong> Auto.</span><span class="ex-es">No tengo coche. (ein Auto → kein Auto)</span></div>
<div class="example-row"><span class="ex-de">Das ist <strong>keine</strong> gute Idee.</span><span class="ex-es">Eso no es buena idea. (eine Idee → keine Idee)</span></div>
<div class="example-row"><span class="ex-de">Wir haben <strong>keine</strong> Zeit.</span><span class="ex-es">No tenemos tiempo.</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Regla simple: si la oración afirmativa usaría <strong>ein/eine</strong>, la negación usa <strong>kein/keine</strong>. Si no hay artículo indefinido, usa <strong>nicht</strong>.</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> La lógica es más simple de lo que parece: <strong>kein</strong> niega <strong>cosas</strong> (sustantivos), <strong>nicht</strong> niega <strong>acciones y cualidades</strong> (verbos y adjetivos). "Ich habe <strong>kein</strong> Auto" = no tengo <strong>cosa</strong>. "Ich komme <strong>nicht</strong>" = no hago la <strong>acción</strong>. Piénsalo así y nunca fallarás.</span></div>`},
{type:"teach",title:"¿Dónde va 'nicht' en la oración?",content:`
<div class="lc-explain">La posición de <strong>nicht</strong> depende de qué estás negando:</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">Negar el verbo → nicht al final:</div>
<div class="example-row"><span class="ex-de">Ich komme <strong>nicht</strong>.</span><span class="ex-es">No vengo.</span><button class="speak-btn sm" onclick="speakBtn('Ich komme nicht',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er schläft <strong>nicht</strong>.</span><span class="ex-es">Él no duerme.</span><button class="speak-btn sm" onclick="speakBtn('Er schläft nicht',this)">🔊</button></div>
<div style="font-weight:700;color:var(--primary);margin-bottom:6px;margin-top:8px">Negar un adjetivo/adverbio → nicht justo antes:</div>
<div class="example-row"><span class="ex-de">Das ist <strong>nicht</strong> teuer.</span><span class="ex-es">Eso no es caro.</span><button class="speak-btn sm" onclick="speakBtn('Das ist nicht teuer',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er singt <strong>nicht</strong> gut.</span><span class="ex-es">Él no canta bien.</span><button class="speak-btn sm" onclick="speakBtn('Er singt nicht gut',this)">🔊</button></div>
<div style="font-weight:700;color:var(--primary);margin-bottom:6px;margin-top:8px">Negar con artículo definido (der/die/das) → nicht antes:</div>
<div class="example-row"><span class="ex-de">Ich kenne <strong>nicht</strong> den Mann.</span><span class="ex-es">No conozco al hombre.</span><button class="speak-btn sm" onclick="speakBtn('Ich kenne nicht den Mann',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error de hispanohablantes:</strong> Poner "nicht" al principio como "no" en español. "Nicht ich komme" ✗ → "Ich komme <strong>nicht</strong>" ✓. En alemán la negación no va al principio.</span></div>`},
{type:"quiz",title:"Practica negación",questions:[
{q:"'No tengo hermanos' = 'Ich habe _____ Geschwister'",opts:["nicht","kein","keine","nichts"],correct:2,tip:"Geschwister es plural. Negación de sustantivo indefinido plural → <b>keine</b>."},
{q:"'Él no viene' = 'Er kommt _____'",opts:["kein","keine","nicht","nichts"],correct:2,tip:"Negar un verbo → <b>nicht</b>. Er kommt <b>nicht</b>."},
{q:"'No es caro' = 'Das ist _____ teuer'",opts:["kein","keine","nicht","nichts"],correct:2,tip:"Negar un adjetivo → <b>nicht</b>. Das ist nicht teuer."},
{q:"'No tengo coche' = 'Ich habe _____ Auto'",opts:["nicht","keine","kein","nichts"],correct:2,tip:"Auto es neutro (das). Negación de sustantivo indefinido neutro → <b>kein</b>."},
{type:"fill",q:"'No tenemos tiempo' = 'Wir haben _____ Zeit.'",answer:["keine"],tip:"Zeit es femenino (die). Negación de sustantivo indefinido fem. → <b>keine</b>."},
{type:"truefalse",sentence:"'Ich trinke nicht Kaffee' es correcto para 'No tomo café'.",correct:false,correction:"Ich trinke keinen Kaffee. (kein porque niega un sustantivo con artículo indefinido)",tip:"Si la afirmativa sería 'Ich trinke <b>einen</b> Kaffee', la negación usa <b>keinen</b>, no nicht."},
]}
]},
{id:"accusative",icon:"🎯",title:"El caso acusativo",desc:"einen, eine, ein: el complemento directo",
steps:[
{type:"teach",title:"Nominativo vs. Acusativo",content:`
<div class="lc-explain">El <strong>acusativo</strong> se usa para el complemento directo (lo que recibe la acción). Solo cambia el <strong>masculino</strong>:</div>
<table class="grammar-table">
<tr><th></th><th>Nominativo (sujeto)</th><th>Acusativo (CD)</th></tr>
<tr><td style="font-weight:700;color:#1E40AF">Masculino</td><td>der / ein</td><td class="highlight">den / einen</td></tr>
<tr><td style="font-weight:700;color:#9D174D">Femenino</td><td>die / eine</td><td>die / eine</td></tr>
<tr><td style="font-weight:700;color:#92400E">Neutro</td><td>das / ein</td><td>das / ein</td></tr>
<tr><td style="font-weight:700">Plural</td><td>die / –</td><td>die / –</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich habe <strong>einen</strong> Hund.</span><span class="ex-es">Tengo un perro. (der Hund → einen)</span><button class="speak-btn sm" onclick="speakBtn('Ich habe einen Hund',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich kaufe <strong>eine</strong> Jacke.</span><span class="ex-es">Compro una chaqueta. (die Jacke → eine, no cambia)</span><button class="speak-btn sm" onclick="speakBtn('Ich kaufe eine Jacke',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich nehme <strong>das</strong> Brot.</span><span class="ex-es">Tomo el pan. (das Brot → das, no cambia)</span><button class="speak-btn sm" onclick="speakBtn('Ich nehme das Brot',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich sehe <strong>den</strong> Mann.</span><span class="ex-es">Veo al hombre. (der Mann → den)</span><button class="speak-btn sm" onclick="speakBtn('Ich sehe den Mann',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Solo el masculino cambia: <strong>der→den</strong>, <strong>ein→einen</strong>, <strong>kein→keinen</strong>, <strong>mein→meinen</strong>. Todo lo demás queda igual. ¡Esa es la buena noticia!</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> ¿Por qué solo el masculino cambia en acusativo? En alemán antiguo, <strong>todos</strong> los géneros cambiaban. Con el tiempo, femenino y neutro se simplificaron y dejaron de cambiar. El masculino fue el único que mantuvo la distinción. Fíjate en la <strong>-n</strong>: der→de<strong>n</strong>, ein→eine<strong>n</strong>. Esa -n es la marca del acusativo masculino.</span></div>`},
{type:"teach",title:"Preposiciones que siempre llevan Akkusativ",content:`
<div class="lc-explain">Estas preposiciones <strong>siempre</strong> piden acusativo — memorízalas:</div>
<table class="grammar-table">
<tr><th>Preposición</th><th>Significado</th><th>Ejemplo</th></tr>
<tr><td class="highlight">für</td><td>para</td><td>Das ist für <strong>den</strong> Chef.</td></tr>
<tr><td class="highlight">ohne</td><td>sin</td><td>Ohne <strong>einen</strong> Plan geht es nicht.</td></tr>
<tr><td class="highlight">gegen</td><td>contra</td><td>Ich bin gegen <strong>den</strong> Vorschlag.</td></tr>
<tr><td class="highlight">durch</td><td>a través de</td><td>Wir gehen durch <strong>den</strong> Park.</td></tr>
<tr><td class="highlight">um</td><td>alrededor de</td><td>Er läuft um <strong>den</strong> See.</td></tr>
</table>
<div class="lc-explain" style="margin-top:10px">Mini diálogo en contexto:</div>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Was kaufst du?</div><div class="dl-es">¿Qué compras?</div></div><button class="speak-btn sm" onclick="speakBtn('Was kaufst du?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Ich kaufe <strong>einen</strong> Kuchen für <strong>meine</strong> Mutter.</div><div class="dl-es">Compro un pastel para mi madre.</div></div><button class="speak-btn sm" onclick="speakBtn('Ich kaufe einen Kuchen für meine Mutter.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Ohne <strong>eine</strong> Kerze?</div><div class="dl-es">¿Sin una vela?</div></div><button class="speak-btn sm" onclick="speakBtn('Ohne eine Kerze?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Stimmt! Ich brauche auch <strong>einen</strong> Blumenstrauß.</div><div class="dl-es">¡Cierto! También necesito un ramo de flores.</div></div><button class="speak-btn sm" onclick="speakBtn('Stimmt! Ich brauche auch einen Blumenstrauß.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error de hispanohablantes:</strong> En español decimos "para el jefe" sin cambiar nada. En alemán, "für" exige acusativo: "für <strong>den</strong> Chef" (no der Chef). Siempre pregúntate: ¿esta preposición pide Akk o Dat?</span></div>`},
{type:"quiz",title:"Practica acusativo",questions:[
{q:"'Tengo un perro' (der Hund) = 'Ich habe _____ Hund'",opts:["ein","einer","einen","einem"],correct:2,tip:"Hund es masculino (der Hund). En acusativo: ein → <b>einen</b>. Solo el masculino cambia."},
{q:"'Compro una mesa' (der Tisch) = 'Ich kaufe _____ Tisch'",opts:["der","den","ein","einen"],correct:3,tip:"Tisch es masculino (der Tisch). Con artículo indefinido en acusativo: ein → <b>einen</b>."},
{q:"'Veo una mujer' (die Frau) = 'Ich sehe _____ Frau'",opts:["einen","eine","einer","einem"],correct:1,tip:"Frau es femenino (die Frau). El femenino <b>no cambia</b> en acusativo: eine → <b>eine</b>."},
{q:"¿Qué género cambia en acusativo?",opts:["Femenino","Neutro","Masculino","Todos"],correct:2,tip:"Solo el <b>masculino</b> cambia en acusativo: der→den, ein→einen. Femenino y neutro quedan igual."},
{type:"fill",q:"Completa: 'Ich sehe _____ Mann.' (der Mann, acusativo)",answer:["den"],tip:"Mann es masculino. En acusativo: der → <b>den</b>. Solo el masculino cambia."},
{type:"truefalse",sentence:"Ich kaufe eine Lampe. (die Lampe)",correct:true,tip:"Lampe es femenino. El femenino <b>no cambia</b> en acusativo: die/eine → die/eine."},
{type:"truefalse",sentence:"Er trinkt ein Kaffee. (der Kaffee)",correct:false,correction:"Er trinkt einen Kaffee.",tip:"Kaffee es masculino (der Kaffee). En acusativo: ein → <b>einen</b>."},
]}
]},
{id:"dative",icon:"🎁",title:"El caso dativo",desc:"dem, der, dem: el complemento indirecto",
steps:[
{type:"teach",title:"¿Qué es el Dativ?",content:`
<div class="lc-explain">El <strong>dativo</strong> marca el complemento indirecto: <em>a quién</em> o <em>para quién</em> se hace algo. Aquí <strong>todos los géneros cambian</strong>:</div>
<table class="grammar-table">
<tr><th></th><th>Nominativ</th><th>Akkusativ</th><th>Dativ</th></tr>
<tr><td style="font-weight:700;color:#1E40AF">Masculino</td><td>der / ein</td><td>den / einen</td><td class="highlight">dem / einem</td></tr>
<tr><td style="font-weight:700;color:#9D174D">Femenino</td><td>die / eine</td><td>die / eine</td><td class="highlight">der / einer</td></tr>
<tr><td style="font-weight:700;color:#92400E">Neutro</td><td>das / ein</td><td>das / ein</td><td class="highlight">dem / einem</td></tr>
<tr><td style="font-weight:700">Plural</td><td>die</td><td>die</td><td class="highlight">den (+n)</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich gebe <strong>dem</strong> Mann das Buch.</span><span class="ex-es">Le doy el libro al hombre.</span><button class="speak-btn sm" onclick="speakBtn('Ich gebe dem Mann das Buch',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich helfe <strong>der</strong> Frau.</span><span class="ex-es">Ayudo a la mujer.</span><button class="speak-btn sm" onclick="speakBtn('Ich helfe der Frau',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er gibt <strong>dem</strong> Kind ein Geschenk.</span><span class="ex-es">Él le da un regalo al niño.</span><button class="speak-btn sm" onclick="speakBtn('Er gibt dem Kind ein Geschenk',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Truco para recordar: masc/neutro → <strong>dem</strong> (suena a "them"), femenino → <strong>der</strong> (parece masculino pero no lo es en Dativ).</span></div>`},
{type:"teach",title:"Verbos y preposiciones con Dativ",content:`
<div class="lc-explain">Algunos verbos <strong>siempre</strong> llevan Dativ (no Akkusativ). Memorízalos:</div>
<table class="grammar-table">
<tr><th>Verbo</th><th>Significado</th><th>Ejemplo</th></tr>
<tr><td class="highlight">helfen</td><td>ayudar</td><td>Ich helfe <strong>dem</strong> Kind</td></tr>
<tr><td class="highlight">danken</td><td>agradecer</td><td>Wir danken <strong>dem</strong> Lehrer</td></tr>
<tr><td class="highlight">gefallen</td><td>gustar</td><td>Das gefällt <strong>der</strong> Frau</td></tr>
<tr><td class="highlight">gehören</td><td>pertenecer</td><td>Das gehört <strong>dem</strong> Mann</td></tr>
<tr><td class="highlight">antworten</td><td>responder</td><td>Er antwortet <strong>der</strong> Lehrerin</td></tr>
</table>
<div class="lc-explain" style="margin-top:12px">Estas preposiciones <strong>siempre</strong> llevan Dativ:</div>
<table class="grammar-table">
<tr><td class="highlight">mit</td><td>con</td><td>mit <strong>dem</strong> Bus</td></tr>
<tr><td class="highlight">von</td><td>de/desde</td><td>von <strong>der</strong> Arbeit</td></tr>
<tr><td class="highlight">zu</td><td>a/hacia</td><td>zu <strong>dem</strong> Arzt (= zum Arzt)</td></tr>
<tr><td class="highlight">nach</td><td>después/hacia</td><td>nach <strong>dem</strong> Essen</td></tr>
<tr><td class="highlight">bei</td><td>en casa de</td><td>bei <strong>der</strong> Arbeit</td></tr>
<tr><td class="highlight">seit</td><td>desde (tiempo)</td><td>seit <strong>einem</strong> Jahr</td></tr>
<tr><td class="highlight">aus</td><td>de (origen)</td><td>aus <strong>der</strong> Schweiz</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">🎵</span><span>Canción para memorizar: <strong>mit, von, zu, nach, bei, seit, aus</strong> — siempre Dativ, ¡no hay excepciones!</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> El Dativ responde a "¿a quién?" o "¿con qué?". Piénsalo así: el Dativ marca al <strong>receptor</strong> de una acción, no al que la hace (Nominativ) ni al que la recibe directamente (Akkusativ). "Ich gebe <strong>dem Mann</strong> das Buch" — el hombre no hace nada, solo recibe. Eso es Dativ.</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> La <strong>-m</strong> es la marca del Dativ masculino/neutro: de<strong>m</strong>, eine<strong>m</strong>. Si ves una -m al final del artículo, es Dativ seguro. En femenino la marca es <strong>-r</strong>: de<strong>r</strong>, eine<strong>r</strong>. Estos patrones te ayudan a reconocer el caso incluso sin pensar en las tablas.</span></div>`},
{type:"quiz",title:"Practica Dativ",questions:[
{q:"'Ayudo al niño' (das Kind) = 'Ich helfe _____ Kind'",opts:["das","den","dem","der"],correct:2,tip:"helfen lleva <b>Dativ</b>. Kind es neutro (das Kind). En dativo: das → <b>dem</b>."},
{q:"'Voy con el autobús' (der Bus) = 'Ich fahre mit _____ Bus'",opts:["den","der","dem","das"],correct:2,tip:"<b>mit</b> siempre lleva Dativ. Bus es masculino (der Bus). En dativo: der → <b>dem</b>."},
{q:"'Le doy el libro a la mujer' = 'Ich gebe _____ Frau das Buch'",opts:["die","der","dem","den"],correct:1,tip:"geben lleva Dativ (a quién). Frau es femenino (die Frau). En dativo: die → <b>der</b>."},
{q:"¿Qué preposición NO lleva siempre Dativ?",opts:["mit","für","von","bei"],correct:1,tip:"<b>für</b> lleva Akkusativ, no Dativ. Las preposiciones de Dativ son: mit, von, zu, nach, bei, seit, aus."},
{q:"'Vengo de la escuela' = 'Ich komme aus _____ Schule'",opts:["die","der","dem","den"],correct:1,tip:"<b>aus</b> siempre lleva Dativ. Schule es femenino (die Schule). En dativo: die → <b>der</b>."},
{type:"fill",q:"Completa: 'Ich fahre mit _____ Fahrrad' (das Fahrrad)",answer:["dem"],tip:"<b>mit</b> siempre lleva Dativ. Fahrrad es neutro (das). En dativo: das → <b>dem</b>."},
{type:"truefalse",sentence:"Ich helfe den Kind.",correct:false,correction:"Ich helfe dem Kind.",tip:"helfen lleva <b>Dativ</b>, no Akkusativ. Kind es neutro: das → <b>dem</b>, no den."},
{type:"match",q:"Conecta cada preposición con su caso",pairs:[{left:"mit",right:"Dativ"},{left:"für",right:"Akkusativ"},{left:"von",right:"Dativ"},{left:"ohne",right:"Akkusativ"}]},
]}
]},
{id:"regular_verbs",icon:"🔧",title:"Verbos regulares en presente",desc:"Las 6 terminaciones: -e, -st, -t, -en, -t, -en",
steps:[
{type:"teach",title:"Conjugación regular",content:`
<div class="lc-explain">Para conjugar un verbo regular, quitas <strong>-en</strong> del infinitivo y añades las terminaciones:</div>
<table class="grammar-table">
<tr><th>Pronombre</th><th>Terminación</th><th>machen (hacer)</th><th>spielen (jugar)</th></tr>
<tr><td>ich</td><td class="highlight">-e</td><td>mach<strong>e</strong></td><td>spiel<strong>e</strong></td></tr>
<tr><td>du</td><td class="highlight">-st</td><td>mach<strong>st</strong></td><td>spiel<strong>st</strong></td></tr>
<tr><td>er/sie/es</td><td class="highlight">-t</td><td>mach<strong>t</strong></td><td>spiel<strong>t</strong></td></tr>
<tr><td>wir</td><td class="highlight">-en</td><td>mach<strong>en</strong></td><td>spiel<strong>en</strong></td></tr>
<tr><td>ihr</td><td class="highlight">-t</td><td>mach<strong>t</strong></td><td>spiel<strong>t</strong></td></tr>
<tr><td>sie/Sie</td><td class="highlight">-en</td><td>mach<strong>en</strong></td><td>spiel<strong>en</strong></td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span>Si la raíz termina en <strong>-t</strong> o <strong>-d</strong> (arbeiten, finden), se agrega una <strong>e</strong> extra: du arbeit<strong>e</strong>st, er arbeit<strong>e</strong>t.</span></div>`},
{type:"teach",title:"Verbos con cambio de raíz",content:`
<div class="lc-explain">Algunos verbos cambian la vocal de la raíz en <strong>du</strong> y <strong>er/sie/es</strong>. Los más comunes:</div>
<table class="grammar-table">
<tr><th>Cambio</th><th>Infinitivo</th><th>du</th><th>er/sie/es</th></tr>
<tr><td class="highlight">e → i</td><td>sprechen</td><td>spr<strong>i</strong>chst</td><td>spr<strong>i</strong>cht</td></tr>
<tr><td class="highlight">e → i</td><td>essen</td><td><strong>i</strong>sst</td><td><strong>i</strong>sst</td></tr>
<tr><td class="highlight">e → i</td><td>geben</td><td>g<strong>i</strong>bst</td><td>g<strong>i</strong>bt</td></tr>
<tr><td class="highlight">e → ie</td><td>lesen</td><td>l<strong>ie</strong>st</td><td>l<strong>ie</strong>st</td></tr>
<tr><td class="highlight">e → ie</td><td>sehen</td><td>s<strong>ie</strong>hst</td><td>s<strong>ie</strong>ht</td></tr>
<tr><td class="highlight">a → ä</td><td>fahren</td><td>f<strong>ä</strong>hrst</td><td>f<strong>ä</strong>hrt</td></tr>
<tr><td class="highlight">a → ä</td><td>schlafen</td><td>schl<strong>ä</strong>fst</td><td>schl<strong>ä</strong>ft</td></tr>
<tr><td class="highlight">au → äu</td><td>laufen</td><td>l<strong>äu</strong>fst</td><td>l<strong>äu</strong>ft</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich <strong>spreche</strong> Deutsch, du <strong>sprichst</strong> Englisch.</span><span class="ex-es">Yo hablo alemán, tú hablas inglés.</span><button class="speak-btn sm" onclick="speakBtn('Ich spreche Deutsch, du sprichst Englisch',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er <strong>fährt</strong> nach Berlin.</span><span class="ex-es">Él va (en vehículo) a Berlín.</span><button class="speak-btn sm" onclick="speakBtn('Er fährt nach Berlin',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>El cambio SOLO ocurre en <strong>du</strong> y <strong>er/sie/es</strong>. En wir/ihr/sie la vocal original se mantiene.</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> Los cambios de raíz (e→i, a→ä) existen porque en alemán antiguo las vocales "se contagiaban" entre sílabas. La terminación de 2ª/3ª persona tenía una vocal alta que "tiraba" de la vocal de la raíz hacia arriba: a→ä, e→i. Se llama <strong>Umlaut</strong> y es la misma razón por la que los plurales también cambian la vocal.</span></div>`},
{type:"quiz",title:"Practica conjugación",questions:[
{q:"spielen → du _____",opts:["spielst","spielt","spielen","spiele"],correct:0,tip:"Conjugación regular: raíz <b>spiel-</b> + terminación <b>-st</b> para du = <b>spielst</b>."},
{q:"sprechen → er _____",opts:["sprecht","spricht","sprichst","spreche"],correct:1,tip:"sprechen tiene cambio de raíz <b>e→i</b> en du/er: du spr<b>i</b>chst, er spr<b>i</b>cht."},
{q:"fahren → du _____",opts:["fahrst","fährst","fahrt","fährt"],correct:1,tip:"fahren tiene cambio de raíz <b>a→ä</b> en du/er: du f<b>ä</b>hrst, er f<b>ä</b>hrt."},
{q:"arbeiten → er _____",opts:["arbeitt","arbeit","arbeitet","arbeitst"],correct:2,tip:"Cuando la raíz termina en <b>-t</b> o <b>-d</b>, se agrega una <b>e</b> extra: arbeit<b>e</b>t."},
{q:"lesen → sie (ella) _____",opts:["lest","lest","liest","lesen"],correct:2,tip:"lesen tiene cambio de raíz <b>e→ie</b> en du/er/sie: du l<b>ie</b>st, sie l<b>ie</b>st."},
{type:"fill",q:"Completa: 'Er _____ ein Buch.' (lesen, er-Form)",answer:["liest"],tip:"lesen tiene cambio de raíz <b>e→ie</b> en er/sie/es: er l<b>ie</b>st."},
{type:"truefalse",sentence:"Du sprichst sehr gut Deutsch.",correct:true,tip:"sprechen → du spr<b>i</b>chst. El cambio e→i es correcto aquí."},
{type:"truefalse",sentence:"Er fahrt nach Hamburg.",correct:false,correction:"Er fährt nach Hamburg.",tip:"fahren tiene cambio de raíz <b>a→ä</b> en er: er f<b>ä</b>hrt, no fahrt."},
{type:"match",q:"Conecta pronombre con forma de 'sein'",pairs:[{left:"ich",right:"bin"},{left:"du",right:"bist"},{left:"er/sie",right:"ist"},{left:"wir",right:"sind"}]},
]}
]},
{id:"plurals_lesson",icon:"👥",title:"Los plurales en alemán",desc:"Las 7 formas de hacer plural: -e, -er, -n, -en, -s, Umlaut, nada",
steps:[
{type:"teach",title:"Las 7 reglas del plural",content:`
<div class="lc-explain">En alemán <strong>no hay una sola regla</strong> para el plural. Hay 7 formas y hay que memorizar cada sustantivo con su plural. Pero hay patrones que ayudan:</div>
<table class="grammar-table">
<tr><th>Tipo</th><th>Ejemplo</th><th>Pista</th></tr>
<tr><td class="highlight">-e</td><td>der Hund → die Hund<strong>e</strong></td><td>Muchos masculinos</td></tr>
<tr><td class="highlight">-̈e (Umlaut+e)</td><td>der Stuhl → die St<strong>ü</strong>hl<strong>e</strong></td><td>Algunos masc. con a/o/u</td></tr>
<tr><td class="highlight">-er</td><td>das Kind → die Kind<strong>er</strong></td><td>Muchos neutros</td></tr>
<tr><td class="highlight">-̈er (Umlaut+er)</td><td>das Buch → die B<strong>ü</strong>ch<strong>er</strong></td><td>Neutros con a/o/u</td></tr>
<tr><td class="highlight">-n / -en</td><td>die Blume → die Blume<strong>n</strong></td><td>La mayoría de femeninos</td></tr>
<tr><td class="highlight">-s</td><td>das Auto → die Auto<strong>s</strong></td><td>Palabras extranjeras</td></tr>
<tr><td class="highlight">sin cambio</td><td>das Mädchen → die Mädchen</td><td>Terminados en -er, -en, -el, -chen, -lein</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span>El artículo plural es siempre <strong>die</strong>, sin importar el género original. ¡Esa es la buena noticia!</span></div>`},
{type:"teach",title:"Fichas: singular → plural",content:`
<div class="lc-explain">Estudia cada ficha como en un diccionario. Fíjate en el artículo, el plural y el ejemplo en contexto:</div>
<div class="plural-cards">

<div class="plural-card"><div class="pc-header"><span class="pc-article der">masc.</span><span class="pc-word">der Hund</span><span class="pc-plural">pl.: die Hunde</span><span class="pc-rule">-e</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('der Hund, die Hunde',this)">🔊</button></div>
<div class="pc-example"><strong>Ich habe einen Hund.</strong> Mein Nachbar hat zwei <strong>Hunde</strong>.<br><span class="pc-es">Tengo un perro. Mi vecino tiene dos perros.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Kind</span><span class="pc-plural">pl.: die Kinder</span><span class="pc-rule">-er</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Kind, die Kinder',this)">🔊</button></div>
<div class="pc-example"><strong>Das Kind</strong> spielt im Garten. Die <strong>Kinder</strong> spielen zusammen.<br><span class="pc-es">El niño juega en el jardín. Los niños juegan juntos.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Buch</span><span class="pc-plural">pl.: die Bücher</span><span class="pc-rule">-̈er</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Buch, die Bücher',this)">🔊</button></div>
<div class="pc-example">Ich lese ein <strong>Buch</strong>. Sie hat viele <strong>Bücher</strong>.<br><span class="pc-es">Leo un libro. Ella tiene muchos libros.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article der">masc.</span><span class="pc-word">der Stuhl</span><span class="pc-plural">pl.: die Stühle</span><span class="pc-rule">-̈e</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('der Stuhl, die Stühle',this)">🔊</button></div>
<div class="pc-example">Der <strong>Stuhl</strong> ist kaputt. Wir brauchen neue <strong>Stühle</strong>.<br><span class="pc-es">La silla está rota. Necesitamos sillas nuevas.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article die">fem.</span><span class="pc-word">die Blume</span><span class="pc-plural">pl.: die Blumen</span><span class="pc-rule">-n</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('die Blume, die Blumen',this)">🔊</button></div>
<div class="pc-example">Die <strong>Blume</strong> ist schön. Im Garten gibt es viele <strong>Blumen</strong>.<br><span class="pc-es">La flor es bonita. En el jardín hay muchas flores.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article die">fem.</span><span class="pc-word">die Zeitung</span><span class="pc-plural">pl.: die Zeitungen</span><span class="pc-rule">-en</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('die Zeitung, die Zeitungen',this)">🔊</button></div>
