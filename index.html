function goToMode(mode) {
  closeLessonView();
  switchTab('play');
  state.mode = mode;
  renderModes();
  resetGame();
  setTimeout(() => {
    const ga = document.getElementById('gameArea');
    if (ga) ga.scrollIntoView({behavior:'smooth',block:'center'});
  }, 100);
}

function startLessonRetry(){
  lessonState.retryMode = true;
  lessonState.quizIndex = 0;
  renderLessonView();
}

function goToNextLesson() {
  const activeLessons = getActiveLessons();
  const currentLesson = LESSONS[lessonState.currentLesson];
  const currentIdx = activeLessons.indexOf(currentLesson);
  if (currentIdx >= 0 && currentIdx < activeLessons.length - 1) {
    const nextLesson = activeLessons[currentIdx + 1];
    const globalIdx = LESSONS.indexOf(nextLesson);
    openLesson(globalIdx);
  } else {
    closeLessonView();
  }
}

function retakeLessonQuiz(){
  lessonState.quizIndex = 0;
  lessonState.quizCorrect = 0;
  lessonState.quizTotal = 0;
  lessonState.missedQs = [];
  lessonState.retryMode = false;
  renderLessonView();
}

function getLessonQuizTip(q, correctOpt) {
  if (q.tip) return `<div class="grammar-tip"><div class="gt-header">💡 Explicación</div><div class="gt-body">${q.tip}</div></div>`;
  return `<div class="grammar-tip"><div class="gt-header">💡 Recuerda</div><div class="gt-body">La respuesta correcta es <span class="gt-rule">${correctOpt}</span>. Revisa la teoría de esta lección si no estás seguro.</div></div>`;
}

function checkLessonQuiz(btn,selected,correct){
  if(btn.disabled)return;
  document.querySelectorAll('.quiz-in-lesson .option-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct)b.classList.add('correct');
  });
  lessonState.quizTotal++;
  const fb=document.getElementById('lessonQuizFb');
  const step = LESSONS[lessonState.currentLesson].steps[lessonState.currentStep];
  const questions = lessonState.retryMode ? lessonState.missedQs : step.questions;
  const q = questions[lessonState.quizIndex];
  const correctOpt = q.opts[correct];
  if(selected===correct){
    btn.classList.add('correct');lessonState.quizCorrect++;
    fb.innerHTML=`<div class="feedback correct" style="margin-top:10px">✅ ¡Correcto! <strong>${correctOpt}</strong></div>`;
    setTimeout(()=>nextLessonQuizQ(),800);
  } else {
    btn.classList.add('wrong');
    if(!lessonState.retryMode) lessonState.missedQs.push(q);
    fb.innerHTML=`<div class="feedback wrong" style="margin-top:10px">❌ La respuesta correcta era: <strong>${correctOpt}</strong></div>${getLessonQuizTip(q, correctOpt)}`;
    fb.innerHTML+=`<button class="next-btn" onclick="nextLessonQuizQ()" style="margin-top:8px">Siguiente →</button>`;
  }
}

function checkLessonFill() {
  const inp = document.getElementById('lessonFillInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  const step = LESSONS[lessonState.currentLesson].steps[lessonState.currentStep];
  const questions = lessonState.retryMode ? lessonState.missedQs : step.questions;
  const q = questions[lessonState.quizIndex];
  const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
  const ok = answers.some(a => normalize(val) === normalize(a));
  lessonState.quizTotal++;
  const fb = document.getElementById('lessonQuizFb');
  inp.disabled = true;
  document.querySelector('.check-btn').disabled = true;
  if (ok) {
    inp.classList.add('correct'); lessonState.quizCorrect++;
    fb.innerHTML = `<div class="feedback correct" style="margin-top:10px">✅ ¡Correcto! <strong>${answers[0]}</strong></div>`;
    setTimeout(()=>nextLessonQuizQ(),800);
  } else {
    inp.classList.add('wrong');
    if (!lessonState.retryMode) lessonState.missedQs.push(q);
    fb.innerHTML = `<div class="feedback wrong" style="margin-top:10px">❌ Tu respuesta: <strong>${val}</strong><br>Correcto: <strong>${answers[0]}</strong></div>${getLessonQuizTip(q, answers[0])}`;
    fb.innerHTML += `<button class="next-btn" onclick="nextLessonQuizQ()" style="margin-top:8px">Siguiente →</button>`;
  }
}

function checkLessonTF(btn, userAnswer) {
  const btns = document.querySelectorAll('.tf-btn');
  if (btn.disabled) return;
  btns.forEach(b => b.disabled = true);
  const step = LESSONS[lessonState.currentLesson].steps[lessonState.currentStep];
  const questions = lessonState.retryMode ? lessonState.missedQs : step.questions;
  const q = questions[lessonState.quizIndex];
  const ok = userAnswer === q.correct;
  lessonState.quizTotal++;
  const fb = document.getElementById('lessonQuizFb');
  if (ok) {
    btn.classList.add('correct'); lessonState.quizCorrect++;
    fb.innerHTML = `<div class="feedback correct" style="margin-top:10px">✅ ¡Correcto! ${q.correct ? 'La oración es correcta.' : 'La oración es incorrecta.'}</div>`;
    if (!q.correct && q.correction) fb.innerHTML = `<div class="feedback correct" style="margin-top:10px">✅ ¡Bien visto! La forma correcta es:<br><strong>${q.correction}</strong></div>`;
    setTimeout(()=>nextLessonQuizQ(),800);
  } else {
    btn.classList.add('wrong');
    if (!lessonState.retryMode) lessonState.missedQs.push(q);
    const explanation = q.correct
      ? `La oración <strong>sí es correcta</strong>.`
      : `La oración es <strong>incorrecta</strong>. Lo correcto es: <strong>${q.correction || '...'}</strong>`;
    fb.innerHTML = `<div class="feedback wrong" style="margin-top:10px">❌ ${explanation}</div>${getLessonQuizTip(q, '')}`;
    fb.innerHTML += `<button class="next-btn" onclick="nextLessonQuizQ()" style="margin-top:8px">Siguiente →</button>`;
  }
}

let matchState = null;
function matchSelect(side, idx) {
  const step = LESSONS[lessonState.currentLesson].steps[lessonState.currentStep];
  const questions = lessonState.retryMode ? lessonState.missedQs : step.questions;
  const q = questions[lessonState.quizIndex];
  const ms = lessonState.matchState;
  if (!ms) return;
  if (ms.selected && ms.selected.side === side) {
    ms.selected = { side, idx };
    renderLessonView();
    return;
  }
  if (!ms.selected) {
    ms.selected = { side, idx };
    renderLessonView();
    return;
  }
  const leftIdx = side === 'left' ? idx : ms.selected.idx;
  const rightIdx = side === 'right' ? idx : ms.selected.idx;
  const rightOrigIdx = ms.shuffledRight[rightIdx].origIdx;
  if (leftIdx === rightOrigIdx) {
    ms.matched.push(leftIdx);
    ms.selected = null;
    if (ms.matched.length === q.pairs.length) {
      lessonState.quizTotal++; lessonState.quizCorrect++;
      lessonState.matchState = null;
      renderLessonView();
      setTimeout(() => {
        const fb = document.getElementById('lessonQuizFb');
        if (fb) fb.innerHTML = `<div class="feedback correct" style="margin-top:10px">✅ ¡Todas las parejas conectadas!</div>`;
        setTimeout(() => nextLessonQuizQ(), 800);
      }, 100);
      return;
    }
    renderLessonView();
  } else {
    ms.selected = null;
    if (!ms.hadError) ms.hadError = true;
    renderLessonView();
    const items = document.querySelectorAll('.match-item');
    items.forEach(item => {
      const s = item.dataset.side;
      const i = parseInt(item.dataset.idx);
      if ((s === 'left' && i === leftIdx) || (s === 'right' && i === rightIdx)) {
        item.classList.add('wrong-flash');
        setTimeout(() => item.classList.remove('wrong-flash'), 500);
      }
    });
  }
}

function nextLessonQuizQ(){
  lessonState.quizIndex++;lessonState.matchState=null;renderLessonView();
  setTimeout(()=>{const inp=document.getElementById('lessonFillInput');if(inp)inp.focus();},100);
}

function lessonPrev(){if(lessonState.currentStep>0){lessonState.currentStep--;renderLessonView();}}
function lessonNext(){
  const lesson=LESSONS[lessonState.currentLesson];
  if(lessonState.currentStep<lesson.steps.length-1){lessonState.currentStep++;lessonState.quizIndex=0;lessonState.quizCorrect=0;lessonState.quizTotal=0;lessonState.missedQs=[];lessonState.retryMode=false;lessonMemState={cards:[],flipped:[],matched:[],locked:false};renderLessonView();}
  else{
    if(!data.completedLessons)data.completedLessons=[];
    if(!data.completedLessons.includes(lesson.id)){data.completedLessons.push(lesson.id);data.xp+=20;saveData();renderLevelBar();}
    closeLessonView();
  }
}

// Inject memory step before quiz in each lesson
LESSONS.forEach(l => {
  const hasMemory = l.steps.some(s => s.type === 'memory');
  if (!hasMemory) {
    const quizIdx = l.steps.findIndex(s => s.type === 'quiz');
    if (quizIdx >= 0) {
      l.steps.splice(quizIdx, 0, { type: 'memory', title: '🧠 Vocabulario: Memorice' });
    }
  }
});

function getActiveLessons() { return LESSONS.filter(l => l.level === getActiveLevel()); }
function getActiveReadings() { return READINGS.filter(r => r.level === getActiveLevel()); }

let readingState = { current: null, showTranslations: false, quizIndex: 0, quizCorrect: 0, quizDone: false };

function renderReadingTab() {
  const el = document.getElementById('tab-reading');
  if (readingState.current !== null) { renderReadingView(); return; }
  const activeReadings = getActiveReadings();
  const completed = data.completedReadings || [];
  const doneCount = activeReadings.filter(r => completed.includes(r.id)).length;
  el.innerHTML = `<div class="prog-section"><h3>📖 ${t('readingsA1').replace('A1',getActiveLevel())}</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">${t('readListenUnderstand')} ${doneCount}/${activeReadings.length} ${t('completed')}</div>
    ${activeReadings.map((r, i) => {
      const globalIdx = READINGS.indexOf(r);
      const done = completed.includes(r.id);
      return `<div class="reading-list-card" onclick="openReading(${globalIdx})">
        <span class="lc-num">${i + 1}</span>
        <span class="lc-icon">${r.icon}</span>
        <div class="lc-info"><div class="lc-title">${r.title}</div><div class="lc-desc">${r.desc}</div></div>
        <span class="rc-level">${r.level}</span>
        ${done ? '<span class="lc-badge done">✓</span>' : ''}
      </div>`;
    }).join("")}
  </div>`;
}

function renderExamTab() {
  const el = document.getElementById('tab-exam');
  if (listenState.current !== null) { renderListeningView(); return; }
  if (writeState.current !== null) { renderWritingView(); return; }
  if (examState.active) { renderExamSection(); return; }

    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">Escucha diálogos y responde preguntas sin ver el texto</div>

      <button class="start-btn" style="font-size:14px">Comenzar examen →</button>

function openReading(idx) {
  readingState.current = idx;
  readingState.showTranslations = false;
  readingState.quizIndex = 0;
  readingState.quizCorrect = 0;
  readingState.quizDone = false;
  renderReadingTab();
}

function closeReading() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  readingState.current = null;
  renderReadingTab();
}

function renderReadingView() {
  const el = document.getElementById('tab-reading');
  const r = READINGS[readingState.current];

  let linesHtml = r.lines.map((l, i) => {
    const words = l.de.split(/(\s+)/).map(w => {
      if (w.trim() === '') return w;
      return `<span class="rl-word" onclick="event.stopPropagation();showWordInfo('${escapeStr(w.replace(/[.,!?:;]/g,''))}')">${w}</span>`;
    }).join('');
    return `<div class="reading-line" onclick="speakLine(this,'${escapeStr(l.de)}')">
      <span class="rl-num">${i + 1}</span>
      <div class="rl-content">
        <div class="rl-de">${words}</div>
        <div class="rl-es ${readingState.showTranslations ? 'show' : ''}">${l.es}</div>
      </div>
      <button class="speak-btn sm rl-speak" onclick="event.stopPropagation();speakBtn('${escapeStr(l.de)}',this)">🔊</button>
    </div>`;
  }).join('');

  let quizHtml = '';
  if (readingState.quizDone) {
    const pct = Math.round(readingState.quizCorrect / r.quiz.length * 100);
    const xp = readingState.quizCorrect * 10;
    if (!data.completedReadings) data.completedReadings = [];
    if (!data.completedReadings.includes(r.id)) { data.completedReadings.push(r.id); data.xp += xp; saveData(); renderLevelBar(); }
    quizHtml = `<div class="reading-quiz"><div style="text-align:center"><div style="font-size:32px;margin-bottom:6px">${pct >= 75 ? '🏆' : '📚'}</div>
      <div style="font-weight:800">${pct >= 75 ? '¡Excelente comprensión!' : '¡Sigue practicando!'}</div>
      <div style="font-size:13px;color:var(--text-light)">${readingState.quizCorrect}/${r.quiz.length} correctas · +${xp} XP</div></div></div>`;
  } else {
    const q = r.quiz[readingState.quizIndex];
    quizHtml = `<div class="reading-quiz">
      <div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px">📝 Comprensión ${readingState.quizIndex + 1}/${r.quiz.length}</div>
      <div class="rq-question">${q.q}</div>
      <div class="rq-options">${q.opts.map((o, i) => `<button class="rq-opt" onclick="checkReadingQuiz(this,${i},${q.correct})">${o}</button>`).join('')}</div>
      <div id="rqFeedback"></div>
    </div>`;
  }

  el.innerHTML = `<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="closeReading()">←</button>
      <div class="lesson-title">${r.icon} ${r.title}</div>
      <span class="rc-level">${r.level}</span>
    </div>
    <div class="reading-controls">
      <button class="rc-btn" id="readPlayBtn" onclick="toggleReadingAudio(${readingState.current})">🔊 Escuchar todo</button>
      <button class="rc-btn" onclick="restartReadingAudio(${readingState.current})">⏮ Reiniciar</button>
      <button class="rc-btn" onclick="toggleReadingAudio(${readingState.current},0.7)">🐢 Lento</button>
      <button class="rc-btn ${readingState.showTranslations ? 'active' : ''}" onclick="toggleTranslations()">🔤 Traducción</button>
    </div>
    <div class="reading-card">${linesHtml}</div>
    ${quizHtml}
  </div>`;
}

function speakLine(el, text) {
  document.querySelectorAll('.reading-line').forEach(l => l.classList.remove('active'));
  el.classList.add('active');
  speak(text);
}

function speakFullText(idx, rate) {
  const r = READINGS[idx];
  const lines = r.lines.map(l => l.de);
  speakSequence(lines, rate || 0.85);
}

function toggleReadingAudio(idx, rate) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  if (synth.speaking || synth.paused) {
    if (synth.paused) {
      synth.resume();
      updatePlayBtn(true);
    } else {
      synth.pause();
      updatePlayBtn(false, true);
    }
    return;
  }
  const r = READINGS[idx];
  const lines = r.lines.map(l => l.de);
  synth.cancel();
  speakSequence(lines, rate || 0.85, () => updatePlayBtn(false));
  updatePlayBtn(true);
}

function updatePlayBtn(playing, paused) {
  const btn = document.getElementById('readPlayBtn');
  if (!btn) return;
  if (playing) {
    btn.innerHTML = '⏸ Pausar';
    btn.style.background = 'var(--primary-light)';
    btn.style.color = 'var(--primary)';
  } else if (paused) {
    btn.innerHTML = '▶ Continuar';
    btn.style.background = 'var(--accent-light)';
    btn.style.color = 'var(--accent)';
  } else {
    btn.innerHTML = '🔊 Escuchar todo';
    btn.style.background = '';
    btn.style.color = '';
  }
}

function stopReadingAudio() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  updatePlayBtn(false);
}

function restartReadingAudio(idx) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  updatePlayBtn(false);
  setTimeout(() => toggleReadingAudio(idx), 100);
}

function toggleTranslations() {
  readingState.showTranslations = !readingState.showTranslations;
  renderReadingTab();
}

function showWordInfo(word) {
  const clean = word.replace(/[.,!?:;"'()]/g, '').trim();
  if (!clean) return;
  const existing = document.querySelector('.word-popup');
  if (existing) existing.remove();
  const allWords = Object.values(getActiveVocab()).flat();
  const found = allWords.find(w => {
    const deClean = w.de.replace(/^(der|die|das)\s+/i, '').toLowerCase();
    return deClean === clean.toLowerCase() || w.de.toLowerCase() === clean.toLowerCase();
  });
  const popup = document.createElement('div');
  popup.className = 'word-popup';
  if (found) {
    popup.innerHTML = `<div><div class="wp-de">${found.emoji} ${found.de}</div><div class="wp-es">${found.es} · ${found.pron}</div></div>
      <button class="speak-btn sm" onclick="speakBtn('${escapeStr(found.de)}',this)" style="border-color:rgba(255,255,255,0.3)">🔊</button>
      <span class="wp-close" onclick="this.parentElement.remove()">✕</span>`;
  } else {
    popup.innerHTML = `<div><div class="wp-de">${clean}</div><div class="wp-es">Toca 🔊 para escuchar</div></div>
      <button class="speak-btn sm" onclick="speakBtn('${escapeStr(clean)}',this)" style="border-color:rgba(255,255,255,0.3)">🔊</button>
      <span class="wp-close" onclick="this.parentElement.remove()">✕</span>`;
  }
  document.body.appendChild(popup);
  setTimeout(() => { if (popup.parentElement) popup.remove(); }, 6000);
}

function checkReadingQuiz(btn, selected, correct) {
  if (btn.disabled) return;
  document.querySelectorAll('.rq-opt').forEach((b, i) => { b.disabled = true; if (i === correct) b.classList.add('correct'); });
  if (selected === correct) { btn.classList.add('correct'); readingState.quizCorrect++; }
  else { btn.classList.add('wrong'); }
  const fb = document.getElementById('rqFeedback');
  const isLast = readingState.quizIndex >= READINGS[readingState.current].quiz.length - 1;
  fb.innerHTML = `<button class="next-btn" style="margin-top:8px" onclick="nextReadingQ()">${isLast ? 'Ver resultado' : 'Siguiente →'}</button>`;
}

function nextReadingQ() {
  readingState.quizIndex++;
  if (readingState.quizIndex >= READINGS[readingState.current].quiz.length) {
    readingState.quizDone = true;
  }
  renderReadingTab();
}

  renderLevelBar();
  renderLevelSelectBar();

  renderModes();
  switchTab('home');
}

function saveSettings() {

  settingsOpen = false;
  renderSettings();

  renderLevelBar();
  renderLevelSelectBar();

}

// LISTENING COMPREHENSION
function getActiveListening() {
  const lvl = getActiveLevel();
  const a1 = typeof LISTENING_A1 !== 'undefined' ? LISTENING_A1 : [];
  const a2 = typeof LISTENING_A2 !== 'undefined' ? LISTENING_A2 : [];
  if (lvl === 'A2') return [...a1, ...a2];
  return a1;
}

let listenState = { current: null, phase: 'listen', quizIndex: 0, quizCorrect: 0, quizDone: false, plays: 0 };

function renderListeningSection() {
  const items = getActiveListening();
  const completed = data.completedListening || [];
  return items.map((item, i) => {
    const done = completed.includes(item.id);
    return `<div class="reading-list-card" onclick="openListening(${i})" style="border-left:3px solid var(--purple)">
      <span class="lc-icon">🎧</span>
      <div class="lc-info"><div class="lc-title">${item.title}</div><div class="lc-desc">${item.desc}</div></div>
      ${done ? '<span class="lc-badge done">✓</span>' : ''}
    </div>`;
  }).join('');
}

function openListening(idx) {
  listenState = { current: idx, phase: 'listen', quizIndex: 0, quizCorrect: 0, quizDone: false, plays: 0 };
  renderExamTab();
}

function renderListeningView() {
  const el = document.getElementById('tab-exam');
  const items = getActiveListening();
  const item = items[listenState.current];

  if (listenState.phase === 'listen') {
    el.innerHTML = `<div class="lesson-view">
      <div class="lesson-header">
        <button class="lesson-back" onclick="closeListening()">←</button>
        <div class="lesson-title">🎧 ${item.title}</div>
      </div>
      <div class="lesson-content" style="text-align:center">
        <div style="font-size:13px;color:var(--text-light);margin-bottom:6px">${item.desc}</div>
        <div style="font-size:14px;font-weight:700;margin-bottom:16px">Escucha el diálogo y responde las preguntas</div>
        <button class="listen-play-btn" onclick="playListeningDialogue()">▶</button>
        <div class="listen-hint">Puedes escucharlo ${2 - listenState.plays > 0 ? (2 - listenState.plays) + ' vez/veces más' : '— hora de responder'}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
          <button class="rc-btn" onclick="playListeningDialogue(0.7)">🐢 Lento</button>
          ${listenState.plays >= 1 ? '<button class="start-btn" style="font-size:13px;padding:8px 20px" onclick="startListeningQuiz()">Responder preguntas →</button>' : ''}
        </div>
      </div>
    </div>`;
  } else {
    let quizHtml = '';
    if (listenState.quizDone) {
      const pct = Math.round(listenState.quizCorrect / item.quiz.length * 100);
      const xp = listenState.quizCorrect * 12;
      if (!data.completedListening) data.completedListening = [];
      if (!data.completedListening.includes(item.id)) { data.completedListening.push(item.id); data.xp += xp; saveData(); renderLevelBar(); }
      quizHtml = `<div style="text-align:center;padding:20px 0">
        <div style="font-size:48px;margin-bottom:8px">${pct >= 75 ? '🏆' : '📚'}</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:4px">${pct >= 75 ? '¡Excelente comprensión auditiva!' : '¡Sigue practicando!'}</div>
        <div style="font-size:13px;color:var(--text-light);margin-bottom:12px">${listenState.quizCorrect}/${item.quiz.length} correctas · +${xp} XP</div>
        <div style="font-size:12px;font-weight:700;margin-bottom:8px">Transcripción del diálogo:</div>
        ${item.dialogue.map(d => `<div style="font-size:12px;margin-bottom:3px;text-align:left;padding:0 16px"><strong>${d.speaker}:</strong> ${d.de}</div>`).join('')}
        <button class="start-btn" style="font-size:14px;margin-top:12px" onclick="closeListening()">Volver ←</button>
      </div>`;
    } else {
      const q = item.quiz[listenState.quizIndex];
      quizHtml = `<div style="text-align:center">
        <div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px">🎧 Pregunta ${listenState.quizIndex + 1}/${item.quiz.length}</div>
        <div style="font-size:14px;font-weight:600;margin-bottom:14px">${q.q}</div>
        <div class="options">${q.opts.map((o, i) => `<button class="option-btn" onclick="checkListeningQuiz(this,${i},${q.correct})">${o}</button>`).join('')}</div>
        <div id="listenQuizFb"></div>
        <button class="rc-btn" style="margin-top:10px" onclick="playListeningDialogue(0.85)">🔊 Escuchar de nuevo</button>
      </div>`;
    }
    el.innerHTML = `<div class="lesson-view">
      <div class="lesson-header">
        <button class="lesson-back" onclick="closeListening()">←</button>
        <div class="lesson-title">🎧 ${item.title}</div>
      </div>
      <div class="lesson-content">${quizHtml}</div>
    </div>`;
  }
}

function playListeningDialogue(rate) {
  const items = getActiveListening();
  const item = items[listenState.current];
  const lines = item.dialogue.map(d => d.de);
  speakSequence(lines, rate || 0.85);
  listenState.plays++;
  renderListeningView();
}

function startListeningQuiz() {
  listenState.phase = 'quiz';
  renderListeningView();
}

function checkListeningQuiz(btn, selected, correct) {
  if (btn.disabled) return;
  document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled = true; if (i === correct) b.classList.add('correct'); });
  const fb = document.getElementById('listenQuizFb');
  if (selected === correct) { btn.classList.add('correct'); listenState.quizCorrect++; fb.innerHTML = '<div class="feedback correct" style="margin-top:10px">✅ ¡Correcto!</div>'; }
  else { btn.classList.add('wrong'); fb.innerHTML = '<div class="feedback wrong" style="margin-top:10px">❌ Incorrecto</div>'; }
  fb.innerHTML += `<button class="next-btn" onclick="nextListenQ()" style="margin-top:8px">Siguiente →</button>`;
}

function nextListenQ() {
  listenState.quizIndex++;
  if (listenState.quizIndex >= getActiveListening()[listenState.current].quiz.length) listenState.quizDone = true;
  renderListeningView();
}

function closeListening() {
  listenState.current = null;
  renderExamTab();
}

        ${item.fields.map((f, i) => `<div class="form-field"><label>${f.label}</label><input type="text" id="formField${i}" placeholder="${f.placeholder}"></div>`).join('')}
        <button class="check-btn" style="width:100%;margin-top:10px" onclick="checkFormExercise()">Comprobar ✓</button>
        <div id="writingFb"></div>
      </div>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="closeWritingExercise()">←</button>
      <div class="lesson-title">✍️ ${item.title}</div>
    </div>
    <div class="lesson-content">
      <div style="font-size:13px;margin-bottom:10px">${item.scenario}</div>
      <div class="writing-hints">${item.hints.map(h => `<span class="writing-hint">💡 ${h}</span>`).join('')}</div>
      <textarea class="writing-area" id="writingInput" placeholder="Escribe tu texto en alemán aquí..." ${writeState.submitted ? 'disabled' : ''}></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        ${!writeState.submitted ? `<button class="check-btn" style="flex:1" onclick="checkWritingExercise()">Comprobar ✓</button>` : ''}
        <button class="rc-btn" style="flex:1" onclick="showWritingExample()">Ver ejemplo</button>
      </div>
      <div id="writingFb"></div>
    </div>
  </div>`;
}

function checkWritingExercise() {
  const items = getActiveWriting();
  const item = items[writeState.current];
  const text = document.getElementById('writingInput').value.trim().toLowerCase();
  if (text.length < 10) { document.getElementById('writingFb').innerHTML = '<div class="feedback wrong" style="margin-top:8px">Escribe al menos unas frases.</div>'; return; }

  writeState.submitted = true;
  const found = item.keywords.filter(kw => text.includes(kw.toLowerCase()));
  const missing = item.keywords.filter(kw => !text.includes(kw.toLowerCase()));
  const pct = Math.round(found.length / item.keywords.length * 100);
  const xp = Math.round(found.length * 5);
  data.xp += xp;
  if (!data.completedWriting) data.completedWriting = [];
  if (pct >= 40 && !data.completedWriting.includes(item.id)) { data.completedWriting.push(item.id); }
  saveData(); renderLevelBar();

  const fb = document.getElementById('writingFb');
  fb.innerHTML = `<div style="margin-top:12px">
    <div style="font-size:14px;font-weight:800;margin-bottom:6px">${pct >= 60 ? '✅ ¡Buen trabajo!' : '📝 Sigue practicando'} — ${found.length}/${item.keywords.length} palabras clave · +${xp} XP</div>
    <div style="font-size:12px;font-weight:700;margin-bottom:4px">Palabras clave encontradas:</div>
    <div>${found.map(k => `<span class="keyword-result found">✓ ${k}</span>`).join('')}${missing.map(k => `<span class="keyword-result missing">✗ ${k}</span>`).join('')}</div>
  </div>`;
  document.getElementById('writingInput').disabled = true;
}

function checkFormExercise() {
  const items = getActiveWriting();
  const item = items[writeState.current];
  let filled = 0;
  item.fields.forEach((f, i) => {
    const val = document.getElementById('formField' + i).value.trim();
    if (val.length > 0) filled++;
  });
  const xp = filled * 3;
  data.xp += xp;
  if (!data.completedWriting) data.completedWriting = [];
  if (filled >= item.fields.length - 1 && !data.completedWriting.includes(item.id)) data.completedWriting.push(item.id);
  saveData(); renderLevelBar();
  document.getElementById('writingFb').innerHTML = `<div class="feedback correct" style="margin-top:10px">✅ ${filled}/${item.fields.length} campos completados · +${xp} XP</div>`;
}

function showWritingExample() {
  const items = getActiveWriting();
  const item = items[writeState.current];
  const fb = document.getElementById('writingFb');
  fb.innerHTML = `<div class="grammar-tip" style="margin-top:10px"><div class="gt-header">📝 Ejemplo de respuesta</div><div class="gt-body" style="white-space:pre-line">${item.example || 'No hay ejemplo para este ejercicio.'}</div></div>`;
}

function closeWritingExercise() {
  writeState.current = null;
  renderExamTab();
}

// EXAM SIMULATION
let examState = { active: false, section: 0, timer: null, timeLeft: 0, answers: [], score: {} };

function getExamData() {
  const lvl = getActiveLevel();
  const listening = getActiveListening();
  const readings = getActiveReadings();
  const writing = getActiveWriting();
  const cases = typeof CASES_A1 !== 'undefined' ? (lvl === 'A2' ? [...CASES_A1, ...(typeof CASES_A2 !== 'undefined' ? CASES_A2 : [])] : CASES_A1) : [];
  return { listening, readings, writing, cases };
}

function startExam() {
  const ed = getExamData();
  const lesenTexts = shuffle(ed.readings).slice(0, 3);
  const lesenQs = [];
  lesenTexts.forEach(r => {
    const qs = shuffle(r.quiz).slice(0, 2);
    qs.forEach(q => lesenQs.push({ ...q, lines: r.lines, title: r.title }));
  });
  const hoerenItems = shuffle(ed.listening).slice(0, 3);
  const hoerenQs = [];
  hoerenItems.forEach(item => {
    const qs = shuffle(item.quiz).slice(0, 2);
    qs.forEach(q => hoerenQs.push({ ...q, dialogue: item.dialogue, title: item.title }));
  });
  const grammatikQs = shuffle(ed.cases).slice(0, 8);
  const schreibenItem = shuffle(ed.writing.filter(w => !w.fields))[0];

  examState = {
    active: true, section: 0, timer: null, timeLeft: 0, currentQ: 0,
    score: { lesen: 0, hoeren: 0, schreiben: 0, grammatik: 0 },
    prepared: { lesen: lesenQs, hoeren: hoerenQs, grammatik: grammatikQs, schreiben: schreibenItem },
    maxScores: { lesen: lesenQs.length, hoeren: hoerenQs.length, schreiben: 5, grammatik: grammatikQs.length }
  };
  renderExamSection();
}

function renderExamSection() {
  const el = document.getElementById('tab-exam');
  const sections = ['lesen','hoeren','schreiben','grammatik'];
  const sectionNames = ['📖 Lesen (Lectura)','🎧 Hören (Comprensión auditiva)','✍️ Schreiben (Escritura)','📝 Grammatik (Gramática)'];
  const sectionTimes = [10,8,10,7];
  const s = examState.section;

  if (s >= sections.length) { renderExamResults(); return; }

  examState.timeLeft = sectionTimes[s] * 60;
  if (examState.timer) clearInterval(examState.timer);
  examState.currentQ = 0;

  const key = sections[s];
  const totalQs = key === 'schreiben' ? 1 : examState.prepared[key].length;

  el.innerHTML = `<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="endExam()">✕</button>
      <div class="lesson-title">🎓 Simulacro ${getActiveLevel()}</div>
      <div class="lesson-step">${s + 1}/4</div>
    </div>
    <div class="lesson-content" style="text-align:center">
      <div class="exam-section-badge" style="background:var(--primary-light);color:var(--primary)">${sectionNames[s]}</div>
      <div style="font-size:14px;font-weight:700;margin:12px 0">${sectionTimes[s]} minutos · ${totalQs} pregunta${totalQs > 1 ? 's' : ''}</div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:16px">Sección ${s + 1} de 4</div>
      <button class="start-btn" onclick="startExamSection()">Comenzar →</button>
    </div>
  </div>`;
}

function startExamSection() {
  if (examState.timer) clearInterval(examState.timer);
  examState.timer = setInterval(() => {
    examState.timeLeft--;
    const timerEl = document.getElementById('examTimer');
    if (timerEl) {
      const m = Math.floor(examState.timeLeft / 60);
      const s = examState.timeLeft % 60;
      timerEl.textContent = `⏱ ${m}:${s < 10 ? '0' : ''}${s}`;
      if (examState.timeLeft <= 60) timerEl.classList.add('warning');
    }
    if (examState.timeLeft <= 0) { clearInterval(examState.timer); nextExamSection(); }
  }, 1000);
  renderExamQuestion();
}

function renderExamQuestion() {
  const el = document.getElementById('tab-exam');
  const s = examState.section;
  const sections = ['lesen','hoeren','schreiben','grammatik'];
  const sectionKey = sections[s];
  const prep = examState.prepared;

  let content = '';
  let totalQs = 0;

  if (sectionKey === 'lesen') {
    totalQs = prep.lesen.length;
    if (examState.currentQ >= totalQs) { nextExamSection(); return; }
    const q = prep.lesen[examState.currentQ];
    const lines = q.lines.map(l => `<div style="font-size:13px;margin-bottom:4px">${l.de}</div>`).join('');
    content = `<div style="font-size:11px;color:var(--text-light);margin-bottom:6px">Texto: ${q.title} — Pregunta ${examState.currentQ + 1}/${totalQs}</div>
      <div style="text-align:left;margin-bottom:12px;padding:10px;background:#F8FAFC;border-radius:8px;border:1px solid #E5E7EB">${lines}</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:10px">${q.q}</div>
      <div class="options">${q.opts.map((o, i) => `<button class="option-btn" onclick="examAnswer(this,${i},${q.correct},'lesen')">${o}</button>`).join('')}</div>`;
  } else if (sectionKey === 'hoeren') {
    totalQs = prep.hoeren.length;
    if (examState.currentQ >= totalQs) { nextExamSection(); return; }
    const q = prep.hoeren[examState.currentQ];
    const audioLines = q.dialogue.map(d => d.de);
    window._examAudioLines = audioLines;
    content = `<div style="font-size:11px;color:var(--text-light);margin-bottom:6px">Audio: ${q.title} — Pregunta ${examState.currentQ + 1}/${totalQs}</div>
      <div style="text-align:center;margin-bottom:12px">
      <button class="listen-play-btn" onclick="speakSequence(window._examAudioLines,0.85)" style="width:60px;height:60px;font-size:28px">▶</button>
      <div class="listen-hint">Escucha y responde</div>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:10px">${q.q}</div>
    <div class="options">${q.opts.map((o, i) => `<button class="option-btn" onclick="examAnswer(this,${i},${q.correct},'hoeren')">${o}</button>`).join('')}</div>`;
    setTimeout(() => speakSequence(audioLines, 0.85), 300);
  } else if (sectionKey === 'schreiben') {
    if (examState.currentQ >= 1) { nextExamSection(); return; }
    const item = prep.schreiben;
    content = `<div style="font-size:11px;color:var(--text-light);margin-bottom:6px">Escritura — 1 ejercicio</div>
      <div style="font-size:13px;margin-bottom:6px">${item.scenario}</div>
      <div class="writing-hints">${item.hints.map(h => `<span class="writing-hint">💡 ${h}</span>`).join('')}</div>
      <textarea class="writing-area" id="examWriteInput" placeholder="Escribe tu texto en alemán aquí..."></textarea>
      <div style="font-size:11px;color:var(--text-light);margin:6px 0">Mínimo 20 palabras. Se evalúa: palabras clave, longitud y estructura (mayúsculas, puntuación).</div>
      <button class="check-btn" style="width:100%;margin-top:4px" onclick="examCheckWriting()">Enviar →</button>`;
  } else if (sectionKey === 'grammatik') {
    totalQs = prep.grammatik.length;
    if (examState.currentQ >= totalQs) { nextExamSection(); return; }
    const c = prep.grammatik[examState.currentQ];
    const parts = c.sentence.split('___');
    content = `<div style="font-size:11px;color:var(--text-light);margin-bottom:6px">Gramática — Pregunta ${examState.currentQ + 1}/${totalQs}</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px">${parts[0]}<span style="border-bottom:2px solid var(--primary);color:var(--primary)">?</span>${parts[1] || ''}</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:12px">${c.es}</div>
      <div class="options">${c.opts.map((o, i) => `<button class="option-btn" onclick="examAnswer(this,${i},${c.correct},'grammatik')">${o}</button>`).join('')}</div>`;
  }

  const m = Math.floor(examState.timeLeft / 60);
  const sec = examState.timeLeft % 60;
  el.innerHTML = `<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="endExam()">✕</button>
      <div class="lesson-title">🎓 ${['Lesen','Hören','Schreiben','Grammatik'][s]}</div>
    </div>
    <div id="examTimer" class="exam-timer">⏱ ${m}:${sec < 10 ? '0' : ''}${sec}</div>
    <div class="lesson-content">${content}<div id="examFb"></div></div>
  </div>`;
}

function examAnswer(btn, selected, correct, section) {
  if (btn.disabled) return;
  document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled = true; if (i === correct) b.classList.add('correct'); });
  if (selected === correct) { btn.classList.add('correct'); examState.score[section]++; }
  else { btn.classList.add('wrong'); }
  document.getElementById('examFb').innerHTML = `<button class="next-btn" onclick="examNext()" style="margin-top:10px">Siguiente →</button>`;
}

function examCheckWriting() {
  const item = examState.prepared.schreiben;
  const text = document.getElementById('examWriteInput').value.trim();
  const textLow = text.toLowerCase();
  const words = text.split(/\s+/).filter(w => w.length > 0);
  const found = item.keywords.filter(kw => textLow.includes(kw.toLowerCase()));

  let score = 0;
  const keywordScore = Math.round(found.length / item.keywords.length * 2);
  score += keywordScore;
  if (words.length >= 20) score += 1;
  if (words.length >= 30) score += 1;
  const hasGreeting = /^(hallo|liebe|sehr geehrte|hi)/i.test(text);
  const hasClosing = /(grüße|gruesse|tschüss|bis bald)/i.test(textLow);
  if (hasGreeting && hasClosing) score += 1;
  score = Math.min(score, 5);

  examState.score.schreiben += score;
  document.getElementById('examWriteInput').disabled = true;

  const details = [
    `Palabras clave: ${found.length}/${item.keywords.length}`,
    `Longitud: ${words.length} palabras ${words.length >= 20 ? '✓' : '(mín. 20)'}`,
    `Saludo + despedida: ${hasGreeting && hasClosing ? '✓' : '✗'}`,
  ].join('<br>');

  document.getElementById('examFb').innerHTML = `<div style="margin-top:10px;padding:10px;background:#F8FAFC;border-radius:8px;border:1px solid #E5E7EB;text-align:left">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">Puntuación: ${score}/5</div>
    <div style="font-size:11px;color:var(--text-light)">${details}</div>
    <div style="margin-top:6px">${found.map(k => `<span class="keyword-result found">✓ ${k}</span>`).join('')}${item.keywords.filter(k => !found.includes(k)).map(k => `<span class="keyword-result missing">✗ ${k}</span>`).join('')}</div>
  </div><button class="next-btn" onclick="examNext()" style="margin-top:8px">Siguiente →</button>`;
}

function examNext() {
  examState.currentQ++;
  renderExamQuestion();
}

function nextExamSection() {
  if (examState.timer) clearInterval(examState.timer);
  examState.section++;
  examState.currentQ = 0;
  renderExamSection();
}

function renderExamResults() {
  if (examState.timer) clearInterval(examState.timer);
  const el = document.getElementById('tab-exam');
  const sc = examState.score;
  const ms = examState.maxScores;
  const total = sc.lesen + sc.hoeren + sc.schreiben + sc.grammatik;
  const maxTotal = ms.lesen + ms.hoeren + ms.schreiben + ms.grammatik;
  const pct = Math.round(total / maxTotal * 100);
  const passed = pct >= 60;
  const xp = total * 10;
  data.xp += xp; saveData(); renderLevelBar();

  const barColor = (score, max) => {
    const p = Math.round(score / max * 100);
    return p >= 60 ? 'var(--correct)' : 'var(--wrong)';
  };

  el.innerHTML = `<div class="lesson-view">
    <div class="lesson-header">
      <div class="lesson-title">🎓 Resultado del examen</div>
    </div>
    <div class="lesson-content" style="text-align:center">
      <div style="font-size:56px;margin-bottom:8px">${passed ? '🏆' : '📚'}</div>
      <div style="font-size:22px;font-weight:800;margin-bottom:4px">${passed ? '¡Aprobado!' : 'No aprobado'}</div>
      <div style="font-size:16px;color:var(--text-light);margin-bottom:16px">${pct}% — ${total}/${maxTotal} puntos · +${xp} XP</div>
      ${['Lesen','Hören','Schreiben','Grammatik'].map((name, i) => {
        const key = ['lesen','hoeren','schreiben','grammatik'][i];
        const s = sc[key]; const m = ms[key]; const p = Math.round(s/m*100);
        return `<div style="margin-bottom:8px;text-align:left">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${name}</span><span>${s}/${m} (${p}%)</span></div>
          <div style="height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden"><div style="height:100%;width:${p}%;background:${barColor(s,m)};border-radius:4px"></div></div>
        </div>`;
      }).join('')}
      <div style="font-size:12px;color:var(--text-light);margin-top:12px">${passed ? 'Puntuación suficiente para el Goethe ' + getActiveLevel() : 'Necesitas al menos 60% para aprobar. ¡Sigue practicando!'}</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
        <button class="start-btn" style="font-size:14px" onclick="closeExam()">Volver ←</button>
        <button class="start-btn" style="font-size:14px;background:var(--secondary)" onclick="startExam()">Repetir 🔄</button>
      </div>
    </div>
  </div>`;
  examState.active = false;
}

function endExam() {
  if (examState.timer) clearInterval(examState.timer);
  examState.active = false;
  const timerEl = document.getElementById('examTimer');
  if (timerEl) timerEl.remove();
  renderExamTab();
}

function closeExam() {
  const timerEl = document.getElementById('examTimer');
  if (timerEl) timerEl.remove();
  renderExamTab();
}

// ERROR TRACKING
function logError(category, detail, correct) {
  if (!data.errorLog) data.errorLog = [];
  data.errorLog.push({ cat: category, detail: detail, correct: correct, date: Date.now() });
  if (data.errorLog.length > 200) data.errorLog = data.errorLog.slice(-200);
  saveData();
}

function getErrorStats() {
  if (!data.errorLog || data.errorLog.length === 0) return [];
  const cats = {};
  const twoWeeksAgo = Date.now() - 14 * 24 * 60 * 60 * 1000;
  data.errorLog.filter(e => e.date > twoWeeksAgo).forEach(e => {
    if (!cats[e.cat]) cats[e.cat] = { total: 0, errors: 0, examples: [] };
    cats[e.cat].total++;
    if (!e.correct) {
      cats[e.cat].errors++;
      if (cats[e.cat].examples.length < 3) cats[e.cat].examples.push(e.detail);
    }
  });
  return Object.entries(cats)
    .map(([cat, d]) => ({ cat, errors: d.errors, total: d.total, pct: Math.round(d.errors / d.total * 100), examples: d.examples }))
    .filter(d => d.errors > 0)
    .sort((a, b) => b.errors - a.errors);
}

function renderErrorStats() {
  const stats = getErrorStats();
  if (stats.length === 0) return '<div style="font-size:13px;color:var(--text-light);padding:10px">¡Sin errores frecuentes en las últimas 2 semanas! Sigue así.</div>';
  return stats.slice(0, 8).map(s => {
    const color = s.pct >= 50 ? 'var(--wrong)' : s.pct >= 30 ? 'var(--accent)' : 'var(--text-light)';
    return `<div style="padding:8px 10px;background:white;border-radius:8px;border:1px solid #E5E7EB;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:700">${s.cat}</span>
        <span style="font-size:12px;font-weight:700;color:${color}">${s.errors} errores / ${s.total} intentos (${s.pct}%)</span>
      </div>
      <div style="height:4px;background:#E5E7EB;border-radius:2px;margin-top:4px;overflow:hidden"><div style="height:100%;width:${100-s.pct}%;background:${s.pct>=50?'var(--wrong)':'var(--correct)'};border-radius:2px"></div></div>
      ${s.examples.length > 0 ? `<div style="font-size:10px;color:var(--text-light);margin-top:4px">Ej: ${s.examples.join(' · ')}</div>` : ''}
    </div>`;
  }).join('');
}

// LESSON NOTES
function getLessonNotes(lessonId) {
  if (!data.lessonNotes) data.lessonNotes = {};
  return data.lessonNotes[lessonId] || '';
}

function saveLessonNotes(lessonId, text) {
  if (!data.lessonNotes) data.lessonNotes = {};
  data.lessonNotes[lessonId] = text;
  saveData();
}

function toggleLessonNotes(lessonId) {
  const area = document.getElementById('lessonNotesArea');
  if (!area) return;
  if (area.style.display === 'none') {
    const notes = getLessonNotes(lessonId);
    area.style.display = 'block';
    area.innerHTML = `
      <div class="notes-toolbar">
        <button onclick="noteFormat('bold')" title="Negrita"><b>B</b></button>
        <button onclick="noteFormat('italic')" title="Cursiva"><i>I</i></button>
        <button onclick="noteFormat('underline')" title="Subrayado"><u>U</u></button>
        <button onclick="noteFormat('strikeThrough')" title="Tachado"><s>S</s></button>
        <button onclick="noteFormat('insertUnorderedList')" title="Lista">•</button>
        <button onclick="noteHighlight()" title="Resaltar" style="background:#FEF08A">🖍</button>
      </div>
      <div class="notes-editor" id="notesEditor" contenteditable="true" data-placeholder="Escribe tus apuntes aquí...">${notes}</div>
      <div id="notesSavedMsg"></div>`;
    const editor = document.getElementById('notesEditor');
    let saveTimeout;
    editor.addEventListener('input', () => {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveLessonNotes(lessonId, editor.innerHTML);
        const msg = document.getElementById('notesSavedMsg');
        if (msg) { msg.innerHTML = '<span class="notes-saved">✓ Guardado</span>'; setTimeout(() => { if(msg) msg.innerHTML = ''; }, 1500); }
      }, 500);
    });
    editor.focus();
  } else {
    area.style.display = 'none';
  }
}

function noteFormat(cmd) {
  document.execCommand(cmd, false, null);
  document.getElementById('notesEditor').focus();
}

function noteHighlight() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0 && !sel.isCollapsed) {
    const parent = sel.anchorNode.parentElement;
    if (parent && parent.style && parent.style.backgroundColor && parent.style.backgroundColor.includes('254')) {
      document.execCommand('hiliteColor', false, 'transparent');
    } else {
      document.execCommand('hiliteColor', false, '#FEF08A');
    }
  }
  document.getElementById('notesEditor').focus();
}

function renderAllNotes() {
  if (!data.lessonNotes) return '<div style="font-size:13px;color:var(--text-light);padding:10px">No tienes apuntes todavía. Toma notas dentro de cada lección.</div>';
  const entries = Object.entries(data.lessonNotes).filter(([k, v]) => v && v.trim().length > 0);
  if (entries.length === 0) return '<div style="font-size:13px;color:var(--text-light);padding:10px">No tienes apuntes todavía. Toma notas dentro de cada lección.</div>';
  return entries.map(([lessonId, text]) => {
    const lesson = LESSONS.find(l => l.id === lessonId);
    const title = lesson ? lesson.icon + ' ' + lesson.title : lessonId;
    return `<div class="notes-summary">
      <div class="ns-title">${title}</div>
      <div class="ns-text">${text}</div>
    </div>`;
  }).join('');
}

function downloadNotes() {
  if (!data.lessonNotes) return;
  const entries = Object.entries(data.lessonNotes).filter(([k, v]) => v && v.trim().length > 0);
  if (entries.length === 0) { alert('No tienes apuntes todavía.'); return; }
  let text = '📝 MIS APUNTES — Deutsch Lernspiel\n';
  text += '═══════════════════════════════════\n\n';
  entries.forEach(([lessonId, notes]) => {
    const lesson = LESSONS.find(l => l.id === lessonId);
    const title = lesson ? lesson.icon + ' ' + lesson.title : lessonId;
    text += '── ' + title + ' ──\n';
    const plainNotes = notes.replace(/<br\s*\/?>/gi, '\n').replace(/<\/?(b|strong)>/gi, '*').replace(/<\/?(i|em)>/gi, '_').replace(/<\/?(u)>/gi, '').replace(/<[^>]+>/g, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
    text += plainNotes + '\n\n';
  });
  text += '\nGenerado el ' + new Date().toLocaleDateString('es-CL') + '\n';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mis-apuntes-aleman.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportProgress() {
  const exportData = JSON.parse(JSON.stringify(data));
  exportData._exportDate = new Date().toISOString();
  exportData._version = 'DeutschLernspiel_v1';
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'deutsch-progreso-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg = document.getElementById('backupMsg');
  if (msg) msg.innerHTML = '<span class="notes-saved">✓ Progreso exportado correctamente</span>';
}

function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.xp && imported.xp !== 0) { alert('Archivo no válido.'); return; }
      if (!confirm('¿Restaurar progreso desde este archivo? Esto reemplazará tu progreso actual.')) return;
      Object.assign(data, imported);
      delete data._exportDate;
      delete data._version;
      saveData();
      renderLevelBar();
      renderProgressTab();
      const msg = document.getElementById('backupMsg');
      if (msg) msg.innerHTML = '<span class="notes-saved">✓ Progreso restaurado correctamente — ' + (imported.xp || 0) + ' XP, ' + (imported.completedLessons ? imported.completedLessons.length : 0) + ' lecciones</span>';
    } catch(err) {
      alert('Error al leer el archivo: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// MEMORY GAME
let memoryState = { cards: [], flipped: [], matched: [], words: [], locked: false, moves: 0, playing: false };

function getUnlearnedWords() {
  if (!data.learnedWords) data.learnedWords = [];
  const allWords = Object.values(getActiveVocab()).flat();
  const unlearned = allWords.filter(w => !data.learnedWords.includes(w.de));
  return unlearned.length > 0 ? unlearned : allWords;
}

function startMemoryGame() {
  const words = shuffle(getUnlearnedWords()).slice(0, 6);
  const cards = [];
  words.forEach((w, i) => {
    cards.push({ id: i * 2, pairId: i, type: 'emoji', emoji: w.emoji, es: w.es, word: w });
    cards.push({ id: i * 2 + 1, pairId: i, type: 'de', de: w.de, word: w });
  });
  memoryState = { cards: shuffle(cards), flipped: [], matched: [], words: words, locked: false, moves: 0, playing: true };
  renderMemoryGame();
}

function renderMemoryGame() {
  const el = document.getElementById('memoryGameArea');
  if (!el) return;
  if (!memoryState.playing) {
    el.innerHTML = `<div style="text-align:center;padding:16px">
      <div style="font-size:36px;margin-bottom:8px">🧠</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">Juego de Memoria</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:12px">Encuentra las parejas emoji ↔ palabra en alemán. Aprende vocabulario nuevo de forma visual.</div>
      <div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:12px">${getUnlearnedWords().length} palabras por aprender</div>
      <button class="start-btn" style="font-size:14px" onclick="startMemoryGame()">Jugar ▶</button>
    </div>`;
    return;
  }
  if (memoryState.matched.length === memoryState.cards.length) {
    renderMemorySummary();
    return;
  }
  const cardsHtml = memoryState.cards.map(c => {
    const isFlipped = memoryState.flipped.includes(c.id);
    const isMatched = memoryState.matched.includes(c.id);
    const content = c.type === 'emoji'
      ? `<div class="mb-emoji">${c.emoji}</div><div class="mb-text">${c.es}</div>`
      : `<div class="mb-text" style="font-size:12px;font-weight:800">${c.de}</div>`;
    return `<div class="memory-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}" onclick="flipMemoryCard(${c.id})">
      <div class="memory-card-inner">
        <div class="memory-face memory-front">?</div>
        <div class="memory-face memory-back">${content}</div>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:12px;font-weight:700">🧠 Memoria</span>
    <span style="font-size:11px;color:var(--text-light)">${memoryState.matched.length / 2}/${memoryState.words.length} parejas · ${memoryState.moves} movimientos</span>
  </div>
  <div class="memory-grid">${cardsHtml}</div>`;
}

function flipMemoryCard(id) {
  if (memoryState.locked) return;
  if (memoryState.flipped.includes(id)) return;
  if (memoryState.matched.includes(id)) return;
  memoryState.flipped.push(id);
  renderMemoryGame();
  if (memoryState.flipped.length === 2) {
    memoryState.locked = true;
    memoryState.moves++;
    const [a, b] = memoryState.flipped.map(fid => memoryState.cards.find(c => c.id === fid));
    if (a.pairId === b.pairId) {
      memoryState.matched.push(a.id, b.id);
      memoryState.flipped = [];
      memoryState.locked = false;
      speak(a.word.de);
      setTimeout(() => renderMemoryGame(), 300);
    } else {
      setTimeout(() => {
        memoryState.flipped = [];
        memoryState.locked = false;
        renderMemoryGame();
      }, 1000);
    }
  }
}

// DICTIONARY
function buildDictIndex() {
  const allVocab = [];
  const pluralMap = {};
  const addPlurals = (arr) => { if(arr) arr.forEach(p => { const noun = p.singular.replace(/^(der|die|das)\s+/i,''); pluralMap[noun.toLowerCase()] = p; }); };
  addPlurals(typeof PLURALS_A1 !== 'undefined' ? PLURALS_A1 : []);
  addPlurals(typeof PLURALS_A2 !== 'undefined' ? PLURALS_A2 : []);

  const processVocab = (vocab, level) => {
    Object.entries(vocab).forEach(([cat, words]) => {
      words.forEach(w => {
        const noun = w.de.replace(/^(der|die|das)\s+/i, '');
        const pl = pluralMap[noun.toLowerCase()];
        allVocab.push({
          de: w.de, es: w.es, article: w.article || '', emoji: w.emoji || '',
          pron: w.pron || '', cat: cat, level: level,
          plural: pl ? pl.plural : '', pluralRule: pl ? pl.rule : ''
        });
      });
    });
  };
  if (typeof VOCAB_A1 !== 'undefined') processVocab(VOCAB_A1, 'A1');
  if (typeof VOCAB_A2 !== 'undefined') processVocab(VOCAB_A2, 'A2');
  return allVocab;
}

let dictIndex = null;

function toggleDict() {
  const panel = document.getElementById('dictPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    if (!dictIndex) dictIndex = buildDictIndex();
    document.getElementById('dictSearch').value = '';
    document.getElementById('dictResults').innerHTML = '';
    document.getElementById('dictCount').textContent = dictIndex.length + ' palabras disponibles';
    setTimeout(() => document.getElementById('dictSearch').focus(), 100);
  }
}

function searchDict() {
  if (!dictIndex) dictIndex = buildDictIndex();
  const q = document.getElementById('dictSearch').value.trim().toLowerCase();
  const results = document.getElementById('dictResults');
  const count = document.getElementById('dictCount');

  if (q.length < 2) {
    results.innerHTML = '<div style="text-align:center;color:var(--text-light);font-size:13px;padding:20px">Escribe al menos 2 letras para buscar</div>';
    count.textContent = dictIndex.length + ' palabras disponibles';
    return;
  }

  const matches = dictIndex.filter(w =>
    w.es.toLowerCase().includes(q) || w.de.toLowerCase().includes(q)
  ).slice(0, 30);

  count.textContent = matches.length + ' resultado' + (matches.length !== 1 ? 's' : '');

  if (matches.length === 0) {
    results.innerHTML = '<div style="text-align:center;color:var(--text-light);font-size:13px;padding:20px">No se encontraron resultados</div>';
    return;
  }

  results.innerHTML = matches.map(w => {
    const artClass = w.article === 'der' ? 'der' : w.article === 'die' ? 'die' : w.article === 'das' ? 'das' : '';
    const artLabel = w.article === 'der' ? 'masc.' : w.article === 'die' ? 'fem.' : w.article === 'das' ? 'neutro' : '';
    return `<div class="dict-result">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="font-size:20px">${w.emoji}</span>
        ${artClass ? `<span class="dr-article ${artClass}">${artLabel}</span>` : ''}
        <span class="dr-word">${w.de}</span>
        <button class="speak-btn sm" onclick="event.stopPropagation();speakBtn('${escapeStr(w.de)}',this)">🔊</button>
      </div>
      <div class="dr-es">🇪🇸 ${w.es}</div>
      ${w.pron ? `<div class="dr-pron">${w.pron}</div>` : ''}
      ${w.plural ? `<div class="dr-plural">pl.: ${w.plural} ${w.pluralRule ? '<span style="font-size:10px;color:var(--accent)">(' + w.pluralRule + ')</span>' : ''}</div>` : ''}
      <div class="dr-cat">${w.cat} · ${w.level}</div>
    </div>`;
  }).join('');
}

// HOME TAB

function quickStart(mode) {
  switchTab('play');
  if (mode === 'review') {
    state.mode = 'review';
    renderModes();
  }
  resetGame();
  state.started = true;
  recordDay();
  const v = getActiveVocab();
  if (!state.selectedCats || state.selectedCats.length === 0) state.selectedCats = [...Object.keys(v)];
  const catWords = state.selectedCats.flatMap(c => v[c] || []);
  if (state.mode === 'review') {
    state.words = getReviewWords().slice(0, state.round);
  } else if (state.mode === 'articles') {
    state.words = shuffle(catWords.filter(w => w.article)).slice(0, state.round);
  } else if (state.mode === 'sentences') {
    state.words = shuffle(getActiveSentences()).slice(0, state.round);
  } else if (state.mode === 'conjugation') {
    const verbs = shuffle(getActiveVerbs()).slice(0, state.round);
    state.words = verbs.map(v => ({de: v.inf, es: v.es, emoji: '🔀', _conjQ: makeConjQuestion(v)}));
  } else if (state.mode === 'plurals') {
    state.words = shuffle(getActivePlurals()).slice(0, state.round);
  } else if (state.mode === 'cases') {
    state.words = shuffle(getActiveCases()).slice(0, state.round);
  } else {
    state.words = shuffle(catWords).slice(0, state.round);
  }
  if (state.words.length === 0) { showWelcome(); return; }
  showQuestion();
  setTimeout(() => {
    const ga = document.getElementById('gameArea');
    if (ga) ga.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function renderHomeTab() {
  const el = document.getElementById('tab-home');
  const name = data.userName || '';
  const ds = getDailyStreak();
  const li = getLevelXP(data.xp);
  const v = getActiveVocab();
  const allWords = Object.values(v).flat();
  const totalWords = allWords.length;
  const learnedWords = allWords.filter(w => { const s = getWordStat(w); return s.correct > 0; }).length;
  const dueWords = allWords.filter(w => isDue(getWordKey(w)) && getWordStat(w).correct > 0).length;
  const pctVocab = totalWords > 0 ? Math.round(learnedWords / totalWords * 100) : 0;
  const pctXP = Math.min(100, Math.round(li.current / li.needed * 100));

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Guten Tag' : 'Guten Abend';

  let srsSummary = '';
  if (dueWords > 0) {
    srsSummary = `<div class="srs-summary" onclick="quickStart('review')" style="cursor:pointer">
      <span class="srs-icon">🧠</span>
      <div class="srs-info"><div class="srs-title">${dueWords} palabras para repasar</div>
      <div class="srs-desc">Tu SRS detectó que estás por olvidarlas</div></div>
      <span style="font-size:18px">→</span>
    </div>`;
  }

  el.innerHTML = `
    <div class="home-card">
      <div class="home-greeting">${greeting}, ${name}! 👋</div>
      <div style="display:flex;align-items:center;gap:12px;margin:12px 0">
        <div class="level-badge" style="width:44px;height:44px;font-size:18px">${li.level}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:13px;font-weight:700">${getActiveLevel()} · Nivel ${li.level}</span>
            <span style="font-size:12px;color:var(--text-light)">${data.xp} XP</span>
          </div>
          <div class="xp-bar" style="margin-top:4px"><div class="xp-fill" style="width:${pctXP}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-light)">
            <span>${learnedWords}/${totalWords} palabras · ${pctVocab}%</span>
            <span>${ds > 0 ? '🔥 ' : ''}${ds} días</span>
          </div>
        </div>
      </div>
      ${srsSummary}
      <button class="home-action" onclick="quickStart()">Practicar ahora ▶</button>
    </div>
  `;
  renderLessonsBelow();
}

function renderLessonsBelow(){
  const el=document.getElementById('tab-home');
  const activeLessons=getActiveLessons();
  const completedLessons=data.completedLessons||[];
  const doneCount=activeLessons.filter(l=>completedLessons.includes(l.id)).length;

  el.innerHTML+=`<div class="home-card" style="margin-bottom:14px"><div id="memoryGameArea"></div></div>`;
  renderMemoryGame();

  el.innerHTML+=`<div class="prog-section"><h3>📚 Lecciones ${getActiveLevel()}</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">${doneCount}/${activeLessons.length} completadas</div>
    <div class="lesson-list">${activeLessons.map((l,i)=>{
      const globalIdx=LESSONS.indexOf(l);
      const done=completedLessons.includes(l.id);
      const score=(data.lessonScores||{})[l.id];
      return`<div class="lesson-card ${done?'completed':''}" onclick="openLesson(${globalIdx})">
        <span class="lc-num">${i+1}</span>
        <span class="lc-icon">${l.icon}</span>
        <div class="lc-info"><div class="lc-title">${l.title}</div><div class="lc-desc">${l.desc}</div></div>
        ${done ? `<span class="lc-badge done" title="Lección completada">✓</span>${score ? `<span class="lc-badge" style="background:${score>=90?'#FEF3C7':score>=70?'#FFF1E0':'#FEE2E2'};color:${score>=90?'#92400E':score>=70?'#9A3412':'#991B1B'};border:none" title="${score}% aciertos — ${score>=90?'Dominada':'Repasa para mejorar'}">${score>=90?'⭐⭐⭐':score>=70?'⭐⭐':'⭐'}</span>` : ''}` : `<span class="lc-badge new" title="Aún no has hecho esta lección">Pendiente</span>`}
      </div>`;
    }).join("")}</div></div>`;
}

// CATEGORY TOGGLE
function toggleCategories() {
  const el = document.getElementById('categories');
  if (el) el.classList.toggle('expanded');
  const btn = document.getElementById('catToggle');
  if (btn) btn.textContent = el.classList.contains('expanded') ? '▲ Menos categorías' : '▼ Más categorías';
}

// INIT
function initApp() {
  try {
  if (!data.onboarded) {
    showOnboarding();
  } else {
    document.getElementById('onboarding').innerHTML = '';
    document.getElementById('mainApp').style.display = '';
    document.getElementById('appTitle').textContent = '🇩🇪 Deutsch ' + getActiveLevel();
    state.cat = Object.keys(getActiveVocab())[0];
    updateUILanguage();
    renderLevelBar();
    renderLevelSelectBar();
    renderCategories();
    renderModes();
    switchTab('home');
  }
  } catch(e) {
    document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:red"><h2>Error</h2><pre>'+e.message+'\n'+e.stack+'</pre></div>';
  }
}

window.onerror = function(msg,url,line,col,err) {
  document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:red"><h2>Error en línea '+line+'</h2><pre>'+msg+'</pre></div>';
};

initApp();
</script>
</body>
</html>
