<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch A1 Lernspiel</title>
<style>
:root {
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --primary: #E8503A;
  --primary-light: #FFEAE6;
  --secondary: #2D6A4F;
  --secondary-light: #D8F3DC;
  --accent: #F4A261;
  --accent-light: #FFF1E0;
  --text: #1A1A2E;
  --text-light: #6B7280;
  --correct: #10B981;
  --correct-bg: #D1FAE5;
  --wrong: #EF4444;
  --wrong-bg: #FEE2E2;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --gold: #F59E0B;
  --purple: #8B5CF6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
.app { max-width:520px; margin:0 auto; padding:16px 16px 80px; }

.header { text-align:center; padding:16px 0 10px; }
.header h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

/* HOME SCREEN */
.home-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:20px; margin-bottom:14px; position:relative; overflow:hidden; }
.home-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary)); }
.home-greeting { font-size:20px; font-weight:800; margin-bottom:4px; }
.home-sub { font-size:13px; color:var(--text-light); margin-bottom:16px; }
.home-action { padding:14px; border-radius:var(--radius-sm); border:none; width:100%; background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(232,80,58,0.3); transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.home-action:hover { transform:translateY(-2px); }
.home-action.secondary { background:var(--secondary); box-shadow:0 4px 16px rgba(45,106,79,0.3); }

.home-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.home-stat { background:var(--card); border-radius:var(--radius-sm); padding:12px 8px; text-align:center; box-shadow:var(--shadow); }
.home-stat .hs-num { font-size:24px; font-weight:900; }
.home-stat .hs-label { font-size:10px; color:var(--text-light); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }

.home-section { margin-bottom:14px; }
.home-section-title { font-size:13px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }

.home-quick-links { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.home-link { background:var(--card); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow); cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:10px; border:1px solid rgba(0,0,0,0.04); }
.home-link:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.hl-icon { font-size:24px; }
.hl-text { font-size:13px; font-weight:700; }
.hl-sub { font-size:10px; color:var(--text-light); }

.srs-summary { display:flex; align-items:center; gap:12px; padding:12px; background:linear-gradient(135deg,var(--accent-light),#FFF5F5); border-radius:var(--radius-sm); margin-bottom:12px; }
.srs-summary .srs-icon { font-size:28px; }
.srs-summary .srs-info { flex:1; }
.srs-summary .srs-title { font-size:14px; font-weight:700; }
.srs-summary .srs-desc { font-size:11px; color:var(--text-light); }

/* LEVEL BAR */
.level-bar { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:12px; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,0.04); }
.level-badge { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#F97316); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:white; flex-shrink:0; }
.level-info { flex:1; min-width:0; }
.level-info .level-text { font-size:12px; font-weight:700; color:var(--text); }
.level-info .xp-text { font-size:11px; color:var(--text-light); }
.xp-bar { width:100%; height:6px; background:#E5E7EB; border-radius:3px; margin-top:3px; overflow:hidden; }
.xp-fill { height:100%; background:linear-gradient(90deg,var(--gold),#F97316); border-radius:3px; transition:width 0.5s ease; }
.daily-streak-badge { text-align:center; flex-shrink:0; }
.daily-streak-badge .ds-num { font-size:20px; font-weight:900; color:var(--primary); line-height:1; }
.daily-streak-badge .ds-label { font-size:9px; color:var(--text-light); text-transform:uppercase; }

/* TABS */
.tabs { display:flex; gap:4px; margin-bottom:14px; background:var(--card); border-radius:var(--radius-sm); padding:4px; box-shadow:var(--shadow); }
.tab-btn { flex:1; padding:10px 4px; border:none; background:transparent; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s; color:var(--text-light); }
.tab-btn.active { background:var(--primary); color:white; box-shadow:0 2px 8px rgba(232,80,58,0.3); }
.tab-btn:hover:not(.active) { background:var(--primary-light); }

.tab-content { display:none; }
.tab-content.active { display:block; }

/* STATS BAR */
.stats { display:flex; gap:8px; margin-bottom:14px; }
.stat-card { flex:1; background:var(--card); border-radius:var(--radius-sm); padding:8px; text-align:center; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,0.04); }
.stat-card .num { font-size:20px; font-weight:800; color:var(--primary); }
.stat-card .label { font-size:10px; color:var(--text-light); text-transform:uppercase; letter-spacing:0.5px; }

/* CATEGORIES */
.categories { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; max-height:120px; overflow:hidden; transition:max-height 0.3s ease; }
.categories.expanded { max-height:2000px; }
.cat-btn { padding:8px 14px; border-radius:20px; border:2px solid transparent; background:var(--card); font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.06); display:flex; align-items:center; gap:4px; position:relative; }
.cat-btn:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
.cat-btn.active { border-color:var(--primary); background:var(--primary-light); color:var(--primary); }
.cat-mastery { position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%; font-size:8px; display:flex; align-items:center; justify-content:center; font-weight:800; border:2px solid white; }
.cat-toggle { width:100%; text-align:center; padding:6px; font-size:11px; font-weight:700; color:var(--text-light); cursor:pointer; border:none; background:none; }
.cat-toggle:hover { color:var(--primary); }

/* MODES */
.modes { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:16px; }
.mode-btn { padding:8px 2px; border-radius:var(--radius-sm); border:2px solid transparent; background:var(--card); cursor:pointer; text-align:center; transition:all 0.2s; box-shadow:var(--shadow); }
.mode-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.mode-btn.active { border-color:var(--secondary); background:var(--secondary-light); }
.mode-btn .icon { font-size:20px; margin-bottom:1px; }
.mode-btn .name { font-size:9px; font-weight:700; }

/* SENTENCE BUILDER */
.sb-answer-zone { min-height:52px; width:100%; padding:10px; border:2px dashed #CBD5E1; border-radius:var(--radius-sm); background:#F8FAFC; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; align-items:center; justify-content:center; transition:border-color 0.3s; }
.sb-answer-zone.has-words { border-color:var(--primary); border-style:solid; }
.sb-answer-zone.correct { border-color:var(--correct); background:var(--correct-bg); }
.sb-answer-zone.wrong { border-color:var(--wrong); background:var(--wrong-bg); }
.sb-word-bank { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; width:100%; }
.sb-word { padding:8px 14px; border-radius:8px; border:2px solid #E5E7EB; background:white; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.15s; user-select:none; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
.sb-word:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary); }
.sb-word.placed { opacity:0.3; pointer-events:none; border-style:dashed; }
.sb-word.in-answer { background:var(--primary-light); border-color:var(--primary); color:var(--primary); }
.sb-word.in-answer:hover { background:var(--wrong-bg); border-color:var(--wrong); }
.sb-placeholder { font-size:13px; color:#94A3B8; font-style:italic; }

/* GAME AREA */
.game-area { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:24px; min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.game-area::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary)); }

.emoji-display { font-size:64px; margin-bottom:6px; animation:bounceIn 0.4s ease; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
@keyframes bounceIn { 0%{transform:scale(0.3);opacity:0} 50%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

.word-es { font-size:20px; font-weight:700; color:var(--text); margin-bottom:4px; text-align:center; }
.word-hint { font-size:13px; color:var(--text-light); margin-bottom:14px; font-style:italic; }

.options { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.option-btn { padding:12px 10px; border-radius:var(--radius-sm); border:2px solid #E5E7EB; background:white; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; text-align:center; line-height:1.3; }
.option-btn:hover { border-color:var(--primary); background:var(--primary-light); transform:scale(1.02); }
.option-btn.correct { border-color:var(--correct); background:var(--correct-bg); animation:pulse 0.3s ease; }
.option-btn.wrong { border-color:var(--wrong); background:var(--wrong-bg); animation:shake 0.4s ease; }
.option-btn:disabled { cursor:default; opacity:0.7; }
.option-btn:disabled:hover { transform:none; }

@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.input-area { width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; }
.text-input { width:100%; padding:12px 14px; border:2px solid #E5E7EB; border-radius:var(--radius-sm); font-size:18px; font-weight:600; text-align:center; outline:none; transition:border-color 0.2s; }
.text-input:focus { border-color:var(--primary); }
.text-input.correct { border-color:var(--correct); background:var(--correct-bg); }
.text-input.wrong { border-color:var(--wrong); background:var(--wrong-bg); }

.check-btn { padding:10px 28px; border-radius:24px; border:none; background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 16px rgba(232,80,58,0.3); }
.check-btn:hover { transform:translateY(-2px); }

.flashcard-container { perspective:800px; width:100%; max-width:300px; }
.flashcard { width:100%; height:200px; position:relative; transform-style:preserve-3d; transition:transform 0.5s ease; cursor:pointer; }
.flashcard.flipped { transform:rotateY(180deg); }
.flashcard-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; border:2px solid #E5E7EB; }
.flashcard-front { background:linear-gradient(135deg,#FFF5F5,#FFF0EA); }
.flashcard-back { background:linear-gradient(135deg,#E8F5E9,#F1F8E9); transform:rotateY(180deg); }
.flashcard-front .emoji-display { font-size:48px; }
.flashcard-back .de-word { font-size:22px; font-weight:800; color:var(--secondary); }
.flashcard-back .de-article { font-size:13px; color:var(--text-light); margin-bottom:2px; }
.flashcard-back .de-pronunciation { font-size:12px; color:var(--text-light); font-style:italic; margin-top:6px; }

.feedback { margin-top:10px; padding:8px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; text-align:center; animation:fadeIn 0.3s ease; width:100%; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.feedback.correct { background:var(--correct-bg); color:#065F46; }
.feedback.wrong { background:var(--wrong-bg); color:#991B1B; }

.grammar-tip { margin-top:8px; padding:10px 12px; border-radius:8px; background:linear-gradient(135deg,#EEF2FF,#F5F3FF); border:1px solid #C7D2FE; text-align:left; animation:fadeIn 0.4s ease; }
.grammar-tip .gt-header { font-size:11px; font-weight:800; color:#4338CA; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.grammar-tip .gt-body { font-size:12px; font-weight:500; color:#3730A3; line-height:1.5; }
.grammar-tip .gt-example { font-style:italic; color:#6366F1; }
.grammar-tip .gt-rule { font-weight:700; color:#4338CA; }

/* LESSON EXERCISE TYPES */
.tf-btns { display:flex; gap:10px; justify-content:center; width:100%; }
.tf-btn { flex:1; padding:16px; border-radius:var(--radius-sm); border:2px solid #E5E7EB; background:white; font-size:16px; font-weight:700; cursor:pointer; transition:all 0.2s; text-align:center; }
.tf-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.tf-btn.correct { border-color:var(--correct); background:var(--correct-bg); }
.tf-btn.wrong { border-color:var(--wrong); background:var(--wrong-bg); }
.tf-sentence { font-size:16px; font-weight:600; text-align:center; padding:14px; background:#F8FAFC; border-radius:var(--radius-sm); border:1px solid #E5E7EB; margin-bottom:14px; }
.match-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.match-item { padding:10px; border-radius:8px; border:2px solid #E5E7EB; background:white; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s; text-align:center; user-select:none; }
.match-item:hover { border-color:var(--primary); background:var(--primary-light); }
.match-item.selected { border-color:var(--primary); background:var(--primary-light); transform:scale(1.03); }
.match-item.matched { border-color:var(--correct); background:var(--correct-bg); opacity:0.7; pointer-events:none; }
.match-item.wrong-flash { border-color:var(--wrong); background:var(--wrong-bg); animation:shake 0.4s ease; }

/* LISTENING & WRITING */
.listen-play-btn { width:80px; height:80px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--purple),#6366F1); color:white; font-size:36px; cursor:pointer; box-shadow:0 6px 24px rgba(139,92,246,0.35); transition:all 0.2s; margin:12px 0; }
.listen-play-btn:hover { transform:scale(1.08); }
.listen-hint { font-size:12px; color:var(--text-light); text-align:center; margin-bottom:12px; }
.writing-area { width:100%; min-height:120px; padding:12px; border:2px solid #E5E7EB; border-radius:var(--radius-sm); font-size:14px; font-family:inherit; resize:vertical; outline:none; transition:border-color 0.2s; }
.writing-area:focus { border-color:var(--primary); }
.writing-hints { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.writing-hint { padding:4px 10px; border-radius:12px; background:var(--accent-light); font-size:11px; font-weight:600; color:var(--accent); }
.keyword-result { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; margin:2px; }
.keyword-result.found { background:var(--correct-bg); color:#065F46; }
.keyword-result.missing { background:var(--wrong-bg); color:#991B1B; }
.exam-timer { position:fixed; top:12px; right:12px; padding:8px 16px; border-radius:20px; background:rgba(0,0,0,0.85); color:white; font-size:14px; font-weight:800; z-index:100; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.exam-timer.warning { background:var(--wrong); animation:pulse 0.5s ease infinite; }
.exam-section-badge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; margin-bottom:8px; }
.form-field { margin-bottom:10px; }
.form-field label { display:block; font-size:12px; font-weight:700; color:var(--text-light); margin-bottom:3px; }
.form-field input { width:100%; padding:8px 10px; border:2px solid #E5E7EB; border-radius:8px; font-size:14px; outline:none; }
.form-field input:focus { border-color:var(--primary); }

/* LESSON NOTES */
.notes-toggle { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px dashed #CBD5E1; border-radius:8px; background:transparent; cursor:pointer; font-size:12px; font-weight:600; color:var(--text-light); margin-top:12px; width:100%; transition:all 0.2s; }
.notes-toggle:hover { border-color:var(--primary); color:var(--primary); }
.notes-toggle.has-notes { border-color:var(--accent); background:var(--accent-light); color:var(--accent); border-style:solid; }
.notes-toolbar { display:flex; gap:2px; padding:4px; background:#F1F5F9; border:1px solid #E5E7EB; border-bottom:none; border-radius:8px 8px 0 0; margin-top:6px; flex-wrap:wrap; }
.notes-toolbar button { width:30px; height:28px; border:none; background:transparent; border-radius:4px; cursor:pointer; font-size:13px; font-weight:700; color:var(--text); transition:all 0.15s; }
.notes-toolbar button:hover { background:#E2E8F0; }
.notes-toolbar button.active { background:#CBD5E1; }
.notes-editor { width:100%; min-height:80px; padding:10px; border:1px solid #E5E7EB; border-radius:0 0 8px 8px; font-size:13px; font-family:inherit; outline:none; background:#FFFEF5; line-height:1.6; overflow-y:auto; max-height:200px; }
.notes-editor:focus { border-color:var(--accent); }
.notes-editor:empty::before { content:attr(data-placeholder); color:#94A3B8; font-style:italic; }
.notes-saved { font-size:10px; color:var(--correct); font-weight:600; margin-top:3px; animation:fadeIn 0.3s; }
.notes-summary { background:white; border-radius:10px; padding:14px; border:1px solid #E5E7EB; margin-bottom:10px; }
.notes-summary .ns-title { font-size:13px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.notes-summary .ns-text { font-size:12px; color:var(--text); line-height:1.5; }

/* PLURAL WORD CARDS */
.plural-cards { display:grid; grid-template-columns:1fr; gap:8px; margin:10px 0; }
.plural-card { background:white; border-radius:10px; padding:12px; border:2px solid #E5E7EB; text-align:left; }
.plural-card .pc-header { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.plural-card .pc-article { font-size:10px; font-weight:700; text-transform:uppercase; padding:2px 6px; border-radius:4px; }
.plural-card .pc-article.der { color:#1E40AF; background:#DBEAFE; }
.plural-card .pc-article.die { color:#9D174D; background:#FCE7F3; }
.plural-card .pc-article.das { color:#92400E; background:#FEF3C7; }
.plural-card .pc-word { font-size:17px; font-weight:800; }
.plural-card .pc-plural { font-size:13px; color:var(--text-light); font-style:italic; }
.plural-card .pc-example { font-size:12px; color:var(--text); margin-top:6px; padding:6px 8px; background:#F8FAFC; border-radius:6px; border-left:3px solid var(--accent); }
.plural-card .pc-example .pc-es { color:var(--text-light); font-size:11px; }
.plural-card .pc-rule { display:inline-block; padding:1px 6px; border-radius:4px; font-size:9px; font-weight:700; background:var(--accent-light); color:var(--accent); }
.plural-card .pc-audio { float:right; }

/* FLOATING DICTIONARY */
.dict-fab { position:fixed; bottom:24px; right:16px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#4338CA,#6366F1); color:white; border:none; font-size:26px; cursor:pointer; box-shadow:0 4px 20px rgba(67,56,202,0.4); z-index:999; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.dict-fab:hover { transform:scale(1.1); }

/* MEMORY GAME */
.memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0; }
.memory-card { aspect-ratio:1; border-radius:10px; cursor:pointer; perspective:600px; }
.memory-card-inner { position:relative; width:100%; height:100%; transition:transform 0.4s; transform-style:preserve-3d; }
.memory-card.flipped .memory-card-inner { transform:rotateY(180deg); }
.memory-card.matched .memory-card-inner { transform:rotateY(180deg); }
.memory-card.matched { opacity:0.7; pointer-events:none; }
.memory-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; border:2px solid #E5E7EB; }
.memory-front { background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; font-size:24px; }
.memory-back { background:white; transform:rotateY(180deg); text-align:center; }
.memory-back .mb-emoji { font-size:22px; }
.memory-back .mb-text { font-size:10px; font-weight:700; line-height:1.2; margin-top:2px; }
.memory-card.matched .memory-face.memory-back { border-color:var(--correct); background:var(--correct-bg); }

<script>
// AUDIO: Web Speech API
function getDeVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'de-DE' && v.localService) ||
         voices.find(v => v.lang === 'de-DE') ||
         voices.find(v => v.lang.startsWith('de')) || null;
}

function speak(text, rate=0.85) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = rate;
  u.pitch = 1;
  const v = getDeVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
  return u;
}

function speakSequence(lines, rate, onDone) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  let idx = 0;
  function speakNext() {
    if (idx >= lines.length) { if (onDone) onDone(); return; }
    const text = lines[idx];
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = rate || 0.85;
    u.pitch = 1;
    const v = getDeVoice();
    if (v) u.voice = v;
    u.onend = () => { idx++; setTimeout(speakNext, 400); };
    u.onerror = () => { idx++; setTimeout(speakNext, 400); };
    window.speechSynthesis.speak(u);
  }
  speakNext();
}

function speakBtn(text, btnEl) {
  if (btnEl) btnEl.classList.add('speaking');
  const u = speak(text);
  if (u) u.onend = () => { if (btnEl) btnEl.classList.remove('speaking'); };
  setTimeout(() => { if (btnEl) btnEl.classList.remove('speaking'); }, 3000);
}
window.speechSynthesis && window.speechSynthesis.getVoices();
window.speechSynthesis && window.speechSynthesis.addEventListener && window.speechSynthesis.addEventListener('voiceschanged', () => {});

// LEVEL SYSTEM
const AVAILABLE_LEVELS = [
  {id:'A1', name:'A1', desc:'Principiante', available:true},
  {id:'A2', name:'A2', desc:'Elemental', available:true},
  {id:'B1', name:'B1', desc:'Intermedio', available:false},
  {id:'B2', name:'B2', desc:'Intermedio alto', available:false},
  {id:'C1', name:'C1', desc:'Avanzado', available:false},
];
function getActiveLevel() { return data.level || 'A1'; }
function setActiveLevel(lv) {
  const lvl = AVAILABLE_LEVELS.find(l => l.id === lv);
  if (!lvl || !lvl.available) return;
  data.level = lv;
  saveData();
  document.getElementById('appTitle').textContent = '🇩🇪 Deutsch ' + lv;
  state.cat = Object.keys(getActiveVocab())[0];
  lessonState.currentLesson = null;
  readingState.current = null;
  renderLevelSelectBar();
  renderCategories();
  renderModes();
  resetGame();
  const activeTab = document.querySelector('.tab-btn.active');
  if (activeTab) {
    const tabNames = ['lessons','reading','words','play','progress'];
    const idx = Array.from(document.querySelectorAll('.tab-btn')).indexOf(activeTab);
    if (idx >= 0) switchTab(tabNames[idx]);
  }
}

function renderLevelSelectBar() {
  const el = document.getElementById('levelSelectBar');
  if (!el) return;
  const active = getActiveLevel();
  el.innerHTML = AVAILABLE_LEVELS.map(l => {
    if (!l.available) return `<div class="lvl-chip locked">${l.name}<span class="lock-icon">🔒</span></div>`;
    return `<button class="lvl-chip ${l.id===active?'active':''}" onclick="setActiveLevel('${l.id}')">${l.name}</button>`;
  }).join('');
}

// VOCAB BY LEVEL - loaded from external files
const VOCAB_BY_LEVEL = { A1: VOCAB_A1, A2: VOCAB_A2, B1: {}, B2: {}, C1: {} };
function getActiveVocab() { return VOCAB_BY_LEVEL[getActiveLevel()] || VOCAB_A1; }

// SRS
function getSRS(wordKey) {
  const s = data.srs && data.srs[wordKey];
  if (!s) return { interval: 0, ease: 2.5, reps: 0, nextReview: 0 };
  return s;
}
function updateSRS(wordKey, correct) {
  if (!data.srs) data.srs = {};
  let s = data.srs[wordKey] || { interval: 0, ease: 2.5, reps: 0, nextReview: 0 };
  if (correct) {
    s.reps++;
    if (s.reps === 1) s.interval = 1;
    else if (s.reps === 2) s.interval = 3;
    else s.interval = Math.round(s.interval * s.ease);
    s.ease = Math.max(1.3, s.ease + 0.1);
  } else {
    s.reps = 0; s.interval = 0;
    s.ease = Math.max(1.3, s.ease - 0.2);
  }
  s.nextReview = Date.now() + s.interval * 24 * 60 * 60 * 1000;
  data.srs[wordKey] = s;
  saveData();
}
function isDue(wordKey) { const s = getSRS(wordKey); return s.nextReview <= Date.now(); }

// Anki-style SRS with 4 quality levels (again/hard/good/easy)
function updateSRSAnki(wordKey, quality) {
  if (!data.srs) data.srs = {};
  let s = data.srs[wordKey] || { interval: 0, ease: 2.5, reps: 0, nextReview: 0 };
  const MIN = 60 * 1000, DAY = 24 * 60 * 60 * 1000;
  if (quality === 'again') {
    s.reps = 0; s.interval = 0;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.nextReview = Date.now() + 1 * MIN;
  } else if (quality === 'hard') {
    s.reps++;
    s.interval = s.interval < 1 ? 0.5 : s.interval * 1.2;
    s.ease = Math.max(1.3, s.ease - 0.15);
    s.nextReview = Date.now() + s.interval * DAY;
  } else if (quality === 'good') {
    s.reps++;
    if (s.reps === 1) s.interval = 1;
    else if (s.reps === 2) s.interval = 3;
    else s.interval = Math.round(s.interval * s.ease);
    s.nextReview = Date.now() + s.interval * DAY;
  } else if (quality === 'easy') {
    s.reps++;
    if (s.reps === 1) s.interval = 4;
    else s.interval = Math.round(s.interval * s.ease * 1.3);
    s.ease = s.ease + 0.15;
    s.nextReview = Date.now() + s.interval * DAY;
  }
  data.srs[wordKey] = s;
  saveData();
}

function getNextReviewLabel(wordKey, quality) {
  const MIN = 60 * 1000, DAY = 24 * 60 * 60 * 1000;
  let s = (data.srs && data.srs[wordKey]) || { interval: 0, ease: 2.5, reps: 0 };
  let interval;
  if (quality === 'again') return '1 min';
  if (quality === 'hard') interval = s.interval < 1 ? 0.5 : s.interval * 1.2;
  else if (quality === 'good') { if (s.reps === 0) interval = 1; else if (s.reps === 1) interval = 3; else interval = Math.round(s.interval * s.ease); }
  else { if (s.reps === 0) interval = 4; else interval = Math.round(s.interval * s.ease * 1.3); }
  if (interval < 1) return Math.round(interval * 24) + ' h';
  if (interval < 30) return Math.round(interval) + ' d';
  return Math.round(interval / 30) + ' mes';
}
function getSRSLabel(wordKey) {
  const s = getSRS(wordKey);
  if (s.reps === 0) return { label: t('new'), color: 'var(--text-light)' };
  if (s.interval <= 1) return { label: t('learning'), color: 'var(--accent)' };
  if (s.interval <= 7) return { label: t('known'), color: 'var(--correct)' };
  return { label: t('mastered'), color: 'var(--gold)' };
}

const MODES=[
{id:"quiz",name:"Quiz",icon:"🎯"},
{id:"write",name:"Escribir",icon:"✍️"},
{id:"conjugation",name:"Conjugar",icon:"🔀"},
{id:"plurals",name:"Plurales",icon:"👥"},
{id:"cases",name:"Casos",icon:"⚖️"},
{id:"dictation",name:"Dictado",icon:"👂"},
{id:"articles",name:"Artículos",icon:"📝"},
{id:"sentences",name:"Oraciones",icon:"🧩"},
{id:"flash",name:"Tarjetas",icon:"🃏"},
{id:"review",name:"Repaso",icon:"🔄"},
];

const LEVELS=[0,50,120,220,350,520,740,1020,1380,1840,2420,3140,4020,5100,6400];
function getLevel(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i])return i+1;return 1;}
function getLevelXP(xp){const lv=getLevel(xp);const cur=LEVELS[lv-1]||0;const nxt=LEVELS[lv]||LEVELS[LEVELS.length-1]+1000;return{level:lv,current:xp-cur,needed:nxt-cur};}

// PERSISTENCE
function loadData(){try{return JSON.parse(localStorage.getItem('deutschA1'))||defaultData();}catch(e){return defaultData();}}
function saveData(){try{localStorage.setItem('deutschA1',JSON.stringify(data));}catch(e){}}
function defaultData(){return{xp:0,totalSessions:0,totalCorrect:0,totalAnswered:0,bestStreak:0,wordStats:{},sessions:[],activeDays:[]};}
let data=loadData();

function getWordKey(w){return w.de;}
function getWordStat(w){return data.wordStats[getWordKey(w)]||{correct:0,wrong:0,lastSeen:0};}
function updateWordStat(w,correct){
  const k=getWordKey(w);
  if(!data.wordStats[k])data.wordStats[k]={correct:0,wrong:0,lastSeen:0};
  if(correct)data.wordStats[k].correct++;else data.wordStats[k].wrong++;
  data.wordStats[k].lastSeen=Date.now();
  saveData();
}
function getMastery(stat){
  const t=stat.correct+stat.wrong;
  if(t===0)return'new';
  const r=stat.correct/t;
  if(stat.correct>=5&&r>=0.85)return'mastered';
  if(stat.correct>=2&&r>=0.6)return'known';
  return'learning';
}
function getMasteryLabel(m){return{new:'Nueva',learning:'Aprendiendo',known:'Conocida',mastered:'Dominada'}[m];}
function getMasteryColor(m){return{new:'var(--text-light)',learning:'var(--accent)',known:'var(--correct)',mastered:'var(--gold)'}[m];}

function recordDay(){
  const today=new Date().toISOString().slice(0,10);
  if(!data.activeDays.includes(today)){data.activeDays.push(today);saveData();}
}
function getDailyStreak(){
  const days=[...data.activeDays].sort().reverse();
  if(days.length===0)return 0;
  let streak=0;
  const d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const ds=new Date(d);ds.setDate(ds.getDate()-i);
    const s=ds.toISOString().slice(0,10);
    if(days.includes(s))streak++;
    else if(i>0)break;
  }
  return streak;
}

function getReviewWords(){
  const all=[];
  const v=getActiveVocab();
  Object.keys(v).forEach(cat=>{
    (v[cat]||[]).forEach(w=>{
      const s=getWordStat(w);
      const srs=getSRS(getWordKey(w));
      const due=isDue(getWordKey(w));
      if(s.wrong>0||due||(s.correct>0&&s.correct<5))all.push({...w,_cat:cat,_stat:s,_due:due,_priority:due?100+s.wrong:s.wrong-s.correct});
    });
  });
  all.sort((a,b)=>b._priority-a._priority);
  return all;
}

let state={cat:Object.keys(getActiveVocab())[0],selectedCats:[Object.keys(getActiveVocab())[0]],mode:"quiz",current:0,score:0,streak:0,total:0,correct:0,mistakes:[],words:[],round:10,answered:false,started:false};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function escapeStr(s){return s.replace(/'/g,"\\'").replace(/"/g,'\\"');}
function normalize(s){return s.trim().toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9\s]/g,"");}

function getGrammarTip(w, mode, userAnswer) {
  const de = w.de || '';
  const noun = de.replace(/^(der|die|das)\s+/i, '');

  if (mode === 'articles' && w.article) {
    const art = w.article;
    const tips = [];
    if (art === 'der') {
      if (/ling$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-ling</span> son masculinos → <span class="gt-example">der Frühling, der Schmetterling</span>');
      else if (/er$/.test(noun) && noun.length > 3) tips.push('Muchos sustantivos terminados en <span class="gt-rule">-er</span> (personas/instrumentos) son masculinos → <span class="gt-example">der Lehrer, der Computer</span>');
      else if (/ig$|ich$/.test(noun)) tips.push('Sustantivos terminados en <span class="gt-rule">-ig/-ich</span> suelen ser masculinos');
      else tips.push('Los días, meses, estaciones y puntos cardinales siempre llevan <span class="gt-rule">der</span> → <span class="gt-example">der Montag, der Januar, der Sommer</span>');
    } else if (art === 'die') {
      if (/ung$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-ung</span> son siempre femeninos → <span class="gt-example">die Wohnung, die Zeitung</span>');
      else if (/heit$|keit$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-heit/-keit</span> son siempre femeninos → <span class="gt-example">die Freiheit, die Möglichkeit</span>');
      else if (/schaft$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-schaft</span> son siempre femeninos → <span class="gt-example">die Freundschaft, die Gesellschaft</span>');
      else if (/tion$|sion$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-tion/-sion</span> son siempre femeninos → <span class="gt-example">die Station, die Diskussion</span>');
      else if (/ie$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-ie</span> suelen ser femeninos → <span class="gt-example">die Energie, die Melodie</span>');
      else if (/e$/.test(noun) && noun.length > 3) tips.push('Muchos sustantivos terminados en <span class="gt-rule">-e</span> son femeninos → <span class="gt-example">die Lampe, die Straße</span> (pero hay excepciones: der Name, der Käse)');
      else tips.push('Muchas flores, árboles y números son femeninos → <span class="gt-example">die Rose, die Eiche, die Eins</span>');
    } else if (art === 'das') {
      if (/chen$|lein$/.test(noun)) tips.push('Los diminutivos con <span class="gt-rule">-chen/-lein</span> son siempre neutros → <span class="gt-example">das Mädchen, das Brötchen</span>');
      else if (/ment$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-ment</span> suelen ser neutros → <span class="gt-example">das Dokument, das Instrument</span>');
      else if (/um$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-um</span> suelen ser neutros → <span class="gt-example">das Museum, das Studium</span>');
      else if (/nis$/.test(noun)) tips.push('Los sustantivos terminados en <span class="gt-rule">-nis</span> suelen ser neutros → <span class="gt-example">das Ergebnis, das Geheimnis</span>');
      else tips.push('Los verbos nominalizados (infinitivos como sustantivos) son neutros → <span class="gt-example">das Essen, das Lernen, das Leben</span>');
    }
    if (tips.length > 0) return `<div class="grammar-tip"><div class="gt-header">💡 Regla de género</div><div class="gt-body">${tips[0]}</div></div>`;
  }

  if (mode === 'write' || mode === 'dictation') {
    const tips = [];
    const ua = userAnswer || '';
    if (de.includes('sch') && !ua.includes('sch')) tips.push('En alemán, <span class="gt-rule">sch</span> = sonido "sh" → se escriben las tres letras juntas');
    else if (/[äöü]/.test(de) && !/[äöü]/.test(ua)) tips.push('Cuidado con las <span class="gt-rule">Umlauts</span> (ä, ö, ü) — cambian el significado. <span class="gt-example">schon</span> (ya) ≠ <span class="gt-example">schön</span> (bonito)');
    else if (de.includes('ß') && !ua.includes('ß')) tips.push('La <span class="gt-rule">ß</span> (Eszett) se usa después de vocal larga o diptongo. <span class="gt-example">Straße, groß, heißen</span>');
    else if (de.includes('ie') && ua.includes('ei')) tips.push('<span class="gt-rule">ie</span> = sonido "i" larga, <span class="gt-rule">ei</span> = sonido "ai". <span class="gt-example">die Liebe</span> (amor) ≠ <span class="gt-example">der Leib</span> (cuerpo)');
    else if (de.includes('ei') && ua.includes('ie')) tips.push('<span class="gt-rule">ei</span> = sonido "ai", <span class="gt-rule">ie</span> = sonido "i" larga. <span class="gt-example">das Ei</span> (huevo), <span class="gt-example">die Biene</span> (abeja)');
    else if (/^[A-Z]/.test(noun)) tips.push('En alemán, todos los <span class="gt-rule">sustantivos se escriben con mayúscula</span> → <span class="gt-example">${de}</span>');
    else if (de.includes('ch')) tips.push('El sonido <span class="gt-rule">ch</span>: después de a/o/u suena gutural ("aj"), después de e/i/ä/ö/ü suena suave ("ish")');
    else if (de.includes('z')) tips.push('La <span class="gt-rule">z</span> en alemán se pronuncia "ts" → <span class="gt-example">Zug</span> = "tsug", <span class="gt-example">Zimmer</span> = "tsimmer"');
    else if (de.includes('v')) tips.push('La <span class="gt-rule">v</span> en alemán suena como "f" en palabras alemanas (<span class="gt-example">Vater</span>) y como "v" en extranjerismos (<span class="gt-example">Verb</span>)');
    else if (de.includes('w')) tips.push('La <span class="gt-rule">w</span> en alemán suena como nuestra "v" → <span class="gt-example">Wasser</span> = "vasser"');
    else tips.push('Consejo: repite la palabra en voz alta varias veces. La memoria muscular ayuda a recordar la ortografía');
    if (tips.length > 0) return `<div class="grammar-tip"><div class="gt-header">💡 Tip de ortografía</div><div class="gt-body">${tips[0]}</div></div>`;
  }

  if (mode === 'sentences' && w.hint) {
    const grammarTips = {
      'presentarse': 'En alemán el verbo va siempre en <span class="gt-rule">posición 2</span>: Ich <u>heiße</u> Anna',
      'saludo': 'Pregunta informal: <span class="gt-rule">Wie geht es dir?</span> — Formal: <span class="gt-rule">Wie geht es Ihnen?</span>',
      'origen': 'Para decir de dónde vienes: <span class="gt-rule">Ich komme aus + país</span> (sin artículo para la mayoría)',
      'vivienda': 'Vivir en un lugar: <span class="gt-rule">Ich wohne in + ciudad</span> — El verbo en posición 2',
      'idiomas': 'Los idiomas no llevan artículo: <span class="gt-rule">Ich spreche Deutsch/Englisch/Spanisch</span>',
      'familia': 'Los posesivos: <span class="gt-rule">mein</span> (mi, masc/neutro), <span class="gt-rule">meine</span> (mi, fem/plural)',
      'comida': 'Acusativo: <span class="gt-rule">einen Kaffee</span> (masc), <span class="gt-rule">eine Suppe</span> (fem), <span class="gt-rule">ein Brot</span> (neutro)',
      'pedir': '<span class="gt-rule">Ich möchte</span> + sustantivo = "Quisiera..." — forma cortés para pedir',
      'hora': 'La hora: <span class="gt-rule">um + hora + Uhr</span> → um acht Uhr = a las ocho',
      'rutina': '<span class="gt-rule">jeden Tag</span> = todos los días (acusativo). El verbo siempre en posición 2',
      'hobbys': '<span class="gt-rule">gern</span> después del verbo = "con gusto/le gusta" → Ich spiele <u>gern</u> Fußball',
      'clima': 'El clima: <span class="gt-rule">Es regnet</span> (llueve), <span class="gt-rule">Es schneit</span> (nieva) — siempre con "es"',
      'transporte': '<span class="gt-rule">mit dem Bus/Zug/Auto</span> — "mit" siempre lleva dativo',
      'pedir ayuda': '<span class="gt-rule">Kannst du...?</span> (informal) / <span class="gt-rule">Können Sie...?</span> (formal) + infinitivo al final',
      'orientación': 'Preguntar ubicación: <span class="gt-rule">Wo ist...?</span> — El verbo en posición 2',
      'supervivencia': '<span class="gt-rule">Ich verstehe das nicht</span> — "nicht" al final niega el verbo',
      'compras': '<span class="gt-rule">Wie viel kostet...?</span> (singular) / <span class="gt-rule">Wie viel kosten...?</span> (plural)',
      'animales': 'El dativo locativo: auf <span class="gt-rule">dem</span> Sofa (¿dónde? = dativo), auf <span class="gt-rule">das</span> Sofa (¿adónde? = acusativo)',
      'obligación': '<span class="gt-rule">müssen</span> = tener que/deber. El verbo principal va al final en infinitivo',
      'planes': '<span class="gt-rule">morgen</span> = mañana. El verbo sigue en posición 2: Wir <u>gehen</u> morgen ins Kino',
      'Perfekt': 'Perfekt = <span class="gt-rule">haben/sein + Partizip II</span> al final. Verbos de movimiento usan "sein": ich <u>bin</u> gefahren',
      'Perfekt con sein': 'Verbos de movimiento/cambio usan <span class="gt-rule">sein</span>: gehen→bin gegangen, fahren→bin gefahren, fliegen→bin geflogen',
      'Konjunktiv II': '<span class="gt-rule">würde + infinitivo</span> = condicional. Ich würde gern... = Me gustaría...',
      'Konjunktiv II formal': '<span class="gt-rule">Könnten Sie...?</span> es la forma más cortés de pedir algo en alemán',
      'Modalverben': 'Modal + infinitivo: el modal conjugado en pos. 2, el infinitivo al <span class="gt-rule">final</span>. Man <u>darf</u> hier nicht <u>rauchen</u>',
      'reflexive Verben': 'Verbos reflexivos: <span class="gt-rule">sich freuen auf</span> (alegrarse por futuro), <span class="gt-rule">sich freuen über</span> (alegrarse por presente)',
      'Relativsätze': 'Oración relativa: <span class="gt-rule">der/die/das</span> + verbo al final. Das Buch, <u>das</u> ich <u>lese</u>, ist spannend',
      'Nebensätze': 'Con <span class="gt-rule">weil/dass/wenn/obwohl</span>: el verbo conjugado va al <u>final</u> de la oración subordinada',
      'dass-Satz': 'Después de <span class="gt-rule">dass</span>, el verbo conjugado va al final: Er sagt, dass er morgen <u>kommt</u>',
      'Gesundheit': 'En el médico: <span class="gt-rule">Ich habe + dolor</span>. Kopfschmerzen (cabeza), Bauchschmerzen (estómago)',
      'Arbeit': '<span class="gt-rule">sich bewerben für/um</span> = postularse a. Verbo separable en Perfekt: hat sich <u>beworben</u>',
      'Wohnung': 'Vivienda: <span class="gt-rule">die Wohnung</span> (piso), <span class="gt-rule">das Zimmer</span> (habitación), <span class="gt-rule">die Miete</span> (alquiler)',
      'seit + Dativ': '<span class="gt-rule">seit + dativo</span> = desde hace. Importante: en alemán se usa presente, no pasado: Ich <u>bin</u> seit 5 Jahren hier',
      'Plusquamperfekt': '<span class="gt-rule">hatte/war + Partizip II</span> = pluscuamperfecto. Nachdem ich gegessen <u>hatte</u>, ging ich schlafen',
    };
    const tip = grammarTips[w.hint];
    if (tip) return `<div class="grammar-tip"><div class="gt-header">💡 Gramática: ${w.hint}</div><div class="gt-body">${tip}</div></div>`;
  }

  if (mode === 'quiz') {
    if (w.article) return `<div class="grammar-tip"><div class="gt-header">💡 Recuerda</div><div class="gt-body">El artículo es <span class="gt-rule">${w.article}</span> → <span class="gt-example">${w.de}</span>. Intenta memorizar cada sustantivo con su artículo.</div></div>`;
    return '';
  }
  return '';
}

function renderLevelBar(){
  const info=getLevelXP(data.xp);
  const ds=getDailyStreak();
  const pct=Math.min(100,Math.round(info.current/info.needed*100));
  const name=data.userName||'';
  document.getElementById('levelBar').innerHTML=`
    <div class="level-badge">${info.level}</div>
    <div class="level-info">
      <div class="level-text">${name?name+' · ':''}${t('level')} ${info.level}</div>
      <div class="xp-text">${data.xp} XP · ${info.current}/${info.needed}</div>
      <div class="xp-bar"><div class="xp-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="daily-streak-badge">
      <div class="ds-num">${ds>0?'🔥':''} ${ds}</div>
      <div class="ds-label">${t('days')}</div>
    </div>`;
}

function switchTab(id){
  const order=['home','reading','play','exam','progress'];
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',order[i]===id);});
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  const lb=document.getElementById('levelBar');
  if(lb)lb.style.display=id==='home'?'none':'';
  if(id==='home')renderHomeTab();
  if(id==='reading')renderReadingTab();
  if(id==='exam')renderExamTab();
  if(id==='progress')renderProgressTab();
  if(id==='play'){renderCategories();renderModes();resetGame();}
}

function renderCategories(){
  const el=document.getElementById("categories");
  if(!el)return;
  const v=getActiveVocab();
  const keys=Object.keys(v);
  if(!state.selectedCats||state.selectedCats.length===0)state.selectedCats=[...keys];
  const allSelected=state.selectedCats.length===keys.length;
  el.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:8px;width:100%"><button class="cat-btn" style="font-size:11px;background:${allSelected?"var(--secondary-light)":"var(--card)"};border-color:${allSelected?"var(--secondary)":"transparent"}" onclick="toggleAllCats()">${allSelected?"\u2713 Todas":"Todas"}</button><button class="cat-btn" style="font-size:11px" onclick="clearAllCats()">Ninguna</button></div>`+keys.map(c=>{
    const words=v[c];
    if(!words)return"";
    const selected=state.selectedCats.includes(c);
    return`<button class="cat-btn ${selected?"active":""}" onclick="toggleCat('${c}')" style="position:relative">${selected?"\u2713 ":""}${c}</button>`;
  }).join("");
  if(keys.length>8){
    const toggle=document.getElementById("catToggleWrap");
    if(toggle)toggle.innerHTML=`<button class="cat-toggle" id="catToggle" onclick="toggleCategories()">\u25BC Mas categorias (${keys.length})</button>`;
  }
}

function toggleCat(c){
  if(!state.selectedCats)state.selectedCats=[];
  const idx=state.selectedCats.indexOf(c);
  if(idx>=0)state.selectedCats.splice(idx,1);
  else state.selectedCats.push(c);
  if(state.selectedCats.length===0){const v=getActiveVocab();state.selectedCats=[Object.keys(v)[0]];}
  renderCategories();resetGame();
}
function toggleAllCats(){
  const v=getActiveVocab();
  state.selectedCats=[...Object.keys(v)];
  renderCategories();resetGame();
}
function clearAllCats(){
  const v=getActiveVocab();
  state.selectedCats=[Object.keys(v)[0]];
  renderCategories();resetGame();
}

function selectCat(c){state.selectedCats=[c];renderCategories();resetGame();}

function renderModes(){
  const el=document.getElementById("modes");
  if(!el)return;
  const reviewCount=getReviewWords().length;
  el.innerHTML=MODES.map(m=>{
    let extra='';
    if(m.id==='review'&&reviewCount>0)extra=`<span class="review-badge">${reviewCount}</span>`;
    return`<button class="mode-btn ${m.id===state.mode?'active':''}" onclick="selectMode('${m.id}')">
      <div class="icon">${m.icon}</div>
      <div class="name">${m.name}${extra}</div>
    </button>`;
  }).join("");
}

function selectMode(m){state.mode=m;renderModes();resetGame();setTimeout(()=>{const ga=document.getElementById('gameArea');if(ga)ga.scrollIntoView({behavior:'smooth',block:'center'});},100);}

function resetGame(){
  state.current=0;state.score=0;state.streak=0;state.total=0;state.correct=0;state.mistakes=[];state.answered=false;state.started=false;
  const v=getActiveVocab();
  if(!state.selectedCats||state.selectedCats.length===0)state.selectedCats=[...Object.keys(v)];
  const catWords=state.selectedCats.flatMap(c=>v[c]||[]);
  if(state.mode==='review'){
    state.words=getReviewWords().slice(0,10);
  } else if(state.mode==='articles'){
    state.words=shuffle(catWords.filter(w=>w.article)).slice(0,state.round);
  } else if(state.mode==='sentences'){
    state.words=shuffle(getActiveSentences()).slice(0,state.round);
  } else if(state.mode==='conjugation'){
    const verbs=shuffle(getActiveVerbs()).slice(0,state.round);
    state.words=verbs.map(v=>({de:v.inf,es:v.es,emoji:'🔀',_conjQ:makeConjQuestion(v)}));
  } else if(state.mode==='plurals'){
    state.words=shuffle(getActivePlurals()).slice(0,state.round);
  } else if(state.mode==='cases'){
    state.words=shuffle(getActiveCases()).slice(0,state.round);
  } else {
    state.words=shuffle(catWords).slice(0,state.round);
  }
  updateStats();updateProgress();showWelcome();
}

function updateStats(){
  document.getElementById("score").textContent=state.score;
  document.getElementById("streak").textContent=state.streak;
  document.getElementById("accuracy").textContent=(state.total>0?Math.round(state.correct/state.total*100):0)+"%";
}
function updateProgress(){
  document.getElementById("progressFill").style.width=(state.words.length>0?(state.current/state.words.length)*100:0)+"%";
}

function showWelcome(){
  const area=document.getElementById("gameArea");
  const modeName=MODES.find(m=>m.id===state.mode).name;
  const name=data.userName?', '+data.userName:'';
  if(state.mode==='review'&&state.words.length===0){
    area.innerHTML=`<div class="welcome"><div class="big-emoji">🎉</div><h2>${t('noReviewWords')}</h2><p>${t('playOtherModes')}</p></div>`;
    return;
  }
  const isSentences = state.mode==='sentences';
  const isConj = state.mode==='conjugation';
  const isPlurals = state.mode==='plurals';
  const isCases = state.mode==='cases';
  const noCategory = state.mode==='review'||isSentences||isConj||isPlurals||isCases;
  const icon = state.mode==='review'?'🔄':isSentences?'🧩':isConj?'🔀':isPlurals?'👥':isCases?'⚖️':'🇩🇪';
  const catInfo = noCategory?'':(t('category')+': <strong>'+state.cat+'</strong><br>');
  const unitLabel = isSentences?'oraciones':isConj?'verbos':isPlurals?'sustantivos':isCases?'ejercicios':t('wordsPerRound');
  area.innerHTML=`<div class="welcome"><div class="big-emoji">${icon}</div>
    <h2>${state.mode==='review'?t('reviewMode'):t('letsLearn')+name+'!'}</h2>
    <p>${catInfo}${t('mode')}: <strong>${modeName}</strong><br>${state.words.length} ${unitLabel}</p>
    <button class="start-btn" onclick="startGame()">${t('startBtn')}</button></div>`;
}

function startGame(){
  state.started=true;
  recordDay();
  const v=getActiveVocab();
  if(!state.selectedCats||state.selectedCats.length===0)state.selectedCats=[...Object.keys(v)];
  const catWords=state.selectedCats.flatMap(c=>v[c]||[]);
  if(state.mode==='review'){}
  else if(state.mode==='articles')state.words=shuffle(catWords.filter(w=>w.article)).slice(0,state.round);
  else if(state.mode==='sentences')state.words=shuffle(getActiveSentences()).slice(0,state.round);
  else if(state.mode==='conjugation'){const verbs=shuffle(getActiveVerbs()).slice(0,state.round);state.words=verbs.map(v=>({de:v.inf,es:v.es,emoji:'🔀',_conjQ:makeConjQuestion(v)}));}
  else if(state.mode==='plurals')state.words=shuffle(getActivePlurals()).slice(0,state.round);
  else if(state.mode==='cases')state.words=shuffle(getActiveCases()).slice(0,state.round);
  else state.words=shuffle(catWords).slice(0,state.round);
  showQuestion();
  setTimeout(()=>{const ga=document.getElementById('gameArea');if(ga)ga.scrollIntoView({behavior:'smooth',block:'center'});},100);
}

function showQuestion(){
  if(state.current>=state.words.length){showResults();return;}
  state.answered=false;updateProgress();
  const w=state.words[state.current];
  const area=document.getElementById("gameArea");
  const effectiveMode=state.mode==='review'?'flash':state.mode;
  if(effectiveMode==="quiz")renderQuiz(area,w);
  else if(effectiveMode==="write")renderWrite(area,w);
  else if(effectiveMode==="flash")renderFlash(area,w);
  else if(effectiveMode==="dictation")renderDictation(area,w);
  else if(effectiveMode==="articles")renderArticles(area,w);
  else if(effectiveMode==="sentences")renderSentence(area,w);
  else if(effectiveMode==="conjugation")renderConjugation(area,w);
  else if(effectiveMode==="plurals")renderPlurals(area,w);
  else if(effectiveMode==="cases")renderCases(area,w);
}

function renderQuiz(area,w){
  const v=getActiveVocab();
  const pool=state.mode==='review'?Object.values(v).flat():(state.selectedCats||Object.keys(v)).flatMap(c=>v[c]||[]);
  let opts=[w];
  while(opts.length<4){const r=pool[Math.floor(Math.random()*pool.length)];if(!opts.find(o=>o.de===r.de))opts.push(r);}
  opts=shuffle(opts);
  const at=w.article?`<span class="genre-tag ${w.article}">${w.article}</span>`:'';
  const srs=getSRSLabel(getWordKey(w));
  area.innerHTML=`
    ${state.streak>=3?`<div class="streak-indicator ${state.streak>=5?'hot':''}">🔥 ${state.streak}</div>`:''}
    <div class="emoji-display">${w.emoji}</div>
    ${at}
    <div class="word-es">${w.es}</div>
    <div style="margin-bottom:6px;display:flex;align-items:center;gap:6px;justify-content:center">
      <span class="wl-mastery" style="background:${srs.color}22;color:${srs.color}">${srs.label}</span>
      <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)" title="Escuchar">🔊</button>
    </div>
    <div class="word-hint">¿Cómo se dice en alemán?</div>
    <div class="options">${opts.map(o=>`<button class="option-btn" onclick="checkQuiz(this,'${escapeStr(o.de)}','${escapeStr(w.de)}')">${o.de}</button>`).join("")}</div>
    <button class="skip-btn" onclick="skipQuiz('${escapeStr(w.de)}')">🤷 No la sé</button>
    <div id="feedback"></div>`;
}

function skipQuiz(correct){
  if(state.answered)return;state.answered=true;state.total++;
  document.querySelectorAll(".option-btn").forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add("correct");});
  const fb=document.getElementById("feedback");const w=state.words[state.current];
  state.streak=0;state.mistakes.push(w);
  updateWordStat(w,false);updateSRS(getWordKey(w),false);
  speak(w.de);logError('Vocabulario',w.es+' → '+w.de,false);
  fb.innerHTML=`<div class="feedback wrong">🤷 Sin problema. La respuesta es: <strong>${w.de}</strong> ${w.pron} <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)" style="vertical-align:middle">🔊</button></div>${getGrammarTip(w,'quiz')}`;
  updateStats();
  fb.innerHTML+=`<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

function checkQuiz(btn,selected,correct){
  if(state.answered)return;state.answered=true;state.total++;
  document.querySelectorAll(".option-btn").forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add("correct");});
  const fb=document.getElementById("feedback");const w=state.words[state.current];
  if(selected===correct){
    btn.classList.add("correct");state.correct++;state.streak++;
    const pts=10+(state.streak>1?state.streak*2:0);state.score+=pts;
    updateWordStat(w,true);updateSRS(getWordKey(w),true);
    speak(w.de);logError('Vocabulario',w.de,true);
    fb.innerHTML=`<div class="feedback correct">✅ ¡Correcto! +${pts} XP ${state.streak>2?'🔥 Racha de '+state.streak:''}<br><small>${w.de} ${w.pron}</small> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)" style="vertical-align:middle">🔊</button></div>`;
  } else {
    btn.classList.add("wrong");state.streak=0;state.mistakes.push(w);
    updateWordStat(w,false);updateSRS(getWordKey(w),false);
    speak(w.de);logError('Vocabulario',w.es+' → '+w.de,false);
    fb.innerHTML=`<div class="feedback wrong">❌ Incorrecto. La respuesta es: <strong>${w.de}</strong> ${w.pron} <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)" style="vertical-align:middle">🔊</button></div>${getGrammarTip(w,'quiz')}`;
  }
  updateStats();
  fb.innerHTML+=`<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

function renderWrite(area,w){
  const at=w.article?`<span class="genre-tag ${w.article}">${w.article}</span>`:'';
  const srs=getSRSLabel(getWordKey(w));
  area.innerHTML=`
    ${state.streak>=3?`<div class="streak-indicator ${state.streak>=5?'hot':''}">🔥 ${state.streak}</div>`:''}
    <div class="emoji-display">${w.emoji}</div>${at}
    <div class="word-es">${w.es}</div>
    <div style="margin-bottom:6px;display:flex;align-items:center;gap:6px;justify-content:center">
      <span class="wl-mastery" style="background:${srs.color}22;color:${srs.color}">${srs.label}</span>
      <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)" title="Escuchar pista">🔊</button>
    </div>
    <div class="word-hint">Escribe la palabra en alemán</div>
    <div class="input-area"><input class="text-input" id="writeInput" type="text" placeholder="Escribe aquí..." autocomplete="off" autofocus>
    <button class="check-btn" onclick="checkWrite()">Comprobar ✓</button></div><div id="feedback"></div>`;
  const inp=document.getElementById("writeInput");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkWrite();});
  setTimeout(()=>inp.focus(),100);
}

function checkWrite(){
  if(state.answered)return;
  const inp=document.getElementById("writeInput");const val=inp.value.trim();if(!val)return;
  state.answered=true;state.total++;const w=state.words[state.current];const fb=document.getElementById("feedback");
  const un=normalize(val);const cn=normalize(w.de);const cna=normalize(w.de.replace(/^(der|die|das)\s+/i,""));
  const ok=un===cn||un===cna||normalize(val.replace(/^(der|die|das)\s+/i,""))===cna;
  if(ok){
    inp.classList.add("correct");state.correct++;state.streak++;

  if (ok) {
    inp.classList.add("correct"); state.correct++; state.streak++;
    const pts = 20 + (state.streak > 1 ? state.streak * 3 : 0); state.score += pts;

function getActivePlurals() {

}

function renderPlurals(area, w) {

function getPluralTip(w) {
  const rule = w.rule;
  const tips = {
    '-e': 'Muchos sustantivos masculinos y algunos neutros forman el plural con <span class="gt-rule">-e</span>: <span class="gt-example">der Hund → die Hunde, der Tag → die Tage</span>',
    '-̈e': 'Algunos sustantivos añaden <span class="gt-rule">-e</span> y cambian la vocal con Umlaut: <span class="gt-example">der Stuhl → die St<u>ü</u>hle, die Stadt → die St<u>ä</u>dte</span>',
    '-n': 'Muchos femeninos terminados en <span class="gt-rule">-e</span> solo añaden <span class="gt-rule">-n</span>: <span class="gt-example">die Katze → die Katzen, die Lampe → die Lampen</span>',
    '-en': 'Los femeninos terminados en <span class="gt-rule">-ung, -heit, -keit, -tion</span> añaden <span class="gt-rule">-en</span>: <span class="gt-example">die Zeitung → die Zeitungen</span>',
    '-er': 'Muchos neutros forman el plural con <span class="gt-rule">-er</span>: <span class="gt-example">das Kind → die Kinder, das Ei → die Eier</span>',
    '-̈er': 'Algunos neutros y masculinos añaden <span class="gt-rule">-er</span> con Umlaut: <span class="gt-example">das Buch → die B<u>ü</u>cher, der Mann → die M<u>ä</u>nner</span>',
    '-s': 'Palabras extranjeras y algunas alemanas usan <span class="gt-rule">-s</span>: <span class="gt-example">das Auto → die Autos, das Foto → die Fotos</span>',
    '-': 'Algunos sustantivos (sobre todo con <span class="gt-rule">-er, -en, -el, -chen, -lein</span>) no cambian en plural: <span class="gt-example">das Mädchen → die Mädchen, der Lehrer → die Lehrer</span>',
    '-̈': 'Algunos sustantivos solo añaden Umlaut sin terminación extra: <span class="gt-example">die Mutter → die M<u>ü</u>tter, der Bruder → die Br<u>ü</u>der</span>',
    '-se': 'Sustantivos terminados en <span class="gt-rule">-nis</span> duplican la s: <span class="gt-example">das Ergebnis → die Ergebnisse</span>',
  };
  const tip = tips[rule] || 'En alemán el plural siempre lleva <span class="gt-rule">die</span>, sin importar el género original del sustantivo.';
  return `<div class="grammar-tip"><div class="gt-header">💡 Plural: ${rule}</div><div class="gt-body">${tip}</div></div>`;
}

function renderCases(area, w) {

    <div style="font-size:18px;font-weight:700;margin-bottom:4px;text-align:center;line-height:1.5">${parts[0]}<span style="display:inline-block;min-width:60px;border-bottom:3px solid ${caseColor};margin:0 4px;color:${caseColor}">?</span>${parts[1]||''}</div>

function skipCases() {
  if (state.answered) return;

  const correct = w.opts[w.correct];
  document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled = true; if (i === w.correct) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');
  const fullSentence = w.sentence.replace('___', correct);
  state.streak = 0; state.mistakes.push({de: fullSentence, es: w.es + ' (' + w.case + ')', emoji: '⚖️'});

  fb.innerHTML = `<div class="feedback wrong">🤷 Sin problema. Es: <strong>${correct}</strong> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(fullSentence)}',this)">🔊</button><br><small>${fullSentence}</small></div>${getCaseTip(w)}`;
  updateStats();
  fb.innerHTML += `<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

function getCaseTip(w) {
  const caseInfo = {
    Nominativ: {title:'Nominativ (sujeto)',body:'El <span class="gt-rule">Nominativ</span> es el caso del sujeto — quién hace la acción. Los artículos no cambian: <span class="gt-example">der, die, das, die (pl.)</span>'},
    Akkusativ: {title:'Akkusativ (objeto directo)',body:'El <span class="gt-rule">Akkusativ</span> marca el objeto directo. Solo cambia el masculino: <span class="gt-rule">der → den</span>, <span class="gt-rule">ein → einen</span>. Femenino y neutro no cambian.'},
    Dativ: {title:'Dativ (objeto indirecto)',body:'El <span class="gt-rule">Dativ</span> marca a quién/para quién. Cambios: <span class="gt-rule">der → dem</span>, <span class="gt-rule">die → der</span>, <span class="gt-rule">das → dem</span>, <span class="gt-rule">die(pl.) → den (+n)</span>'},
    Genitiv: {title:'Genitiv (posesión)',body:'El <span class="gt-rule">Genitiv</span> indica posesión. Cambios: <span class="gt-rule">der/das → des (+s)</span>, <span class="gt-rule">die → der</span>. Se usa con <span class="gt-example">trotz, während, wegen, statt</span>.'},
  };
  const info = caseInfo[w.case] || {title:'Caso',body:''};
  return `<div class="grammar-tip"><div class="gt-header">💡 ${info.title}</div><div class="gt-body">${w.tip}<br><br>${info.body}</div></div>`;
}

// CONJUGATION MODE
const PRONOUNS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

function getActiveVerbs() {
  const lvl = getActiveLevel();
  const a1 = typeof VERBS_A1 !== 'undefined' ? VERBS_A1 : [];
  const a2 = typeof VERBS_A2 !== 'undefined' ? VERBS_A2 : [];
  if (lvl === 'A2') return [...a1, ...a2];
  return a1;
}

function makeConjQuestion(verb) {
  const pronoun = PRONOUNS[Math.floor(Math.random() * PRONOUNS.length)];
  const correct = verb.conj[pronoun];
  return { verb, pronoun, correct, de: verb.inf, es: verb.es };
}

function renderConjugation(area, w) {
  const q = w._conjQ || makeConjQuestion(w);
  w._conjQ = q;
  const verb = q.verb;
  const allForms = Object.values(verb.conj);
  let opts = [q.correct];
  const otherVerbs = getActiveVerbs().filter(v => v.inf !== verb.inf);
  while (opts.length < 4) {
    const src = Math.random() < 0.5 && otherVerbs.length > 0
      ? otherVerbs[Math.floor(Math.random() * otherVerbs.length)].conj[q.pronoun]
      : allForms[Math.floor(Math.random() * allForms.length)];
    if (src && !opts.includes(src)) opts.push(src);
  }
  opts = shuffle(opts);
  const typeLabels = {regular:'Regular',irregular:'Irregular','stem-change':'Cambio de raíz',modal:'Modal',reflexive:'Reflexivo',separable:'Separable',inseparable:'Inseparable'};
  const typeLabel = typeLabels[verb.type] || verb.type;
  area.innerHTML = `
    ${state.streak >= 3 ? `<div class="streak-indicator ${state.streak >= 5 ? 'hot' : ''}">🔥 ${state.streak}</div>` : ''}
    <div style="font-size:36px;margin-bottom:6px">🔀</div>
    <div style="font-size:20px;font-weight:800;margin-bottom:2px">${verb.inf}</div>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:4px">${verb.es}</div>
    <div style="margin-bottom:10px"><span style="padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;background:#EEF2FF;color:#4338CA">${typeLabel}</span></div>
    <div style="font-size:22px;font-weight:800;color:var(--primary);margin-bottom:12px">${q.pronoun} _______</div>
    <div class="options">${opts.map(o => `<button class="option-btn" onclick="checkConjugation(this,'${escapeStr(o)}','${escapeStr(q.correct)}')">${o}</button>`).join('')}</div>
    <button class="skip-btn" onclick="skipConjugation()">🤷 No la sé</button>
    <div id="feedback"></div>`;
}

function skipConjugation() {
  if (state.answered) return;
  state.answered = true; state.total++;
  const w = state.words[state.current];
  const q = w._conjQ;
  const correct = q.correct;
  document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; if (b.textContent.trim() === correct) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');
  const fullForm = q.pronoun + ' ' + correct;
  state.streak = 0; state.mistakes.push({de: q.verb.inf, es: q.verb.es + ' (' + q.pronoun + ' → ' + correct + ')', emoji: '🔀'});
  speak(fullForm); logError('Conjugación', 'skip: ' + q.verb.inf, false);
  fb.innerHTML = `<div class="feedback wrong">🤷 Sin problema. Es: <strong>${q.pronoun} ${correct}</strong> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(fullForm)}',this)">🔊</button></div>${getConjTip(q.verb, q.pronoun)}`;
  updateStats();
  fb.innerHTML += `<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

function getConjTip(verb, pronoun) {
  const t = verb.type;
  if (t === 'stem-change') {
    const stem = verb.inf.replace(/en$/, '');
    const duForm = verb.conj['du'];
    return `<div class="grammar-tip"><div class="gt-header">💡 Cambio de raíz</div><div class="gt-body">El verbo <span class="gt-rule">${verb.inf}</span> cambia la vocal de la raíz en <span class="gt-rule">du</span> y <span class="gt-rule">er/sie/es</span>: <span class="gt-example">${verb.conj['ich']} → ${verb.conj['du']} → ${verb.conj['er/sie/es']}</span>. En <span class="gt-rule">wir/ihr/sie</span> se mantiene la vocal original.</div></div>`;
  }
  if (t === 'modal') {
    return `<div class="grammar-tip"><div class="gt-header">💡 Verbo modal</div><div class="gt-body">Los modales cambian la vocal en singular (<span class="gt-rule">ich/du/er</span>) y <span class="gt-rule">ich = er</span> (sin terminación): <span class="gt-example">${verb.conj['ich']}, ${verb.conj['du']}, ${verb.conj['er/sie/es']}</span>. El plural mantiene la vocal del infinitivo.</div></div>`;
  }
  if (t === 'reflexive') {
    return `<div class="grammar-tip"><div class="gt-header">💡 Verbo reflexivo</div><div class="gt-body">Los reflexivos llevan un pronombre que cambia con la persona: <span class="gt-rule">mich, dich, sich, uns, euch, sich</span>. Recuerda: <span class="gt-example">ich freue <u>mich</u></span>, <span class="gt-example">du freust <u>dich</u></span>.</div></div>`;
  }
  if (t === 'separable') {
    const parts = verb.conj['ich'].split(' ');
    const prefix = parts.length > 1 ? parts[parts.length - 1] : '';
    return `<div class="grammar-tip"><div class="gt-header">💡 Verbo separable</div><div class="gt-body">En presente, el prefijo <span class="gt-rule">${prefix}</span> se separa y va al <u>final</u>: <span class="gt-example">Ich ${verb.conj['ich']}</span>. En Nebensatz se junta: <span class="gt-example">..., weil ich ${verb.inf}</span>.</div></div>`;
  }
  if (t === 'inseparable') {
    const prefix = verb.inf.match(/^(be|emp|ent|er|ge|miss|ver|zer)/);
    return `<div class="grammar-tip"><div class="gt-header">💡 Verbo inseparable</div><div class="gt-body">Los prefijos <span class="gt-rule">be-, emp-, ent-, er-, ge-, ver-, zer-</span> nunca se separan. Se conjugan como verbos normales pero <u>sin ge-</u> en el Partizip II: <span class="gt-example">${verb.inf} → hat ${verb.inf.replace(/en$/, 't')}</span>.</div></div>`;
  }
  if (t === 'irregular' && verb.inf === 'sein') {
    return `<div class="grammar-tip"><div class="gt-header">💡 sein (ser/estar)</div><div class="gt-body"><span class="gt-rule">sein</span> es el verbo más irregular del alemán. Memoriza: <span class="gt-example">bin, bist, ist, sind, seid, sind</span>. Es esencial — se usa como auxiliar del Perfekt con verbos de movimiento.</div></div>`;
  }
  if (t === 'irregular' && verb.inf === 'haben') {
    return `<div class="grammar-tip"><div class="gt-header">💡 haben (tener)</div><div class="gt-body">Atención a las formas cortas en <span class="gt-rule">du</span> y <span class="gt-rule">er</span>: <span class="gt-example">du ha<u>st</u>, er ha<u>t</u></span> (pierde la -b-). Es el auxiliar más común del Perfekt.</div></div>`;
  }
  return `<div class="grammar-tip"><div class="gt-header">💡 Conjugación regular</div><div class="gt-body">Terminaciones regulares: <span class="gt-rule">-e, -st, -t, -en, -t, -en</span>. Si la raíz termina en -t/-d, se agrega una <span class="gt-rule">e</span> extra: <span class="gt-example">arbeit<u>e</u>st, find<u>e</u>t</span>.</div></div>`;
}

function checkConjugation(btn, selected, correct) {
  if (state.answered) return;
  state.answered = true; state.total++;
  const w = state.words[state.current];
  const q = w._conjQ;
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  const fullForm = q.pronoun + ' ' + correct;
  if (selected === correct) {
    btn.classList.add('correct'); state.correct++; state.streak++;
    const pts = 14 + (state.streak > 1 ? state.streak * 2 : 0); state.score += pts;
    speak(fullForm);logError('Conjugación',q.verb.inf+': '+fullForm,true);
    fb.innerHTML = `<div class="feedback correct">✅ ¡Correcto! <strong>${q.pronoun} ${correct}</strong> +${pts} XP <button class="speak-btn sm" onclick="speakBtn('${escapeStr(fullForm)}',this)">🔊</button></div>`;
  } else {
    btn.classList.add('wrong'); state.streak = 0; state.mistakes.push({de: q.verb.inf, es: q.verb.es + ' (' + q.pronoun + ' → ' + correct + ')', emoji: '🔀'});
    speak(fullForm);logError('Conjugación',q.verb.inf+': '+q.pronoun+' '+selected+'→'+correct,false);
    fb.innerHTML = `<div class="feedback wrong">❌ No es <strong>${selected}</strong>. Es: <strong>${q.pronoun} ${correct}</strong> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(fullForm)}',this)">🔊</button></div>${getConjTip(q.verb, q.pronoun)}`;
  }
  updateStats();
  fb.innerHTML += `<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

// SENTENCE BUILDING MODE
function getActiveSentences() {
  const lvl = getActiveLevel();
  if (lvl === 'A2') return typeof SENTENCES_A2 !== 'undefined' ? SENTENCES_A2 : [];
  return typeof SENTENCES_A1 !== 'undefined' ? SENTENCES_A1 : [];
}

let sbAnswerWords = [];

function renderSentence(area, w) {
  sbAnswerWords = [];
  const words = w.de.split(/\s+/);
  const scrambled = shuffle([...words]);
  area.innerHTML = `
    ${state.streak >= 3 ? `<div class="streak-indicator ${state.streak >= 5 ? 'hot' : ''}">🔥 ${state.streak}</div>` : ''}
    <div style="font-size:13px;color:var(--text-light);margin-bottom:4px">🧩 Ordena las palabras</div>
    <div class="word-es" style="margin-bottom:4px">${w.es}</div>
    ${w.hint ? `<div style="font-size:11px;color:var(--accent);margin-bottom:12px;font-weight:600">💡 ${w.hint}</div>` : ''}
    <div style="font-size:11px;color:var(--text-light);margin-bottom:8px">Toca las palabras en el orden correcto</div>
    <div class="sb-answer-zone" id="sbAnswer"><span class="sb-placeholder">Toca las palabras de abajo...</span></div>
    <div class="sb-word-bank" id="sbBank">
      ${scrambled.map((wd, i) => `<button class="sb-word" data-idx="${i}" data-word="${escapeStr(wd)}" onclick="sbAddWord(this)">${wd}</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <button class="check-btn" onclick="sbClear()" style="background:#94A3B8;box-shadow:none;font-size:13px;padding:8px 18px">Borrar ↺</button>
      <button class="check-btn" onclick="checkSentence()">Comprobar ✓</button>
    </div>
    <div id="feedback"></div>`;
}

function sbAddWord(btn) {
  if (state.answered) return;
  const word = btn.dataset.word;
  const idx = btn.dataset.idx;
  btn.classList.add('placed');
  sbAnswerWords.push({ word, idx, btn });
  sbRenderAnswer();
}

function sbRemoveWord(position) {
  if (state.answered) return;
  const removed = sbAnswerWords.splice(position, 1)[0];
  if (removed && removed.btn) removed.btn.classList.remove('placed');
  sbRenderAnswer();
}

function sbRenderAnswer() {
  const zone = document.getElementById('sbAnswer');
  if (!zone) return;
  if (sbAnswerWords.length === 0) {
    zone.innerHTML = '<span class="sb-placeholder">Toca las palabras de abajo...</span>';
    zone.classList.remove('has-words');
  } else {
    zone.innerHTML = sbAnswerWords.map((item, i) =>
      `<button class="sb-word in-answer" onclick="sbRemoveWord(${i})">${item.word}</button>`
    ).join('');
    zone.classList.add('has-words');
  }
}

function sbClear() {
  if (state.answered) return;
  sbAnswerWords.forEach(item => { if (item.btn) item.btn.classList.remove('placed'); });
  sbAnswerWords = [];
  sbRenderAnswer();
}

function checkSentence() {
  if (state.answered) return;
  if (sbAnswerWords.length === 0) return;
  state.answered = true; state.total++;
  const w = state.words[state.current];
  const userAnswer = sbAnswerWords.map(item => item.word).join(' ');
  const correctAnswer = w.de;
  const zone = document.getElementById('sbAnswer');
  const fb = document.getElementById('feedback');
  const ok = normalize(userAnswer) === normalize(correctAnswer);
  if (ok) {
    zone.classList.add('correct');
    state.correct++; state.streak++;
    const pts = 18 + (state.streak > 1 ? state.streak * 3 : 0); state.score += pts;
    speak(w.de);logError('Oraciones',w.de,true);
    fb.innerHTML = `<div class="feedback correct">✅ ¡Perfecto! +${pts} XP ${state.streak > 2 ? '🔥 Racha de ' + state.streak : ''}<br><small>${w.de}</small> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)">🔊</button></div>`;
  } else {
    zone.classList.add('wrong');
    state.streak = 0; state.mistakes.push(w);
    speak(w.de);logError('Oraciones',(w.hint||'')+': '+userAnswer+'→'+correctAnswer,false);
    fb.innerHTML = `<div class="feedback wrong">❌ Orden incorrecto<br>Tu respuesta: <strong>${userAnswer}</strong><br>Correcto: <strong>${correctAnswer}</strong> <button class="speak-btn sm" onclick="speakBtn('${escapeStr(w.de)}',this)">🔊</button></div>${getGrammarTip(w,'sentences')}`;
  }
  updateStats();
  fb.innerHTML += `<button class="next-btn" onclick="nextWord()">Siguiente →</button>`;
}

function showResults(){
  const pct=Math.round(state.correct/state.total*100);
  data.xp+=state.score;data.totalSessions++;data.totalCorrect+=state.correct;data.totalAnswered+=state.total;
  if(state.streak>data.bestStreak)data.bestStreak=state.streak;
  data.sessions.unshift({date:Date.now(),cat:state.mode==='review'?'Repaso 🔄':state.cat,score:state.score,correct:state.correct,total:state.total,pct});
  if(data.sessions.length>50)data.sessions=data.sessions.slice(0,50);
  saveData();renderLevelBar();

  document.getElementById("progressFill").style.width="100%";
  let emoji,msg;

  const bc=pct>=70?'var(--correct)':pct>=50?'var(--accent)':'var(--wrong)';
  let mh="";
  if(state.mistakes.length>0){
    mh=`<div class="mistakes-list"><h3>📝 Repasa estas:</h3>${state.mistakes.map(m=>`<div class="mistake-item"><span class="m-emoji">${m.emoji||'🧩'}</span><span style="color:var(--text-light)">${m.es}</span><span>→</span><span style="font-weight:700;color:var(--wrong)">${m.de}</span></div>`).join("")}</div>`;
  }
  const area=document.getElementById("gameArea");
  const li=getLevelXP(data.xp);
  area.innerHTML=`<div class="results"><div class="big-emoji">${emoji}</div><h2>${msg}</h2>
    <div class="score-text">${state.correct}/${state.total} correctas — ${pct}%</div>
    <div class="score-bar"><div class="score-fill" style="width:0%;background:${bc}"></div></div>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">+${state.score} XP · Nivel ${li.level} · Racha diaria: ${getDailyStreak()} días</div>
    ${mh}
    <button class="start-btn" style="margin-top:14px;font-size:14px" onclick="resetGame()">Jugar de nuevo 🔄</button></div>`;
  setTimeout(()=>{const f=area.querySelector(".score-fill");if(f)f.style.width=pct+"%";},100);
  renderCategories();renderModes();
}

{type:"teach",title:"Los tres géneros",content:`
<div class="lc-explain">En alemán, cada sustantivo tiene un género: <strong>masculino</strong>, <strong>femenino</strong> o <strong>neutro</strong>. El artículo te indica cuál es:</div>

<tr><td><span class="highlight" style="color:#92400E">das</span></td><td>Neutro</td><td>das Kind (el niño/a)</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>¡El género NO siempre coincide con el español! "die Sonne" (el sol) es femenino en alemán, pero masculino en español.</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> "Das Mädchen" (la chica) es <strong>neutro</strong> aunque se refiere a una persona femenina. ¿Por qué? Porque los sufijos <strong>-chen</strong> y <strong>-lein</strong> son diminutivos, y en alemán <strong>todo diminutivo es automáticamente neutro</strong>, sin importar lo que describa. Das Brötchen (el panecillo), das Häuschen (la casita) — todos neutros.</span></div>`},
{type:"teach",title:"Trucos para recordar",content:`

<div class="example-box">
<div style="font-weight:700;color:#1E40AF;margin-bottom:4px">🔵 Suelen ser DER (masculino):</div>
<div style="font-size:13px;margin-bottom:8px">• Días de la semana: <strong>der Montag</strong><br>• Meses: <strong>der Januar</strong><br>• Estaciones: <strong>der Sommer</strong></div>
<div style="font-weight:700;color:#9D174D;margin-bottom:4px">🔴 Suelen ser DIE (femenino):</div>
<div style="font-size:13px;margin-bottom:8px">• Terminados en <strong>-ung</strong>: die Zeitung<br>• Terminados en <strong>-heit/-keit</strong>: die Freiheit<br>• Terminados en <strong>-ie</strong>: die Melodie</div>
<div style="font-weight:700;color:#92400E;margin-bottom:4px">🟡 Suelen ser DAS (neutro):</div>
<div style="font-size:13px">• Terminados en <strong>-chen</strong>: das Mädchen<br>• Terminados en <strong>-ment</strong>: das Dokument<br>• Infinitivos como sustantivos: das Essen</div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>El plural SIEMPRE usa <strong>die</strong>, sin importar el género singular. Ejemplo: <strong>die Kinder</strong> (los niños).</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> Las terminaciones <strong>-ung</strong> (die Zeitung) son SIEMPRE femeninas porque vienen de verbos nominalizados: zeigen → Zeitung. Es como el "-ción" del español: todos los sustantivos terminados en -ción son femeninos (la nación, la canción). ¡Misma lógica!</span></div>

<div class="study-box"><span class="study-icon">🎯</span><span><strong>Cómo estudiarlo:</strong> Estos dos verbos son la <strong>base de todo</strong> — aparecen en el 80% de las frases y son los auxiliares del pasado. Memorízalos hasta poder recitarlos dormido <strong>antes</strong> de pasar a otros verbos. Truco: repite en voz alta "bin-bist-ist-sind-seid-sind" como un ritmo hasta que salga solo.</span></div>`},
{type:"quiz",title:"Practica sein y haben",questions:[
{q:"'Yo soy' en alemán es...",opts:["Ich habe","Ich bist","Ich bin","Ich hat"],correct:2,tip:"sein: ich <b>bin</b>, du bist, er ist, wir sind, ihr seid, sie sind."},
{q:"'Du _____ nett' (Tú eres amable)",opts:["bin","bist","ist","sind"],correct:1,tip:"Con <b>du</b> siempre es <b>bist</b>: du bist."},
{q:"'Ella tiene un gato' = 'Sie _____ eine Katze'",opts:["habe","hast","hat","haben"],correct:2,tip:"haben: ich habe, du hast, er/sie <b>hat</b>, wir haben."},
{q:"'Nosotros somos amigos' = 'Wir _____ Freunde'",opts:["bin","seid","ist","sind"],correct:3,tip:"Con <b>wir</b> y <b>sie (plural)</b> siempre es <b>sind</b>."},
{type:"fill",q:"Completa: 'Er _____ müde.' (estar cansado, sein)",answer:["ist"],tip:"sein con er/sie/es → <b>ist</b>."},
