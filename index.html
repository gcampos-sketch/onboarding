<div class="pc-example">Ich lese die <strong>Zeitung</strong>. Er kauft zwei <strong>Zeitungen</strong>.<br><span class="pc-es">Leo el periódico. Él compra dos periódicos.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Auto</span><span class="pc-plural">pl.: die Autos</span><span class="pc-rule">-s</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Auto, die Autos',this)">🔊</button></div>
<div class="pc-example">Das <strong>Auto</strong> ist neu. Auf dem Parkplatz stehen viele <strong>Autos</strong>.<br><span class="pc-es">El coche es nuevo. En el parking hay muchos coches.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Mädchen</span><span class="pc-plural">pl.: die Mädchen</span><span class="pc-rule">—</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Mädchen, die Mädchen',this)">🔊</button></div>
<div class="pc-example">Das <strong>Mädchen</strong> lacht. Die <strong>Mädchen</strong> spielen Fußball.<br><span class="pc-es">La chica se ríe. Las chicas juegan fútbol.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article der">masc.</span><span class="pc-word">der Mann</span><span class="pc-plural">pl.: die Männer</span><span class="pc-rule">-̈er</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('der Mann, die Männer',this)">🔊</button></div>
<div class="pc-example">Der <strong>Mann</strong> arbeitet. Die <strong>Männer</strong> trinken Kaffee.<br><span class="pc-es">El hombre trabaja. Los hombres beben café.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article die">fem.</span><span class="pc-word">die Mutter</span><span class="pc-plural">pl.: die Mütter</span><span class="pc-rule">-̈</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('die Mutter, die Mütter',this)">🔊</button></div>
<div class="pc-example">Meine <strong>Mutter</strong> kocht gut. Alle <strong>Mütter</strong> sind eingeladen.<br><span class="pc-es">Mi madre cocina bien. Todas las madres están invitadas.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Haus</span><span class="pc-plural">pl.: die Häuser</span><span class="pc-rule">-̈er</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Haus, die Häuser',this)">🔊</button></div>
<div class="pc-example">Das <strong>Haus</strong> ist groß. In der Straße gibt es alte <strong>Häuser</strong>.<br><span class="pc-es">La casa es grande. En la calle hay casas antiguas.</span></div></div>

<div class="plural-card"><div class="pc-header"><span class="pc-article das">neutro</span><span class="pc-word">das Telefon</span><span class="pc-plural">pl.: die Telefone</span><span class="pc-rule">-e</span><button class="speak-btn sm pc-audio" onclick="event.stopPropagation();speakBtn('das Telefon, die Telefone',this)">🔊</button></div>
<div class="pc-example">Das <strong>Telefon</strong> klingelt. Im Büro gibt es drei <strong>Telefone</strong>.<br><span class="pc-es">El teléfono suena. En la oficina hay tres teléfonos.</span></div></div>

</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Lee cada ejemplo en voz alta. Intenta adivinar el plural <strong>antes</strong> de mirar la respuesta. La memoria activa funciona mejor que la pasiva.</span></div>`},
{type:"teach",title:"Trucos para adivinar el plural",content:`
<div class="lc-explain">No son reglas 100% seguras, pero funcionan en la mayoría de casos:</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">🔵 Femeninos terminados en <strong>-ung, -heit, -keit, -tion</strong></span><span class="ex-es">→ siempre <strong>-en</strong></span></div>
<div class="example-row"><span class="ex-de">🔵 Femeninos terminados en <strong>-e</strong></span><span class="ex-es">→ casi siempre <strong>-n</strong></span></div>
<div class="example-row"><span class="ex-de">🟢 Neutros terminados en <strong>-chen, -lein</strong></span><span class="ex-es">→ sin cambio</span></div>
<div class="example-row"><span class="ex-de">🟢 Sustantivos terminados en <strong>-er, -el, -en</strong></span><span class="ex-es">→ sin cambio (o solo Umlaut)</span></div>
<div class="example-row"><span class="ex-de">🔴 Palabras de origen extranjero</span><span class="ex-es">→ normalmente <strong>-s</strong></span></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Siempre aprende cada sustantivo con su artículo Y su plural: <strong>der Hund, die Hunde</strong>. Es la única forma segura.</span></div>
<div class="study-box"><span class="study-icon">🎯</span><span><strong>Cómo estudiarlo:</strong> Nunca aprendas una palabra sola. Aprende siempre el <strong>trío completo</strong>: artículo + singular + plural. En vez de "Hund", memoriza "<strong>der Hund, die Hunde</strong>" como una sola unidad. Repítelo en voz alta como una cadena. Agrupa por regla de plural: estudia juntas todas las de -e, luego todas las de -en, etc.</span></div>`},
{type:"quiz",title:"Practica plurales",questions:[
{q:"der Hund → die _____",opts:["Hunden","Hünde","Hunde","Hunds"],correct:2,tip:"Hund es masculino. Muchos masculinos forman el plural con <b>-e</b>: Hund → Hund<b>e</b>."},
{q:"das Kind → die _____",opts:["Kinde","Kindern","Kinds","Kinder"],correct:3,tip:"Kind es neutro. Muchos neutros forman el plural con <b>-er</b>: Kind → Kind<b>er</b>."},
{q:"die Blume → die _____",opts:["Blumen","Blüme","Blumes","Blumer"],correct:0,tip:"Blume es femenino terminado en <b>-e</b>. Estos femeninos solo añaden <b>-n</b>: Blume → Blume<b>n</b>."},
{q:"das Mädchen → die _____",opts:["Mädchens","Mädchen","Mädcher","Mädchenen"],correct:1,tip:"Los diminutivos con <b>-chen</b> y <b>-lein</b> no cambian en plural: das Mädchen → die Mädchen."},
{q:"das Auto → die _____",opts:["Auten","Autos","Äuter","Autoen"],correct:1,tip:"Las palabras de origen extranjero suelen formar el plural con <b>-s</b>: Auto → Auto<b>s</b>."},
{type:"fill",q:"Escribe el plural: 'das Buch → die _____'",answer:["Bücher"],tip:"Buch es neutro con a/o/u. Estos forman plural con Umlaut + <b>-er</b>: B<b>ü</b>cher."},
{type:"truefalse",sentence:"die Frau → die Frauen",correct:true,tip:"Correcto. Muchos femeninos forman el plural con <b>-en</b>: Frau → Frau<b>en</b>."},
{type:"truefalse",sentence:"der Stuhl → die Stuhle",correct:false,correction:"der Stuhl → die Stühle",tip:"Stuhl tiene cambio de vocal (Umlaut) en plural: Stuhl → St<b>ü</b>hle, no Stuhle."},
{type:"match",q:"Conecta singular con plural",pairs:[{left:"der Mann",right:"die Männer"},{left:"die Lampe",right:"die Lampen"},{left:"das Foto",right:"die Fotos"},{left:"der Lehrer",right:"die Lehrer"}]},
]}
]},
{id:"zahlen_gross",icon:"💯",title:"Números 20-100 y fechas",desc:"Contar, precios, teléfonos y fechas",
steps:[
{type:"teach",title:"Números del 20 al 100",content:`
<div class="lc-explain">En alemán los números se dicen <strong>al revés</strong>: primero las unidades, luego las decenas (como "five-and-twenty" en inglés antiguo):</div>
<table class="grammar-table">
<tr><th>#</th><th>Alemán</th><th>Lógica</th></tr>
<tr><td>20</td><td class="highlight">zwanzig</td><td></td></tr>
<tr><td>21</td><td class="highlight">einundzwanzig</td><td>ein + und + zwanzig</td></tr>
<tr><td>30</td><td class="highlight">dreißig</td><td>ojo: ß, no z</td></tr>
<tr><td>40</td><td class="highlight">vierzig</td><td></td></tr>
<tr><td>50</td><td class="highlight">fünfzig</td><td></td></tr>
<tr><td>60</td><td class="highlight">sechzig</td><td>no sechszig</td></tr>
<tr><td>70</td><td class="highlight">siebzig</td><td>no siebenzig</td></tr>
<tr><td>80</td><td class="highlight">achtzig</td><td></td></tr>
<tr><td>90</td><td class="highlight">neunzig</td><td></td></tr>
<tr><td>100</td><td class="highlight">(ein)hundert</td><td></td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">35 = fünfunddreißig</span><span class="ex-es">cinco-y-treinta</span><button class="speak-btn sm" onclick="speakBtn('fünfunddreißig',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">47 = siebenundvierzig</span><span class="ex-es">siete-y-cuarenta</span><button class="speak-btn sm" onclick="speakBtn('siebenundvierzig',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">99 = neunundneunzig</span><span class="ex-es">nueve-y-noventa</span><button class="speak-btn sm" onclick="speakBtn('neunundneunzig',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Patrón: <strong>unidad + und + decena</strong>. 23 = drei-und-zwanzig. Siempre al revés de como lo decimos en español.</span></div>`},
{type:"teach",title:"Fechas y precios",content:`
<div class="lc-explain">En el examen te piden entender fechas y precios. Así se dicen:</div>
<div class="example-box">
<div style="font-weight:700;margin-bottom:6px">📅 Fechas:</div>
<div class="example-row"><span class="ex-de">Heute ist der erste März.</span><span class="ex-es">Hoy es 1 de marzo.</span><button class="speak-btn sm" onclick="speakBtn('Heute ist der erste März',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich bin am dritten Juli geboren.</span><span class="ex-es">Nací el 3 de julio.</span><button class="speak-btn sm" onclick="speakBtn('Ich bin am dritten Juli geboren',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Mein Geburtstag ist am fünfzehnten Oktober.</span><span class="ex-es">Mi cumpleaños es el 15 de octubre.</span></div>
</div>
<div class="example-box">
<div style="font-weight:700;margin-bottom:6px">💶 Precios:</div>
<div class="example-row"><span class="ex-de">Das kostet fünf Euro fünfzig.</span><span class="ex-es">Cuesta cinco euros cincuenta. (5,50 €)</span><button class="speak-btn sm" onclick="speakBtn('Das kostet fünf Euro fünfzig',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Das macht zusammen zwölf Euro dreißig.</span><span class="ex-es">Son en total doce euros treinta. (12,30 €)</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Ordinales: <strong>erste</strong> (1°), <strong>zweite</strong> (2°), <strong>dritte</strong> (3°), luego se agrega <strong>-te</strong> hasta el 19° y <strong>-ste</strong> del 20° en adelante.</span></div>`},
{type:"quiz",title:"Practica números grandes",questions:[
{q:"¿Cómo se dice 25?",opts:["zwanzigfünf","zweiundfünfzig","fünfundzwanzig","fünfzwanzig"],correct:2,tip:"Patrón: unidad + und + decena. 25 = <b>fünf</b>und<b>zwanzig</b> (cinco-y-veinte)."},
{q:"¿Cómo se dice 43?",opts:["vierunddreizig","dreiundvierzig","vierdrei","dreivierzig"],correct:1,tip:"43 = <b>drei</b>und<b>vierzig</b> (tres-y-cuarenta). Siempre al revés."},
{q:"'dreißig' es el número...",opts:["13","30","3","33"],correct:1,tip:"<b>dreißig</b> = 30. Ojo: con ß, no z. dreizehn = 13."},
{q:"En alemán los números van...",opts:["Normal como español","Unidades antes de decenas","Solo las decenas","Sin cambio"],correct:1,tip:"Patrón inverso: <b>unidades + und + decenas</b>. 23 = dreiund<b>zwanzig</b>."},
{type:"fill",q:"Escribe 47 en alemán:",answer:["siebenundvierzig"],tip:"47 = <b>sieben</b>und<b>vierzig</b> (siete-y-cuarenta)."},
{type:"truefalse",sentence:"'sechszig' es la forma correcta de escribir 60.",correct:false,correction:"Se escribe 'sechzig' (sin la s de sechs).",tip:"60 = <b>sechzig</b> (no sechszig). 70 = <b>siebzig</b> (no siebenzig). Son excepciones."},
]}
]},
{id:"writing",icon:"✉️",title:"Escribir emails y formularios",desc:"Lo que te piden en la prueba escrita del Goethe A1",
steps:[
{type:"teach",title:"Estructura de un email A1",content:`
<div class="lc-explain">En el examen Goethe A1 debes escribir un email corto (~30 palabras). La estructura es siempre:</div>
<div class="example-box">
<div style="font-size:13px;line-height:1.8">
<div><strong>Liebe Maria, / Lieber Thomas,</strong> <span style="color:var(--text-light)">(informal)</span></div>
<div><strong>Sehr geehrte Frau.../Sehr geehrter Herr...</strong> <span style="color:var(--text-light)">(formal)</span></div>
<div style="margin:8px 0"><em>[tu mensaje aquí]</em></div>
<div><strong>Viele Grüße</strong> <span style="color:var(--text-light)">(informal)</span></div>
<div><strong>Mit freundlichen Grüßen</strong> <span style="color:var(--text-light)">(formal)</span></div>
<div><em>[tu nombre]</em></div>
</div></div>
<div class="lc-explain" style="margin-top:12px">Ejemplo real — avisar que llegas tarde:</div>
<div class="dialogue-box">
<div style="font-size:13px;line-height:1.8">
<div><strong>Liebe Anna,</strong></div>
<div>ich komme heute leider 30 Minuten später. Mein Bus hat Verspätung. Kannst du bitte schon anfangen?</div>
<div style="margin-top:6px"><strong>Viele Grüße</strong></div>
<div>María</div>
</div></div>
<button class="speak-btn" onclick="speakBtn('Liebe Anna, ich komme heute leider dreißig Minuten später. Mein Bus hat Verspätung. Kannst du bitte schon anfangen? Viele Grüße, María',this)" style="margin:8px auto;display:flex">🔊</button>
<div class="tip-box"><span class="tip-icon">💡</span><span>Frases comodín para emails: <strong>Ich schreibe dir, weil...</strong> (Te escribo porque...), <strong>Kannst du bitte...</strong> (¿Puedes por favor...), <strong>Vielen Dank für...</strong> (Muchas gracias por...)</span></div>`},
{type:"teach",title:"Rellenar formularios",content:`
<div class="lc-explain">El examen también te pide rellenar formularios. Aprende estos campos:</div>
<table class="grammar-table">
<tr><th>Campo</th><th>Alemán</th><th>Ejemplo</th></tr>
<tr><td>Nombre</td><td class="highlight">Vorname</td><td>María</td></tr>
<tr><td>Apellido</td><td class="highlight">Familienname / Nachname</td><td>González</td></tr>
<tr><td>Dirección</td><td class="highlight">Adresse / Straße</td><td>Berliner Str. 5</td></tr>
<tr><td>Código postal</td><td class="highlight">Postleitzahl (PLZ)</td><td>10115</td></tr>
<tr><td>Ciudad</td><td class="highlight">Ort / Stadt</td><td>Berlin</td></tr>
<tr><td>Fecha de nacimiento</td><td class="highlight">Geburtsdatum</td><td>15.03.1999</td></tr>
<tr><td>Lugar de nacimiento</td><td class="highlight">Geburtsort</td><td>Santiago</td></tr>
<tr><td>Nacionalidad</td><td class="highlight">Staatsangehörigkeit</td><td>chilenisch</td></tr>
<tr><td>Estado civil</td><td class="highlight">Familienstand</td><td>ledig (soltero/a)</td></tr>
<tr><td>Teléfono</td><td class="highlight">Telefonnummer</td><td>0176-1234567</td></tr>
<tr><td>Firma</td><td class="highlight">Unterschrift</td><td></td></tr>
</table>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Familienstand: <strong>ledig</strong> (soltero/a), <strong>verheiratet</strong> (casado/a), <strong>geschieden</strong> (divorciado/a), <strong>verwitwet</strong> (viudo/a).</span></div>`},
{type:"quiz",title:"Practica escritura",questions:[
{q:"'Vorname' significa...",opts:["Apellido","Nombre (de pila)","Dirección","Fecha"],correct:1,tip:"<b>Vorname</b> = nombre de pila. <b>Nachname/Familienname</b> = apellido."},
{q:"¿Cómo se despide un email formal?",opts:["Viele Grüße","Tschüss","Mit freundlichen Grüßen","Hallo"],correct:2,tip:"<b>Mit freundlichen Grüßen</b> = Atentamente (formal). Viele Grüße = informal."},
{q:"'PLZ' es la abreviatura de...",opts:["Plaza","Postleitzahl","Polizei","Platz"],correct:1,tip:"<b>PLZ = Postleitzahl</b> = código postal."},
{q:"'ledig' significa...",opts:["Casado/a","Divorciado/a","Soltero/a","Viudo/a"],correct:2,tip:"<b>ledig</b> = soltero/a. verheiratet = casado/a. geschieden = divorciado/a."},
{type:"fill",q:"Tu apellido en un formulario: '_____'",answer:["Nachname","Familienname"],tip:"Apellido = <b>Nachname</b> o <b>Familienname</b>."},
{type:"match",q:"Conecta campo con significado",pairs:[{left:"Geburtsdatum",right:"fecha de nacimiento"},{left:"Unterschrift",right:"firma"},{left:"Adresse",right:"dirección"},{left:"Familienstand",right:"estado civil"}]},
]}
]}
];

LESSONS.push(
{id:"praeteritum",icon:"⏮️",title:"Präteritum: war & hatte",desc:"El pasado simple de sein y haben",level:"A2",
steps:[
{type:"teach",title:"¿Por qué existe el Präteritum?",content:`
<div class="lc-explain">En alemán hay <strong>dos formas de hablar en pasado</strong>: el <strong>Perfekt</strong> (he comido) y el <strong>Präteritum</strong> (comí). La diferencia práctica:</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">🗣️ Al hablar → se usa el Perfekt</div>
<div class="example-row"><span class="ex-de">Ich <strong>habe</strong> gestern Pizza <strong>gegessen</strong>.</span><span class="ex-es">Ayer comí pizza.</span></div>
<div style="font-weight:700;color:var(--secondary);margin-bottom:6px;margin-top:8px">📖 Al escribir / con sein y haben → se usa el Präteritum</div>
<div class="example-row"><span class="ex-de">Ich <strong>war</strong> gestern müde.</span><span class="ex-es">Ayer estaba cansado.</span></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Regla clave:</strong> En A2 solo necesitas el Präteritum de <strong>sein (war)</strong> y <strong>haben (hatte)</strong>. Para todos los demás verbos, usa el Perfekt al hablar. Nadie dice "ich aß" en conversación — suena como un libro antiguo.</span></div>`},
{type:"teach",title:"war (era/estaba) y hatte (tenía)",content:`
<div class="lc-explain">Las formas de <strong>sein</strong> y <strong>haben</strong> en Präteritum. Fíjate que ich = er/sie/es (sin terminación):</div>
<table class="grammar-table">
<tr><th>Persona</th><th>sein → war</th><th>haben → hatte</th></tr>
<tr><td>ich</td><td class="highlight">war</td><td class="highlight">hatte</td></tr>
<tr><td>du</td><td class="highlight">warst</td><td class="highlight">hattest</td></tr>
<tr><td>er/sie/es</td><td class="highlight">war</td><td class="highlight">hatte</td></tr>
<tr><td>wir</td><td class="highlight">waren</td><td class="highlight">hatten</td></tr>
<tr><td>ihr</td><td class="highlight">wart</td><td class="highlight">hattet</td></tr>
<tr><td>sie/Sie</td><td class="highlight">waren</td><td class="highlight">hatten</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Mein Opa <strong>war</strong> Bäcker.</span><span class="ex-es">Mi abuelo era panadero.</span><button class="speak-btn sm" onclick="speakBtn('Mein Opa war Bäcker',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Wir <strong>waren</strong> gestern im Kino.</span><span class="ex-es">Ayer estuvimos en el cine.</span><button class="speak-btn sm" onclick="speakBtn('Wir waren gestern im Kino',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>hatte</strong> keine Zeit.</span><span class="ex-es">No tenía tiempo.</span><button class="speak-btn sm" onclick="speakBtn('Ich hatte keine Zeit',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Das Wetter <strong>war</strong> schlecht.</span><span class="ex-es">El clima estaba malo.</span><button class="speak-btn sm" onclick="speakBtn('Das Wetter war schlecht',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Sie <strong>hatten</strong> zwei Kinder.</span><span class="ex-es">Ellos tenían dos hijos.</span><button class="speak-btn sm" onclick="speakBtn('Sie hatten zwei Kinder',this)">🔊</button></div>
</div>`},
{type:"teach",title:"Mini diálogo: Wie war dein Wochenende?",content:`
<div class="lc-explain">Lee este diálogo real. Fíjate cómo se mezclan <strong>war/hatte</strong> (Präteritum) con otros verbos en <strong>Perfekt</strong>:</div>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Hey, wie <strong>war</strong> dein Wochenende?</div><div class="dl-es">Hey, ¿cómo estuvo tu fin de semana?</div></div><button class="speak-btn sm" onclick="speakBtn('Hey, wie war dein Wochenende?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Es <strong>war</strong> super! Ich <strong>hatte</strong> endlich frei.</div><div class="dl-es">¡Estuvo genial! Por fin tenía libre.</div></div><button class="speak-btn sm" onclick="speakBtn('Es war super! Ich hatte endlich frei.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Was hast du gemacht?</div><div class="dl-es">¿Qué hiciste? (Perfekt, no Präteritum)</div></div><button class="speak-btn sm" onclick="speakBtn('Was hast du gemacht?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Ich bin gewandert. Das Wetter <strong>war</strong> perfekt.</div><div class="dl-es">Hice senderismo. El clima estaba perfecto.</div></div><button class="speak-btn sm" onclick="speakBtn('Ich bin gewandert. Das Wetter war perfekt.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span><strong>Error común de hispanohablantes:</strong> Decir "Ich war gegangen" (yo estuve ido) mezclando Präteritum + Partizip. En alemán no se mezclan así. Es "Ich <strong>bin</strong> gegangen" (Perfekt) o "Ich <strong>ging</strong>" (Präteritum), nunca las dos.</span></div>`},
{type:"quiz",title:"Practica Präteritum",questions:[
{q:"'Mi abuelo era panadero' = 'Mein Opa _____ Bäcker'",opts:["ist","war","hatte","bin"],correct:1,tip:"sein en pasado (Präteritum): ich/er <b>war</b>."},
{q:"'Yo no tenía tiempo' = 'Ich _____ keine Zeit'",opts:["war","bin","hatte","habe"],correct:2,tip:"haben en pasado: ich <b>hatte</b>."},
{q:"'Nosotros estábamos en Berlín' = 'Wir _____ in Berlin'",opts:["war","waren","hatten","sind"],correct:1,tip:"sein en pasado con wir/sie: <b>waren</b>."},
{q:"'du' + sein en pasado = ...",opts:["warst","wart","war","waren"],correct:0,tip:"sein: du <b>warst</b>, ihr <b>wart</b>. No confundir."},
{type:"fill",q:"'Ella tenía un gato' = 'Sie _____ eine Katze.'",answer:["hatte"],tip:"haben en Präteritum: er/sie <b>hatte</b>."},
{type:"match",q:"Conecta pronombre con 'sein' en Präteritum",pairs:[{left:"ich",right:"war"},{left:"du",right:"warst"},{left:"wir",right:"waren"},{left:"ihr",right:"wart"}]},
]}]},
{id:"perfekt",icon:"✅",title:"Perfekt: he hecho, he ido...",desc:"El pasado compuesto con haben/sein + Partizip II",level:"A2",
steps:[
{type:"teach",title:"¿Qué es el Perfekt y cuándo se usa?",content:`
<div class="lc-explain">El <strong>Perfekt</strong> es el tiempo pasado que usarás el 90% de las veces al hablar alemán. Equivale a "he comido" o "comí" en español:</div>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich <strong>habe</strong> gestern Pizza <strong>gegessen</strong>.</span><span class="ex-es">Ayer comí / he comido pizza.</span><button class="speak-btn sm" onclick="speakBtn('Ich habe gestern Pizza gegessen',this)">🔊</button></div>
</div>
<div class="lc-explain">La estructura es siempre la misma:</div>
<table class="grammar-table">
<tr><td>Sujeto</td><td class="highlight">haben/sein conjugado</td><td>complementos</td><td class="highlight">Partizip II (al final)</td></tr>
<tr><td>Ich</td><td><strong>habe</strong></td><td>gestern Pizza</td><td><strong>gegessen</strong></td></tr>
<tr><td>Er</td><td><strong>ist</strong></td><td>nach Berlin</td><td><strong>gefahren</strong></td></tr>
</table>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error típico de hispanohablantes:</strong> Poner el participio justo después del auxiliar como en español ("Ich habe gegessen Pizza" ✗). En alemán el Partizip II va <strong>siempre al final</strong>: "Ich habe Pizza <strong>gegessen</strong>" ✓</span></div>`},
{type:"teach",title:"¿haben o sein?",content:`
<div class="lc-explain">La gran pregunta: ¿cuándo se usa <strong>haben</strong> y cuándo <strong>sein</strong>?</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">🔵 haben — la mayoría de verbos:</div>
<div class="example-row"><span class="ex-de">Ich <strong>habe</strong> Deutsch <strong>gelernt</strong>.</span><span class="ex-es">He aprendido alemán.</span><button class="speak-btn sm" onclick="speakBtn('Ich habe Deutsch gelernt',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Sie <strong>hat</strong> ein Buch <strong>gelesen</strong>.</span><span class="ex-es">Ella ha leído un libro.</span><button class="speak-btn sm" onclick="speakBtn('Sie hat ein Buch gelesen',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Wir <strong>haben</strong> Fußball <strong>gespielt</strong>.</span><span class="ex-es">Hemos jugado fútbol.</span><button class="speak-btn sm" onclick="speakBtn('Wir haben Fußball gespielt',this)">🔊</button></div>
</div>
<div class="example-box">
<div style="font-weight:700;color:var(--secondary);margin-bottom:6px">🟢 sein — verbos de movimiento y cambio de estado:</div>
<div class="example-row"><span class="ex-de">Ich <strong>bin</strong> nach Berlin <strong>gefahren</strong>.</span><span class="ex-es">He ido a Berlín.</span><button class="speak-btn sm" onclick="speakBtn('Ich bin nach Berlin gefahren',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er <strong>ist</strong> um 7 Uhr <strong>aufgestanden</strong>.</span><span class="ex-es">Él se ha levantado a las 7.</span><button class="speak-btn sm" onclick="speakBtn('Er ist um sieben Uhr aufgestanden',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Sie <strong>ist</strong> nach Hause <strong>gelaufen</strong>.</span><span class="ex-es">Ella fue a casa caminando.</span><button class="speak-btn sm" onclick="speakBtn('Sie ist nach Hause gelaufen',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Verbos con <strong>sein</strong>: gehen, kommen, fahren, fliegen, laufen, aufstehen, einschlafen, sterben, werden, bleiben, passieren. Si implica <strong>ir de A a B</strong> o <strong>cambiar de estado</strong> → sein.</span></div>
<div class="tip-box" style="background:#EEF2FF;border:1px solid #C7D2FE"><span class="tip-icon">🧠</span><span><strong>¿Sabías que?</strong> ¿Por qué los verbos de movimiento usan <strong>sein</strong> y no haben? En alemán antiguo, "Ich bin gegangen" significaba literalmente "Yo <strong>soy</strong> ido" — describía un <strong>estado resultante</strong> del movimiento (ahora estoy en otro lugar). Con el tiempo se convirtió en pasado. El español hizo lo mismo: "yo <strong>he</strong> ido" viene de "yo <strong>tengo</strong> ido". ¡Ambos idiomas hicieron lo mismo pero con verbos auxiliares diferentes!</span></div>`},
{type:"teach",title:"Cómo formar el Partizip II",content:`
<div class="lc-explain">El <strong>Partizip II</strong> es la parte que va al final. Hay 3 patrones:</div>
<table class="grammar-table">
<tr><th>Tipo</th><th>Fórmula</th><th>Ejemplos</th></tr>
<tr><td class="highlight">Regular</td><td>ge- + raíz + <strong>-t</strong></td><td>machen → <strong>gemacht</strong>, lernen → <strong>gelernt</strong>, kochen → <strong>gekocht</strong></td></tr>
<tr><td class="highlight">Irregular</td><td>ge- + raíz (cambiada) + <strong>-en</strong></td><td>fahren → <strong>gefahren</strong>, lesen → <strong>gelesen</strong>, schreiben → <strong>geschrieben</strong></td></tr>
<tr><td class="highlight">Separable</td><td>prefijo + ge- + raíz + -t/-en</td><td>aufstehen → <strong>aufgestanden</strong>, einkaufen → <strong>eingekauft</strong></td></tr>
<tr><td class="highlight">Inseparable</td><td>raíz + -t/-en (SIN ge-)</td><td>verstehen → <strong>verstanden</strong>, besuchen → <strong>besucht</strong></td></tr>
</table>
<div class="example-box">
<div style="font-weight:700;margin-bottom:6px">Los irregulares más importantes para memorizar:</div>
<div class="example-row"><span class="ex-de">essen → <strong>gegessen</strong></span><span class="ex-es">comido</span></div>
<div class="example-row"><span class="ex-de">trinken → <strong>getrunken</strong></span><span class="ex-es">bebido</span></div>
<div class="example-row"><span class="ex-de">sprechen → <strong>gesprochen</strong></span><span class="ex-es">hablado</span></div>
<div class="example-row"><span class="ex-de">nehmen → <strong>genommen</strong></span><span class="ex-es">tomado</span></div>
<div class="example-row"><span class="ex-de">geben → <strong>gegeben</strong></span><span class="ex-es">dado</span></div>
<div class="example-row"><span class="ex-de">sehen → <strong>gesehen</strong></span><span class="ex-es">visto</span></div>
<div class="example-row"><span class="ex-de">schlafen → <strong>geschlafen</strong></span><span class="ex-es">dormido</span></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span>Los verbos terminados en <strong>-ieren</strong> NO llevan ge-: telefonieren → <strong>telefoniert</strong> (no *getelefoniert), studieren → <strong>studiert</strong>.</span></div>
<div class="study-box"><span class="study-icon">🎯</span><span><strong>Cómo estudiarlo:</strong> No intentes memorizar todos los participios de golpe. Aprende primero los <strong>regulares</strong> (ge-...-t) que son la mayoría y siguen un patrón fijo. Luego haz una lista de los <strong>10 irregulares más frecuentes</strong> (gegessen, getrunken, gefahren...) y practícalos en bloque. Los irregulares raros los irás aprendiendo con el uso, no de memoria.</span></div>`},
{type:"teach",title:"Mini diálogo: Was hast du am Wochenende gemacht?",content:`
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Was hast du am Wochenende <strong>gemacht</strong>?</div><div class="dl-es">¿Qué hiciste el fin de semana?</div></div><button class="speak-btn sm" onclick="speakBtn('Was hast du am Wochenende gemacht?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Am Samstag <strong>bin</strong> ich ins Kino <strong>gegangen</strong>.</div><div class="dl-es">El sábado fui al cine.</div></div><button class="speak-btn sm" onclick="speakBtn('Am Samstag bin ich ins Kino gegangen.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Welchen Film hast du <strong>gesehen</strong>?</div><div class="dl-es">¿Qué película viste?</div></div><button class="speak-btn sm" onclick="speakBtn('Welchen Film hast du gesehen?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Einen Actionfilm. Er <strong>hat</strong> mir gut <strong>gefallen</strong>.</div><div class="dl-es">Una de acción. Me gustó mucho.</div></div><button class="speak-btn sm" onclick="speakBtn('Einen Actionfilm. Er hat mir gut gefallen.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Und am Sonntag?</div><div class="dl-es">¿Y el domingo?</div></div></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Da <strong>bin</strong> ich zu Hause <strong>geblieben</strong> und <strong>habe</strong> <strong>gekocht</strong>.</div><div class="dl-es">Me quedé en casa y cociné.</div></div><button class="speak-btn sm" onclick="speakBtn('Da bin ich zu Hause geblieben und habe gekocht.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Fíjate: <strong>gehen, bleiben</strong> van con sein. <strong>sehen, kochen, gefallen</strong> van con haben. La pregunta "Was hast du gemacht?" (¿Qué hiciste?) es la frase más útil del A2.</span></div>`},
{type:"quiz",title:"Practica Perfekt",questions:[
{q:"'He aprendido alemán' = 'Ich _____ Deutsch gelernt'",opts:["bin","habe","war","hatte"],correct:1,tip:"La mayoría de verbos usan <b>haben</b> en Perfekt."},
{q:"'He ido a Berlín' = 'Ich _____ nach Berlin gefahren'",opts:["habe","bin","war","hatte"],correct:1,tip:"Verbos de movimiento usan <b>sein</b>: fahren → bin gefahren."},
{q:"El Partizip II de 'machen' es...",opts:["gemachen","gemacht","machte","macht"],correct:1,tip:"Regular: ge- + raíz + <b>-t</b>. machen → ge<b>mach</b>t."},
{q:"¿Qué verbos usan 'sein' en Perfekt?",opts:["Todos","De movimiento/cambio","Solo regulares","Ninguno"],correct:1,tip:"Verbos de <b>movimiento</b> (gehen, fahren, fliegen) y <b>cambio de estado</b> (sterben, werden) usan sein."},
{type:"fill",q:"Partizip II de 'lesen': 'Ich habe ein Buch _____.'",answer:["gelesen"],tip:"lesen es irregular: ge<b>lesen</b> (no gelest)."},
{type:"truefalse",sentence:"'Ich habe nach Berlin gefahren' es correcto.",correct:false,correction:"Ich bin nach Berlin gefahren. (fahren = movimiento → sein)",tip:"fahren es un verbo de movimiento → usa <b>sein</b>, no haben."},
]}]},
{id:"wechsel",icon:"📍",title:"Wechselpräpositionen",desc:"in, auf, an, vor, hinter, neben, zwischen, über, unter",level:"A2",
steps:[
{type:"teach",title:"¿Qué son las Wechselpräpositionen?",content:`
<div class="lc-explain">Son 9 preposiciones que cambian de caso según el contexto. La regla es simple:</div>
<table class="grammar-table">
<tr><th>Pregunta</th><th>Significa</th><th>Caso</th><th>Ejemplo</th></tr>
<tr><td class="highlight">Wo?</td><td>¿Dónde? (posición)</td><td>Dativ</td><td>Das Buch liegt <strong>auf dem</strong> Tisch.</td></tr>
<tr><td class="highlight">Wohin?</td><td>¿A dónde? (dirección)</td><td>Akkusativ</td><td>Ich lege das Buch <strong>auf den</strong> Tisch.</td></tr>
</table>
<div class="lc-explain" style="margin-top:10px">Las 9 preposiciones (memorízalas):</div>
<div class="example-box">
<div style="font-size:16px;font-weight:800;text-align:center;color:var(--primary)">in · auf · an · vor · hinter · neben · zwischen · über · unter</div>
<div style="font-size:12px;text-align:center;color:var(--text-light);margin-top:4px">en · sobre · en (vertical) · delante · detrás · al lado · entre · encima · debajo</div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Piénsalo así: si algo ya <strong>está</strong> en un lugar (no se mueve) → Dativ. Si algo <strong>va hacia</strong> un lugar (se mueve) → Akkusativ.</span></div>`},
{type:"teach",title:"Los verbos clave: posición vs. movimiento",content:`
<div class="lc-explain">En alemán hay pares de verbos: uno para <strong>posición</strong> (dónde está) y otro para <strong>movimiento</strong> (dónde lo pones):</div>
<table class="grammar-table">
<tr><th>Posición (Wo? → Dativ)</th><th>Movimiento (Wohin? → Akk)</th></tr>
<tr><td class="highlight">liegen (estar tumbado)</td><td class="highlight">legen (tumbar/poner)</td></tr>
<tr><td class="highlight">stehen (estar de pie)</td><td class="highlight">stellen (colocar de pie)</td></tr>
<tr><td class="highlight">hängen (estar colgado)</td><td class="highlight">hängen (colgar)</td></tr>
<tr><td class="highlight">sitzen (estar sentado)</td><td class="highlight">setzen (sentar)</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Die Lampe <strong>hängt</strong> an <strong>der</strong> Wand.</span><span class="ex-es">La lámpara cuelga en la pared. (Wo? → Dativ)</span><button class="speak-btn sm" onclick="speakBtn('Die Lampe hängt an der Wand',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>hänge</strong> die Lampe an <strong>die</strong> Wand.</span><span class="ex-es">Cuelgo la lámpara en la pared. (Wohin? → Akk)</span><button class="speak-btn sm" onclick="speakBtn('Ich hänge die Lampe an die Wand',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Das Buch <strong>liegt</strong> auf <strong>dem</strong> Tisch.</span><span class="ex-es">El libro está sobre la mesa.</span><button class="speak-btn sm" onclick="speakBtn('Das Buch liegt auf dem Tisch',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>lege</strong> das Buch auf <strong>den</strong> Tisch.</span><span class="ex-es">Pongo el libro sobre la mesa.</span><button class="speak-btn sm" onclick="speakBtn('Ich lege das Buch auf den Tisch',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error común:</strong> "Ich bin in die Schule" (estoy en la escuela). Mal — si ya estás ahí, es posición → Dativ: "Ich bin in <strong>der</strong> Schule". "In die Schule" significa que vas camino a ella.</span></div>`},
{type:"quiz",title:"Practica Wechselpräpositionen",questions:[
{q:"'El libro está sobre la mesa' = Wo? → usa...",opts:["Akkusativ","Dativ","Nominativ","Genitiv"],correct:1,tip:"<b>Wo?</b> (¿dónde? = posición) → <b>Dativ</b>."},
{q:"'Pongo el libro sobre la mesa' = Wohin? → usa...",opts:["Dativ","Nominativ","Akkusativ","Genitiv"],correct:2,tip:"<b>Wohin?</b> (¿a dónde? = movimiento) → <b>Akkusativ</b>."},
{q:"'stehen' (estar de pie) indica...",opts:["Movimiento → Akk","Posición → Dativ","Futuro","Pasado"],correct:1,tip:"stehen = estar de pie (posición). Posición → <b>Dativ</b>."},
{q:"'stellen' (colocar de pie) indica...",opts:["Posición → Dativ","Movimiento → Akk","Nominativ","Perfekt"],correct:1,tip:"stellen = colocar (movimiento). Movimiento → <b>Akkusativ</b>."},
{type:"truefalse",sentence:"'Das Bild hängt an die Wand' es correcto para 'El cuadro cuelga en la pared'.",correct:false,correction:"Das Bild hängt an der Wand. (hängt = posición → Dativ: der Wand)",tip:"hängt (intransitivo) = posición → <b>Dativ</b>: an <b>der</b> Wand."},
{type:"match",q:"Conecta verbo con caso",pairs:[{left:"liegen (estar)",right:"Dativ (Wo?)"},{left:"legen (poner)",right:"Akkusativ (Wohin?)"},{left:"stehen (estar)",right:"Dativ (Wo?)"},{left:"stellen (colocar)",right:"Akkusativ (Wohin?)"}]},
]}]},
{id:"konjunktivII",icon:"💭",title:"Konjunktiv II: könnte, würde",desc:"Hacer sugerencias y ser cortés",level:"A2",
steps:[
{type:"teach",title:"Sugerencias corteses",content:`
<div class="lc-explain">El <strong>Konjunktiv II</strong> se usa para sugerencias, deseos y ser cortés. Es el equivalente a "podría", "me gustaría", "debería" en español:</div>
<table class="grammar-table">
<tr><th>Infinitivo</th><th>Konjunktiv II</th><th>Uso</th></tr>
<tr><td>können</td><td class="highlight">könnte</td><td>podría</td></tr>
<tr><td>werden</td><td class="highlight">würde + Infinitiv</td><td>haría / -ría</td></tr>
<tr><td>sollen</td><td class="highlight">sollte</td><td>debería</td></tr>
<tr><td>haben</td><td class="highlight">hätte</td><td>tendría</td></tr>
<tr><td>sein</td><td class="highlight">wäre</td><td>sería/estaría</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Wir <strong>könnten</strong> montags joggen gehen.</span><span class="ex-es">Podríamos ir a correr los lunes.</span><button class="speak-btn sm" onclick="speakBtn('Wir könnten montags joggen gehen',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>würde</strong> gern ins Kino gehen.</span><span class="ex-es">Me gustaría ir al cine.</span><button class="speak-btn sm" onclick="speakBtn('Ich würde gern ins Kino gehen',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Du <strong>solltest</strong> mehr Sport machen.</span><span class="ex-es">Deberías hacer más deporte.</span><button class="speak-btn sm" onclick="speakBtn('Du solltest mehr Sport machen',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Das <strong>wäre</strong> super!</span><span class="ex-es">¡Eso sería genial!</span><button class="speak-btn sm" onclick="speakBtn('Das wäre super!',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Ich <strong>hätte</strong> gern ein Wasser.</span><span class="ex-es">Quisiera un agua (tendría con gusto).</span><button class="speak-btn sm" onclick="speakBtn('Ich hätte gern ein Wasser',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span><strong>würde + infinitivo</strong> es la forma comodín: funciona con cualquier verbo. "Ich <strong>würde</strong> gern Pizza <strong>essen</strong>" = Me gustaría comer pizza. El infinitivo va al final.</span></div>`},
{type:"teach",title:"Cuándo usar cada forma",content:`
<div class="lc-explain">Cada forma de Konjunktiv II tiene su contexto:</div>
<div class="example-box">
<div style="font-weight:700;color:#7C3AED;margin-bottom:6px">💭 Deseos (wenn + Konj. II):</div>
<div class="example-row"><span class="ex-de"><strong>Wenn</strong> ich reich <strong>wäre</strong>, <strong>würde</strong> ich reisen.</span><span class="ex-es">Si yo fuera rico, viajaría.</span><button class="speak-btn sm" onclick="speakBtn('Wenn ich reich wäre, würde ich reisen',this)">🔊</button></div>
<div style="font-weight:700;color:var(--secondary);margin-bottom:6px;margin-top:8px">🙋 Sugerencias corteses:</div>
<div class="example-row"><span class="ex-de"><strong>Könnten</strong> Sie mir bitte helfen?</span><span class="ex-es">¿Podría ayudarme por favor?</span><button class="speak-btn sm" onclick="speakBtn('Könnten Sie mir bitte helfen?',this)">🔊</button></div>
<div style="font-weight:700;color:var(--accent);margin-bottom:6px;margin-top:8px">💡 Consejos suaves:</div>
<div class="example-row"><span class="ex-de">Du <strong>solltest</strong> zum Arzt gehen.</span><span class="ex-es">Deberías ir al médico.</span><button class="speak-btn sm" onclick="speakBtn('Du solltest zum Arzt gehen',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error de hispanohablantes:</strong> Usar el presente para ser cortés ("Können Sie mir helfen?"). No es incorrecto, pero <strong>Könnten</strong> Sie... suena mucho más cortés, como la diferencia entre "¿Puede...?" y "¿Podría...?"</span></div>`},
{type:"quiz",title:"Practica Konjunktiv II",questions:[
{q:"'Podríamos ir a correr' = 'Wir _____ joggen gehen'",opts:["können","könnten","konnten","gekonnt"],correct:1,tip:"Konjunktiv II de können = <b>könnte/könnten</b> (podría/podrían)."},
{q:"'Me gustaría ir al cine' = 'Ich _____ gern ins Kino gehen'",opts:["will","werde","würde","wollte"],correct:2,tip:"<b>würde + infinitivo</b> = condicional general (haría, iría, comería...)."},
{q:"'könnte' es la forma de Konjunktiv II de...",opts:["wollen","sollen","können","müssen"],correct:2,tip:"können → <b>könnte</b>. sollen → sollte. müssen → müsste. wollen → wollte."},
{q:"'Du solltest' significa...",opts:["Tú puedes","Tú deberías","Tú quieres","Tú debes"],correct:1,tip:"<b>solltest</b> = deberías (consejo suave). Más suave que 'musst' (debes)."},
{type:"fill",q:"'Deberías dormir más' = 'Du _____ mehr schlafen.'",answer:["solltest"],tip:"sollen en Konjunktiv II: du <b>solltest</b>."},
{type:"truefalse",sentence:"'Ich würde gern nach Japan reisen' significa 'Voy a viajar a Japón'.",correct:false,correction:"Significa 'Me gustaría viajar a Japón' (deseo, no plan concreto).",tip:"<b>würde gern</b> = me gustaría (deseo hipotético), no un plan real."},
]}]},
{id:"nebensaetze",icon:"🔗",title:"Nebensätze: weil, dass, wenn",desc:"Oraciones subordinadas - el verbo va al final",level:"A2",
steps:[
{type:"teach",title:"El verbo al final — la regla más importante",content:`
<div class="lc-explain">En alemán, las oraciones principales tienen el verbo en <strong>posición 2</strong>. Pero en las oraciones subordinadas (Nebensätze), el verbo conjugado va al <strong>final</strong>. Compara:</div>
<div class="example-box">
<div style="font-weight:700;color:var(--secondary);margin-bottom:6px">🟢 Oración principal (verbo en posición 2):</div>
<div class="example-row"><span class="ex-de">Ich <strong>arbeite</strong> in Deutschland.</span><span class="ex-es">Trabajo en Alemania.</span></div>
<div style="font-weight:700;color:var(--primary);margin-bottom:6px;margin-top:8px">🔴 Nebensatz (verbo AL FINAL):</div>
<div class="example-row"><span class="ex-de">..., weil ich in Deutschland <strong>arbeite</strong>.</span><span class="ex-es">..., porque trabajo en Alemania.</span></div>
</div>
<div class="lc-explain">Los conectores que envían el verbo al final:</div>
<table class="grammar-table">
<tr><th>Conector</th><th>Significado</th><th>Ejemplo</th></tr>
<tr><td class="highlight">weil</td><td>porque</td><td>..., weil ich müde <strong>bin</strong></td></tr>
<tr><td class="highlight">dass</td><td>que</td><td>..., dass er morgen <strong>kommt</strong></td></tr>
<tr><td class="highlight">wenn</td><td>cuando / si</td><td>Wenn es kalt <strong>ist</strong>, ...</td></tr>
<tr><td class="highlight">obwohl</td><td>aunque</td><td>..., obwohl er krank <strong>ist</strong></td></tr>
<tr><td class="highlight">als</td><td>cuando (pasado)</td><td>Als ich klein <strong>war</strong>, ...</td></tr>
</table>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error #1 de hispanohablantes:</strong> Mantener el verbo en posición 2 después de weil/dass: "weil ich <strong>bin</strong> müde" ✗. Correcto: "weil ich müde <strong>bin</strong>" ✓. Es exactamente al revés de como funciona en español.</span></div>`},
{type:"teach",title:"Cada conector en contexto",content:`
<div class="lc-explain">Veamos cada conector con ejemplos completos y audio:</div>
<div class="example-box">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">weil = porque</div>
<div class="example-row"><span class="ex-de">Ich lerne Deutsch, <strong>weil</strong> ich in Deutschland <strong>arbeite</strong>.</span><span class="ex-es">Aprendo alemán porque trabajo en Alemania.</span><button class="speak-btn sm" onclick="speakBtn('Ich lerne Deutsch, weil ich in Deutschland arbeite',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er bleibt zu Hause, <strong>weil</strong> er krank <strong>ist</strong>.</span><span class="ex-es">Él se queda en casa porque está enfermo.</span><button class="speak-btn sm" onclick="speakBtn('Er bleibt zu Hause, weil er krank ist',this)">🔊</button></div>
<div style="font-weight:700;color:var(--primary);margin-bottom:6px;margin-top:10px">dass = que</div>
<div class="example-row"><span class="ex-de">Ich finde, <strong>dass</strong> Deutsch interessant <strong>ist</strong>.</span><span class="ex-es">Creo que el alemán es interesante.</span><button class="speak-btn sm" onclick="speakBtn('Ich finde, dass Deutsch interessant ist',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er sagt, <strong>dass</strong> er morgen <strong>kommt</strong>.</span><span class="ex-es">Él dice que viene mañana.</span><button class="speak-btn sm" onclick="speakBtn('Er sagt, dass er morgen kommt',this)">🔊</button></div>
<div style="font-weight:700;color:var(--primary);margin-bottom:6px;margin-top:10px">wenn = cuando / si</div>
<div class="example-row"><span class="ex-de"><strong>Wenn</strong> es warm <strong>ist</strong>, essen wir Salat.</span><span class="ex-es">Cuando hace calor, comemos ensalada.</span><button class="speak-btn sm" onclick="speakBtn('Wenn es warm ist, essen wir Salat',this)">🔊</button></div>
<div class="example-row"><span class="ex-de"><strong>Wenn</strong> ich Zeit <strong>habe</strong>, lese ich ein Buch.</span><span class="ex-es">Cuando tengo tiempo, leo un libro.</span><button class="speak-btn sm" onclick="speakBtn('Wenn ich Zeit habe, lese ich ein Buch',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Cuando el Nebensatz va <strong>primero</strong>, la oración principal empieza con el verbo: "<strong>Wenn</strong> es warm <strong>ist</strong>, <strong>essen</strong> wir Salat." El verbo principal ("essen") va justo después de la coma.</span></div>`},
{type:"teach",title:"Mini diálogo con Nebensätze",content:`
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Warum lernst du Deutsch?</div><div class="dl-es">¿Por qué aprendes alemán?</div></div><button class="speak-btn sm" onclick="speakBtn('Warum lernst du Deutsch?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text"><strong>Weil</strong> ich in München <strong>arbeite</strong> und <strong>weil</strong> meine Freundin Deutsche <strong>ist</strong>.</div><div class="dl-es">Porque trabajo en Múnich y porque mi novia es alemana.</div></div><button class="speak-btn sm" onclick="speakBtn('Weil ich in München arbeite und weil meine Freundin Deutsche ist.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Ich finde, <strong>dass</strong> du schon gut Deutsch <strong>sprichst</strong>!</div><div class="dl-es">¡Creo que ya hablas bien alemán!</div></div><button class="speak-btn sm" onclick="speakBtn('Ich finde, dass du schon gut Deutsch sprichst!',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Danke! <strong>Wenn</strong> ich mehr <strong>übe</strong>, <strong>werde</strong> ich noch besser.</div><div class="dl-es">¡Gracias! Cuando practique más, seré aún mejor.</div></div><button class="speak-btn sm" onclick="speakBtn('Danke! Wenn ich mehr übe, werde ich noch besser.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Fíjate en el último ejemplo: "<strong>Wenn</strong> ich mehr <strong>übe</strong>" — el Nebensatz va primero, entonces la oración principal empieza con el verbo "<strong>werde</strong> ich noch besser".</span></div>`},
{type:"quiz",title:"Practica Nebensätze",questions:[
{q:"En un Nebensatz con 'weil', el verbo va...",opts:["En segunda posición","Al principio","Al final","No cambia"],correct:2,tip:"Después de <b>weil/dass/wenn</b> el verbo conjugado va al <b>final</b>."},
{q:"'Aprendo alemán porque trabajo aquí' = 'Ich lerne Deutsch, weil ich hier _____'",opts:["arbeite","arbeiten","gearbeitet","arbeit"],correct:0,tip:"El verbo conjugado va al final del Nebensatz: weil ich hier <b>arbeite</b>."},
{q:"'dass' significa...",opts:["porque","cuando","que","si"],correct:2,tip:"<b>dass</b> = que. <b>weil</b> = porque. <b>wenn</b> = cuando/si."},
{q:"'Wenn es kalt ist, ...' = ...",opts:["Cuando hace frío...","Porque hace frío...","Que hace frío...","Si hace frío..."],correct:0,tip:"<b>wenn</b> = cuando (temporal) o si (condicional). Contexto decide cuál."},
{type:"truefalse",sentence:"'Ich bleibe zu Hause, weil ich bin krank.'",correct:false,correction:"Ich bleibe zu Hause, weil ich krank bin. (verbo al final)",tip:"En Nebensatz el verbo va al <b>final</b>: weil ich krank <b>bin</b>, no weil ich <b>bin</b> krank."},
{type:"fill",q:"'Creo que él viene mañana' = 'Ich glaube, dass er morgen _____.'",answer:["kommt"],tip:"El verbo conjugado va al final del dass-Satz: dass er morgen <b>kommt</b>."},
]}]},
{id:"komparativ",icon:"📊",title:"Komparativ und Superlativ",desc:"Más grande, más bonito, el mejor...",level:"A2",
steps:[
{type:"teach",title:"Comparar cosas",content:`
<div class="lc-explain">En alemán se añade <strong>-er</strong> para comparativo y <strong>am -sten</strong> para superlativo:</div>
<table class="grammar-table">
<tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>
<tr><td>schnell (rápido)</td><td class="highlight">schneller</td><td class="highlight">am schnellsten</td></tr>
<tr><td>schön (bonito)</td><td class="highlight">schöner</td><td class="highlight">am schönsten</td></tr>
<tr><td>groß (grande)</td><td class="highlight">größer</td><td class="highlight">am größten</td></tr>
<tr><td>gut (bueno)</td><td class="highlight">besser</td><td class="highlight">am besten</td></tr>
<tr><td>gern (con gusto)</td><td class="highlight">lieber</td><td class="highlight">am liebsten</td></tr>
<tr><td>viel (mucho)</td><td class="highlight">mehr</td><td class="highlight">am meisten</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Berlin ist <strong>größer</strong> als München.</span><span class="ex-es">Berlín es más grande que Múnich.</span></div>
<div class="example-row"><span class="ex-de">Ich schwimme <strong>lieber</strong> als ich jogge.</span><span class="ex-es">Prefiero nadar a correr.</span></div>
<div class="example-row"><span class="ex-de">Das ist <strong>am besten</strong>!</span><span class="ex-es">¡Eso es lo mejor!</span></div>
</div>
<div class="tip-box"><span class="tip-icon">💡</span><span>Comparativo usa <strong>als</strong> (que): schneller <strong>als</strong>. Igualdad usa <strong>so...wie</strong>: so groß <strong>wie</strong>. Muchos adjetivos cortos con a/o/u añaden Umlaut: alt→<strong>älter</strong>, groß→<strong>größer</strong>.</span></div>`},
{type:"teach",title:"Errores comunes y los irregulares",content:`
<div class="lc-explain">Los 3 irregulares más importantes — hay que memorizarlos porque no siguen el patrón:</div>
<table class="grammar-table">
<tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>
<tr><td>gut (bueno)</td><td class="highlight">besser</td><td class="highlight">am besten</td></tr>
<tr><td>viel (mucho)</td><td class="highlight">mehr</td><td class="highlight">am meisten</td></tr>
<tr><td>gern (con gusto)</td><td class="highlight">lieber</td><td class="highlight">am liebsten</td></tr>
<tr><td>hoch (alto)</td><td class="highlight">höher</td><td class="highlight">am höchsten</td></tr>
<tr><td>nah (cerca)</td><td class="highlight">näher</td><td class="highlight">am nächsten</td></tr>
</table>
<div class="lc-explain" style="margin-top:10px">Mini diálogo:</div>
<div class="dialogue-box">
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Welche Stadt findest du <strong>schöner</strong>: Berlin oder München?</div><div class="dl-es">¿Qué ciudad te parece más bonita: Berlín o Múnich?</div></div><button class="speak-btn sm" onclick="speakBtn('Welche Stadt findest du schöner: Berlin oder München?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">München ist schöner, aber Berlin ist <strong>interessanter</strong>.</div><div class="dl-es">Múnich es más bonita, pero Berlín es más interesante.</div></div><button class="speak-btn sm" onclick="speakBtn('München ist schöner, aber Berlin ist interessanter.',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👩</span><div><div class="dl-text">Und welche ist <strong>am größten</strong>?</div><div class="dl-es">¿Y cuál es la más grande?</div></div><button class="speak-btn sm" onclick="speakBtn('Und welche ist am größten?',this)">🔊</button></div>
<div class="dialogue-line"><span class="dl-speaker">👨</span><div><div class="dl-text">Berlin ist <strong>am größten</strong>. Es ist <strong>größer als</strong> Hamburg.</div><div class="dl-es">Berlín es la más grande. Es más grande que Hamburgo.</div></div><button class="speak-btn sm" onclick="speakBtn('Berlin ist am größten. Es ist größer als Hamburg.',this)">🔊</button></div>
</div>
<div class="tip-box"><span class="tip-icon">⚠️</span><span><strong>Error #1:</strong> Usar "wie" en vez de "als" al comparar: "größer <strong>wie</strong>" ✗ → "größer <strong>als</strong>" ✓. <strong>als</strong> = que (comparar cosas diferentes). <strong>wie</strong> = como (igualdad: so groß <strong>wie</strong>).</span></div>`},
{type:"quiz",title:"Practica comparaciones",questions:[
{q:"'Más grande que' = '_____ als'",opts:["großer","größer","am größten","groß"],correct:1,tip:"Comparativo de groß = <b>größer</b> (con Umlaut). + <b>als</b> = que."},
{q:"El comparativo de 'gut' es...",opts:["guter","güter","besser","am besten"],correct:2,tip:"gut → <b>besser</b> → am besten. Es completamente irregular."},
{q:"'Am besten' es el _____ de 'gut'",opts:["Comparativo","Superlativo","Positivo","Dativo"],correct:1,tip:"<b>am ...sten</b> = superlativo. am besten = lo mejor."},
{q:"'Tan grande como' = 'so groß _____'",opts:["als","wie","dass","weil"],correct:1,tip:"Igualdad: so ... <b>wie</b>. Comparación: ...-er <b>als</b>."},
{type:"fill",q:"Comparativo de 'schnell' (rápido): _____",answer:["schneller"],tip:"Regular: schnell + <b>-er</b> = <b>schneller</b>."},
{type:"truefalse",sentence:"'Berlin ist größer wie München' es correcto.",correct:false,correction:"Berlin ist größer als München. (comparativo usa 'als', no 'wie')",tip:"Comparativo siempre con <b>als</b> (que). Igualdad con <b>wie</b> (como)."},
{type:"match",q:"Conecta forma con tipo",pairs:[{left:"schnell",right:"Positiv"},{left:"schneller",right:"Komparativ"},{left:"am schnellsten",right:"Superlativ"},{left:"besser",right:"Komparativ"}]},
]}]},
{id:"reflexive_verbs",icon:"🪞",title:"Verbos reflexivos",desc:"sich freuen, sich fühlen, sich treffen...",level:"A2",
steps:[
{type:"teach",title:"¿Qué son los verbos reflexivos?",content:`
<div class="lc-explain">Los verbos reflexivos llevan un pronombre que se refiere al sujeto (<strong>sich</strong> = "se"). El pronombre cambia con cada persona:</div>
<table class="grammar-table">
<tr><th>Persona</th><th>Pronombre</th><th>sich freuen</th></tr>
<tr><td>ich</td><td class="highlight">mich</td><td>ich freue <strong>mich</strong></td></tr>
<tr><td>du</td><td class="highlight">dich</td><td>du freust <strong>dich</strong></td></tr>
<tr><td>er/sie/es</td><td class="highlight">sich</td><td>er freut <strong>sich</strong></td></tr>
<tr><td>wir</td><td class="highlight">uns</td><td>wir freuen <strong>uns</strong></td></tr>
<tr><td>ihr</td><td class="highlight">euch</td><td>ihr freut <strong>euch</strong></td></tr>
<tr><td>sie/Sie</td><td class="highlight">sich</td><td>sie freuen <strong>sich</strong></td></tr>
</table>
<div class="tip-box"><span class="tip-icon">💡</span><span>En el diccionario aparecen con <strong>sich</strong>: sich freuen, sich fühlen. Ese "sich" te indica que es reflexivo.</span></div>`},
{type:"teach",title:"Verbos reflexivos importantes",content:`
<div class="lc-explain">Estos verbos reflexivos aparecen mucho en el examen A2:</div>
<table class="grammar-table">
<tr><th>Verbo</th><th>Significado</th><th>Preposición</th></tr>
<tr><td class="highlight">sich freuen auf</td><td>alegrarse por (futuro)</td><td>+ Akkusativ</td></tr>
<tr><td class="highlight">sich freuen über</td><td>alegrarse por (presente)</td><td>+ Akkusativ</td></tr>
<tr><td class="highlight">sich interessieren für</td><td>interesarse por</td><td>+ Akkusativ</td></tr>
<tr><td class="highlight">sich fühlen</td><td>sentirse</td><td>—</td></tr>
<tr><td class="highlight">sich treffen mit</td><td>encontrarse con</td><td>+ Dativ</td></tr>
<tr><td class="highlight">sich bewerben um</td><td>postularse a</td><td>+ Akkusativ</td></tr>
<tr><td class="highlight">sich kümmern um</td><td>ocuparse de</td><td>+ Akkusativ</td></tr>
<tr><td class="highlight">sich erinnern an</td><td>recordar</td><td>+ Akkusativ</td></tr>
</table>
<div class="example-box">
<div class="example-row"><span class="ex-de">Ich freue <strong>mich</strong> auf den Urlaub.</span><span class="ex-es">Me alegro por las vacaciones.</span><button class="speak-btn sm" onclick="speakBtn('Ich freue mich auf den Urlaub',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Er fühlt <strong>sich</strong> krank.</span><span class="ex-es">Él se siente enfermo.</span><button class="speak-btn sm" onclick="speakBtn('Er fühlt sich krank',this)">🔊</button></div>
<div class="example-row"><span class="ex-de">Wir treffen <strong>uns</strong> morgen.</span><span class="ex-es">Nos encontramos mañana.</span><button class="speak-btn sm" onclick="speakBtn('Wir treffen uns morgen',this)">🔊</button></div>
</div>`},
{type:"quiz",title:"Practica verbos reflexivos",questions:[
{q:"ich / sich freuen → ich freue _____",opts:["sich","mich","dich","uns"],correct:1,tip:"Con <b>ich</b> el pronombre reflexivo es <b>mich</b>. ich→mich, du→dich, er→sich, wir→uns, ihr→euch, sie→sich."},
{q:"wir / sich treffen → wir treffen _____",opts:["sich","euch","uns","mich"],correct:2,tip:"Con <b>wir</b> el pronombre reflexivo es <b>uns</b>."},
{q:"du / sich fühlen → du fühlst _____",opts:["mich","sich","uns","dich"],correct:3,tip:"Con <b>du</b> el pronombre reflexivo es <b>dich</b>."},
{q:"'sich freuen auf' lleva caso...",opts:["Nominativ","Dativ","Akkusativ","Genitiv"],correct:2,tip:"sich freuen <b>auf</b> + Akkusativ (para algo futuro). sich freuen <b>über</b> + Akkusativ (para algo presente)."},
{q:"er / sich interessieren → er interessiert _____",opts:["mich","dich","sich","uns"],correct:2,tip:"Con <b>er/sie/es</b> y con <b>sie (plural)/Sie</b> el pronombre reflexivo es siempre <b>sich</b>."},
{type:"fill",q:"Completa: 'Wir treffen _____ morgen.' (sich treffen)",answer:["uns"],tip:"Con <b>wir</b> el pronombre reflexivo es <b>uns</b>."},
{type:"truefalse",sentence:"Ich interessiere sich für Sport.",correct:false,correction:"Ich interessiere mich für Sport.",tip:"Con <b>ich</b> el reflexivo es <b>mich</b>, no sich. 'sich' solo se usa con er/sie/es y sie/Sie."},
{type:"match",q:"Conecta pronombre con reflexivo",pairs:[{left:"ich",right:"mich"},{left:"du",right:"dich"},{left:"wir",right:"uns"},{left:"ihr",right:"euch"}]},
]}
]},
{id:"trennbar_untrennbar",icon:"✂️",title:"Separable vs. Inseparable",desc:"aufstehen vs. verstehen — ¿cuándo se separa?",level:"A2",
steps:[
{type:"teach",title:"Verbos separables (trennbar)",content:`
<div class="lc-explain">Los verbos separables tienen un prefijo que se <strong>separa</strong> y va al final en presente:</div>
<table class="grammar-table">
<tr><th>Infinitivo</th><th>En presente</th><th>Significado</th></tr>
<tr><td class="highlight">aufstehen</td><td>Ich <strong>stehe</strong> um 7 <strong>auf</strong>.</td><td>levantarse</td></tr>
<tr><td class="highlight">anrufen</td><td>Ich <strong>rufe</strong> dich <strong>an</strong>.</td><td>llamar por tel.</td></tr>
<tr><td class="highlight">einkaufen</td><td>Wir <strong>kaufen</strong> heute <strong>ein</strong>.</td><td>hacer compras</td></tr>
<tr><td class="highlight">anfangen</td><td>Der Film <strong>fängt</strong> um 8 <strong>an</strong>.</td><td>empezar</td></tr>
<tr><td class="highlight">mitnehmen</td><td>Ich <strong>nehme</strong> dich <strong>mit</strong>.</td><td>llevar consigo</td></tr>
</table>
<div class="lc-explain" style="margin-top:10px">Prefijos separables (con acento): <strong>ab-, an-, auf-, aus-, bei-, ein-, mit-, nach-, vor-, zu-, zurück-</strong></div>
<div class="tip-box"><span class="tip-icon">💡</span><span>En Perfekt el <strong>ge-</strong> va entre el prefijo y el verbo: <strong>auf-ge-standen</strong>, <strong>ein-ge-kauft</strong>, <strong>an-ge-rufen</strong>.</span></div>`},
{type:"teach",title:"Verbos inseparables (untrennbar)",content:`
<div class="lc-explain">Los verbos inseparables tienen un prefijo que <strong>nunca se separa</strong>:</div>
<table class="grammar-table">
<tr><th>Infinitivo</th><th>En presente</th><th>Significado</th></tr>
<tr><td class="highlight">verstehen</td><td>Ich <strong>verstehe</strong> das.</td><td>entender</td></tr>
<tr><td class="highlight">bekommen</td><td>Er <strong>bekommt</strong> ein Geschenk.</td><td>recibir</td></tr>
<tr><td class="highlight">empfehlen</td><td>Ich <strong>empfehle</strong> das Restaurant.</td><td>recomendar</td></tr>
<tr><td class="highlight">erklären</td><td>Sie <strong>erklärt</strong> die Grammatik.</td><td>explicar</td></tr>
<tr><td class="highlight">vergessen</td><td>Ich <strong>vergesse</strong> das nie.</td><td>olvidar</td></tr>
</table>
<div class="lc-explain" style="margin-top:10px">Prefijos inseparables (sin acento): <strong>be-, emp-, ent-, er-, ge-, miss-, ver-, zer-</strong></div>
<div class="example-box">
<div class="example-row"><span class="ex-de"><strong>auf</strong>stehen → Ich stehe <strong>auf</strong>.</span><span class="ex-es">separable ✂️</span></div>
<div class="example-row"><span class="ex-de"><strong>ver</strong>stehen → Ich <strong>ver</strong>stehe.</span><span class="ex-es">inseparable 🔒</span></div>
</div>

let lessonState={currentLesson:null,currentStep:0,quizIndex:0,quizCorrect:0,quizTotal:0};

function renderLessonsTab(){
  const el=document.getElementById('tab-home');
  if(lessonState.currentLesson!==null){renderLessonView();return;}
  if(readingState.current!==null){renderReadingView();return;}
  const activeLessons=getActiveLessons();
  const completedLessons=data.completedLessons||[];
  const doneCount=activeLessons.filter(l=>completedLessons.includes(l.id)).length;

  const activeReadings_=getActiveReadings();
  const completedReadings_=data.completedReadings||[];
  const doneReadings=activeReadings_.filter(r=>completedReadings_.includes(r.id)).length;

  el.innerHTML=`<div class="prog-section"><h3>📚 ${t('lessonsA1').replace('A1',getActiveLevel())}</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">${doneCount}/${activeLessons.length} ${t('completed')}</div>
    <div class="lesson-list">${activeLessons.map((l,i)=>{
      const globalIdx=LESSONS.indexOf(l);
      const done=completedLessons.includes(l.id);
      const score=(data.lessonScores||{})[l.id];
      return`<div class="lesson-card ${done?'completed':''}" onclick="openLesson(${globalIdx})">
        <span class="lc-num">${i+1}</span>
        <span class="lc-icon">${l.icon}</span>
        <div class="lc-info"><div class="lc-title">${l.title}</div><div class="lc-desc">${l.desc}</div></div>
        ${done ? `<span class="lc-badge done" title="Lección completada">✓</span>${score ? `<span class="lc-badge" style="background:${score>=90?'#FEF3C7':score>=70?'#FFF1E0':'#FEE2E2'};color:${score>=90?'#92400E':score>=70?'#9A3412':'#991B1B'};border:none" title="${score}% aciertos — ${score>=90?'Dominada':'Repasa para mejorar'}">${score>=90?'⭐⭐⭐':score>=70?'⭐⭐':'⭐'}</span>` : ''}` : `<span class="lc-badge new" title="Aún no has hecho esta lección">${t('pending')}</span>`}
      </div>`;
    }).join("")}</div></div>
    <div class="prog-section"><h3>📖 ${t('readingsA1').replace('A1',getActiveLevel())}</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px">${doneReadings}/${activeReadings_.length} ${t('completed')}</div>
    ${activeReadings_.map((r,i)=>{
      const globalIdx=READINGS.indexOf(r);
      const done=completedReadings_.includes(r.id);
      return`<div class="reading-list-card" onclick="openReading(${globalIdx})">
        <span class="lc-num">${i+1}</span>
        <span class="lc-icon">${r.icon}</span>

function openReading(idx){
  readingState.current=idx;
  readingState.showTranslations=false;
  readingState.quizIndex=0;
  readingState.quizCorrect=0;
  readingState.quizDone=false;
  renderLessonsTab();
}

  const r=READINGS[readingState.current];
  const totalSteps=r.lines.length;

  let linesHtml=r.lines.map((l,i)=>{
    const words=l.de.split(/(\s+)/).map(w=>{
      if(w.trim()==='')return w;
      return`<span class="rl-word" onclick="event.stopPropagation();showWordInfo('${escapeStr(w.replace(/[.,!?:;]/g,''))}')">${w}</span>`;
    }).join('');
    return`<div class="reading-line" onclick="speakLine(this,'${escapeStr(l.de)}')">
      <span class="rl-num">${i+1}</span>
      <div class="rl-content"><div class="rl-de">${words}</div>
      <div class="rl-es ${readingState.showTranslations?'show':''}">${l.es}</div></div>
      <button class="speak-btn sm rl-speak" onclick="event.stopPropagation();speakBtn('${escapeStr(l.de)}',this)">🔊</button>
    </div>`;
  }).join('');

  let quizHtml='';
  if(readingState.quizDone){
    const pct=Math.round(readingState.quizCorrect/r.quiz.length*100);
    const xp=readingState.quizCorrect*10;
    if(!data.completedReadings)data.completedReadings=[];
    if(!data.completedReadings.includes(r.id)){data.completedReadings.push(r.id);data.xp+=xp;saveData();renderLevelBar();}
    quizHtml=`<div class="reading-quiz"><div style="text-align:center"><div style="font-size:32px;margin-bottom:6px">${pct>=75?'🏆':'📚'}</div>
      <div style="font-weight:800">${pct>=75?'¡Excelente comprensión!':'¡Sigue practicando!'}</div>
      <div style="font-size:13px;color:var(--text-light)">${readingState.quizCorrect}/${r.quiz.length} correctas · +${xp} XP</div></div></div>`;
  } else {
    const q=r.quiz[readingState.quizIndex];
    quizHtml=`<div class="reading-quiz">
      <div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px">📝 Comprensión ${readingState.quizIndex+1}/${r.quiz.length}</div>
      <div class="rq-question">${q.q}</div>
      <div class="rq-options">${q.opts.map((o,i)=>`<button class="rq-opt" onclick="checkReadingQuiz(this,${i},${q.correct})">${o}</button>`).join('')}</div>
      <div id="rqFeedback"></div>
    </div>`;
  }

  el.innerHTML=`<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="closeReadingFromLessons()">←</button>
      <div class="lesson-title">${r.icon} ${r.title}</div>
      <span class="rc-level">${r.level}</span>
    </div>
    <div class="reading-controls">
      <button class="rc-btn" onclick="speakFullText(${readingState.current})">🔊 Escuchar todo</button>
      <button class="rc-btn" onclick="speakFullText(${readingState.current},0.7)">🐢 Lento</button>
      <button class="rc-btn ${readingState.showTranslations?'active':''}" onclick="toggleTranslationsInLessons()">🔤 Traducción</button>
    </div>
    <div class="reading-card">${linesHtml}</div>
    ${quizHtml}
  </div>`;
}

function closeReadingFromLessons(){
  readingState.current=null;
  renderLessonsTab();
}

function toggleTranslationsInLessons(){
  readingState.showTranslations=!readingState.showTranslations;
  renderLessonsTab();
}

function openLesson(idx){
  lessonState.currentLesson=idx;lessonState.currentStep=0;lessonState.quizIndex=0;lessonState.quizCorrect=0;lessonState.quizTotal=0;lessonState.missedQs=[];lessonState.retryMode=false;
  lessonMemState={cards:[],flipped:[],matched:[],locked:false};
  renderLessonsTab();
}

function closeLessonView(){
  lessonState.currentLesson=null;renderHomeTab();
}

function renderLessonView(){
  const el=document.getElementById('tab-home');
  const lesson=LESSONS[lessonState.currentLesson];
  if(!lesson){closeLessonView();return;}
  const step=lesson.steps[lessonState.currentStep];
  if(!step){closeLessonView();return;}
  const totalSteps=lesson.steps.length;
  const pct=((lessonState.currentStep+1)/totalSteps)*100;

  let contentHtml='';
  const noteKey = lesson.id;
  const hasNotes = getLessonNotes(noteKey).length > 0;
  if(step.type==='teach'){
    contentHtml=`${step.content}
    <div class="lesson-nav">
      ${lessonState.currentStep>0?'<button class="lesson-nav-btn prev" onclick="lessonPrev()">← Anterior</button>':''}
      <button class="lesson-nav-btn next" onclick="lessonNext()">${lessonState.currentStep<totalSteps-1?'Siguiente →':'Finalizar ✓'}</button>
    </div>`;
  } else if(step.type==='memory'){
    contentHtml=renderLessonMemory(lesson);
  } else if(step.type==='quiz'){
    contentHtml=renderLessonQuiz(step);
  }

  el.innerHTML=`<div class="lesson-view">
    <div class="lesson-header">
      <button class="lesson-back" onclick="closeLessonView()">←</button>
      <div class="lesson-title">${lesson.icon} ${lesson.title}</div>
      <div class="lesson-step">${lessonState.currentStep+1}/${totalSteps}</div>
    </div>
    <div class="lesson-progress"><div class="lesson-progress-fill" style="width:${pct}%"></div></div>
    <div class="lesson-content">
      <div class="lc-section-title">${step.title}</div>
      ${contentHtml}
      <button class="notes-toggle ${hasNotes?'has-notes':''}" onclick="toggleLessonNotes('${noteKey}')" style="margin-top:12px">📝 ${hasNotes?'Mis apuntes':'Tomar apuntes'}</button>
      <div id="lessonNotesArea" style="display:none"></div>
    </div>
  </div>`;
}

function renderLessonQuiz(step){
  if(!lessonState.missedQs) lessonState.missedQs = [];
  if(!lessonState.retryMode) lessonState.retryMode = false;

  const questions = lessonState.retryMode ? lessonState.missedQs : step.questions;

  if(lessonState.quizIndex >= questions.length){
    if(!lessonState.retryMode && lessonState.missedQs.length > 0){
      return`<div style="text-align:center;padding:20px 0">
        <div style="font-size:48px;margin-bottom:8px">🔄</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:4px">Repasemos los errores</div>
        <div style="font-size:13px;color:var(--text-light);margin-bottom:16px">Fallaste ${lessonState.missedQs.length} pregunta${lessonState.missedQs.length>1?'s':''}. Vamos a repasarlas.</div>
        <button class="start-btn" style="font-size:14px" onclick="startLessonRetry()">Repasar errores →</button>
      </div>`;
    }
    const pct=Math.round(lessonState.quizCorrect/lessonState.quizTotal*100);
    const passed = pct >= 60;
    const emoji=pct>=90?'🏆':pct>=75?'⭐':pct>=60?'💪':'📚';
    const xpEarned=lessonState.quizCorrect*15;
    data.xp+=xpEarned;
    if(!data.completedLessons)data.completedLessons=[];
    const lid=LESSONS[lessonState.currentLesson].id;
    if(passed && !data.completedLessons.includes(lid))data.completedLessons.push(lid);
    if(!data.lessonScores)data.lessonScores={};
    if(!data.lessonScores[lid]||pct>data.lessonScores[lid])data.lessonScores[lid]=pct;
    saveData();renderLevelBar();
    const msg = passed
      ? (pct>=90?'¡Excelente! Dominaste esta lección.':'¡Bien hecho! Lección completada.')
      : '¡Sigue practicando! Necesitas 60% para completar la lección.';
    const suggestedMode = getLessonSuggestedMode(lid);
    return`<div style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:8px">${emoji}</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:4px">${msg}</div>
      <div style="font-size:14px;color:var(--text-light);margin-bottom:6px">${lessonState.quizCorrect}/${lessonState.quizTotal} correctas — ${pct}% · +${xpEarned} XP</div>
      ${!passed?'<div style="font-size:12px;color:var(--wrong);font-weight:600;margin-bottom:12px">Necesitas al menos 60% para marcar la lección como completada</div>':''}
      ${passed && suggestedMode ? `<div style="margin:12px 0;padding:12px;background:linear-gradient(135deg,var(--secondary-light),#EEF2FF);border-radius:10px;border:1px solid rgba(45,106,79,0.2)">
        <div style="font-size:11px;font-weight:700;color:var(--secondary);text-transform:uppercase;margin-bottom:4px">Siguiente paso recomendado</div>
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">${suggestedMode.text}</div>
        <button class="start-btn" style="font-size:13px;padding:8px 20px;background:var(--secondary);box-shadow:0 4px 12px rgba(45,106,79,0.3)" onclick="goToMode('${suggestedMode.mode}')">${suggestedMode.icon} Practicar ${suggestedMode.label}</button>
      </div>` : ''}
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="start-btn" style="font-size:14px;background:#94A3B8;box-shadow:none" onclick="retakeLessonQuiz()">Repetir quiz 🔄</button>
        <button class="start-btn" style="font-size:14px" onclick="goToNextLesson()">Siguiente lección →</button>
      </div>
    </div>`;
  }
  const q = questions[lessonState.quizIndex];
  const qNum = lessonState.quizIndex + 1;
  const qTotal = questions.length;
  const retryLabel = lessonState.retryMode ? '<span style="color:var(--accent);font-size:11px;font-weight:700">🔄 REPASO</span><br>' : '';
  const header = `<div style="font-size:11px;color:var(--text-light);margin-bottom:8px;text-align:center">${retryLabel}Pregunta ${qNum} de ${qTotal}</div>`;

  if (q.type === 'fill') {
    return `<div class="quiz-in-lesson">${header}
      <div style="font-size:14px;font-weight:600;margin-bottom:14px;text-align:center">${q.q}</div>
      <div class="input-area">
        <input class="text-input" id="lessonFillInput" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" autofocus>
        <button class="check-btn" onclick="checkLessonFill()">Comprobar ✓</button>
      </div>
      <div id="lessonQuizFb"></div>
    </div>`;
  }

  if (q.type === 'truefalse') {
    return `<div class="quiz-in-lesson">${header}
      <div class="tf-sentence">${q.sentence}</div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:10px;text-align:center">¿Es correcta esta oración?</div>
      <div class="tf-btns">
        <button class="tf-btn" onclick="checkLessonTF(this,true)">✅ Correcto</button>
        <button class="tf-btn" onclick="checkLessonTF(this,false)">❌ Incorrecto</button>
      </div>
      <div id="lessonQuizFb"></div>
    </div>`;
  }

  if (q.type === 'match') {
    if (!lessonState.matchState) {
      let shuffledRight = q.pairs.map((p, i) => ({ val: p.right, origIdx: i }));
      let attempts = 0;
      do { shuffledRight = shuffle(shuffledRight); attempts++; }
      while (attempts < 10 && shuffledRight.every((item, i) => item.origIdx === i));
      lessonState.matchState = { selected: null, matched: [], wrongPair: null, shuffledRight };
    }
    const ms = lessonState.matchState;
    const leftItems = q.pairs.map((p, i) => {
      const isMatched = ms.matched.includes(i);
      const cls = isMatched ? 'matched' : (ms.selected && ms.selected.side === 'left' && ms.selected.idx === i ? 'selected' : '');
      return `<div class="match-item ${cls}" data-side="left" data-idx="${i}" onclick="matchSelect('left',${i})">${p.left}</div>`;
    }).join('');
    const rightItems = ms.shuffledRight.map((item, i) => {
      const isMatched = ms.matched.includes(item.origIdx);
      const cls = isMatched ? 'matched' : (ms.selected && ms.selected.side === 'right' && ms.selected.idx === i ? 'selected' : '');
      return `<div class="match-item ${cls}" data-side="right" data-idx="${i}" onclick="matchSelect('right',${i})">${item.val}</div>`;
    }).join('');
    return `<div class="quiz-in-lesson">${header}
      <div style="font-size:14px;font-weight:600;margin-bottom:12px;text-align:center">${q.q}</div>
      <div class="match-grid">
        <div>${leftItems}</div>
        <div>${rightItems}</div>
      </div>
      <div id="lessonQuizFb"></div>
    </div>`;
  }

  return`<div class="quiz-in-lesson">${header}
    <div style="font-size:14px;font-weight:600;margin-bottom:14px;text-align:center">${q.q}</div>
    <div class="options">${q.opts.map((o,i)=>`<button class="option-btn" onclick="checkLessonQuiz(this,${i},${q.correct})">${o}</button>`).join("")}</div>
    <div id="lessonQuizFb"></div>
  </div>`;
}
